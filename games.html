<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('✅ Service Worker registered'))
      .catch(err => console.log('❌ Service Worker failed:', err));
  });

</head>
<body data-page-title="Games">
<div id="loading-screen">
  <div class="bg-canvas">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  
  <div class="loading-dots">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
  
  <div class="loading-progress-wrap">
    <div class="loading-progress-bar">
      <div class="loading-progress-fill" id="loading-progress-fill"></div>
    </div>
    <div class="loading-progress-text" id="loading-progress-text">0%</div>
  </div>
  
  <div class="loading-status">
    <div class="loading-status-friendly" id="loading-status-friendly">Initializing...</div>
    <div class="loading-status-technical" id="loading-status-technical">Starting up</div>
  </div>
  
  <div class="loading-error" id="loading-error">
    <div class="loading-error-friendly" id="loading-error-friendly"></div>
    <div class="loading-error-technical" id="loading-error-technical"></div>
    <div class="loading-error-bar">
      <div class="loading-error-fill"></div>
    </div>
    <button class="loading-retry-btn" id="loading-retry-btn" onclick="retryLoading()">
      <i class="fas fa-redo"></i> Retry
    </button>
  </div>
  
  <div class="loading-debug-hint">[ESC] force show</div>

  <div class="loading-ad-slot" id="loading-ad-slot"></div>
</div>

<div class="bg-canvas"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="toast" id="toast"></div>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="window.toggleSidebar()"></div>
<div class="mobile-menu" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>

<div id="app-header"></div>
<div id="app-sidebar"></div>

<main class="main">
  <div class="page-header">
    <div>
      <h1>Games</h1>
      <p id="games-subtitle">loading...</p>
    </div>
  </div>

  <!-- Category filter tabs -->
  <div class="games-tabs" id="games-tabs">
    <button class="games-tab active" data-category="all" onclick="window.switchCategory('all')">
      <i class="fas fa-layer-group"></i> All
    </button>
    <button class="games-tab" data-category="arcade" onclick="window.switchCategory('arcade')">
      <i class="fas fa-ghost"></i> Arcade
    </button>
    <button class="games-tab" data-category="puzzle" onclick="window.switchCategory('puzzle')">
      <i class="fas fa-puzzle-piece"></i> Puzzle
    </button>
    <button class="games-tab" data-category="action" onclick="window.switchCategory('action')">
      <i class="fas fa-bolt"></i> Action
    </button>
    <button class="games-tab" data-category="sandbox" onclick="window.switchCategory('sandbox')">
      <i class="fas fa-cube"></i> Sandbox
    </button>
    <button class="games-tab" data-category="sports" onclick="window.switchCategory('sports')">
      <i class="fas fa-futbol"></i> Sports
    </button>
    <button class="games-tab" data-category="multiplayer" onclick="window.switchCategory('multiplayer')">
      <i class="fas fa-users"></i> Multiplayer
    </button>
  </div>

  <div class="games-grid" id="games-grid">
    <!-- Game cards rendered by JS -->
  </div>
</main>

<div id="app-downbar"></div>
<div id="app-downbar-more"></div>

<script>
// ═══════════════════════════════════════════════════════════
// ── GAMES HUB PAGE ──
// ═══════════════════════════════════════════════════════════

let allGames = [];
let myPlaytime = {};   // { game_id: total_seconds }
let currentCategory = 'all';

function definePageSteps() {
  defineLoadingSteps([
    { id: 'theme', label: 'Loading theme...', technical: 'Applying saved theme preferences' },
    { id: 'auth', label: 'Connecting to Supabase...', technical: 'Checking authentication' },
    { id: 'profile', label: 'Loading your profile...', technical: 'Fetching user data' },
    { id: 'pfp', label: 'Loading profile pictures...', technical: 'Caching avatars' },
    { id: 'games', label: 'Loading games...', technical: 'Fetching from database' },
    { id: 'online', label: 'Loading online users...', technical: 'Counting active users' },
    { id: 'notifs', label: 'Loading notifications...', technical: 'Checking unread count' },
    { id: 'ready', label: 'Done! ✨', technical: 'Games ready' }
  ]);
}

function formatPlaytime(totalSeconds) {
  if (!totalSeconds || totalSeconds < 1) return null;
  const s = Math.floor(totalSeconds);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

async function loadGames() {
  try {
    const { data, error } = await window.supabaseClient
      .from('games')
      .select('id, slug, title, description, thumbnail_url, embed_url, category, icon, accent_color, plays, featured, created_at')
      .eq('active', true)
      .order('featured', { ascending: false })
      .order('created_at', { ascending: false });

    if (error) {
      console.error('loadGames:', error);
      allGames = [];
      return;
    }
    allGames = data || [];
  } catch (e) {
    console.error('loadGames exception:', e);
    allGames = [];
  }
}

async function loadMyPlaytime() {
  if (!window.session) return;
  try {
    const { data, error } = await window.supabaseClient
      .from('game_playtime')
      .select('game_id, total_seconds')
      .eq('user_id', window.session.user.id);
    if (error) {
      console.error('loadMyPlaytime:', error);
      return;
    }
    myPlaytime = {};
    (data || []).forEach(row => {
      myPlaytime[row.game_id] = Number(row.total_seconds) || 0;
    });
  } catch (e) {
    console.error('loadMyPlaytime exception:', e);
  }
}

// Playtime for a game — keyed by game_id now, not game_id text like before.
// The old schema stored game_id as text ('bloxdio'), new schema uses uuid.
// To keep the leaderboard working, the play.html player will still call
// add_game_playtime with a text id (the slug). So we look up by slug too.
function getPlaytimeForGame(game) {
  // Try slug first (what play.html writes), then uuid
  return myPlaytime[game.slug] || myPlaytime[game.id] || 0;
}

window.switchCategory = function(category) {
  currentCategory = category;
  document.querySelectorAll('.games-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.category === category);
  });
  renderGames();
};

function renderGames() {
  const grid = document.getElementById('games-grid');
  const subtitle = document.getElementById('games-subtitle');
  if (!grid) return;

  let filtered = allGames;
  if (currentCategory !== 'all') {
    filtered = allGames.filter(g => g.category === currentCategory);
  }

  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="games-empty">
        <div class="games-empty-icon"><i class="fas fa-gamepad"></i></div>
        <div>${currentCategory === 'all'
          ? 'No games yet. Admins will add some soon.'
          : 'No games in this category yet.'
        }</div>
      </div>
    `;
    if (subtitle) {
      subtitle.textContent = currentCategory === 'all'
        ? 'no games available'
        : `no ${currentCategory} games`;
    }
    return;
  }

  if (subtitle) {
    subtitle.textContent = currentCategory === 'all'
      ? `${allGames.length} game${allGames.length === 1 ? '' : 's'} available`
      : `${filtered.length} ${currentCategory} game${filtered.length === 1 ? '' : 's'}`;
  }

  filtered.forEach((game, i) => {
    grid.appendChild(buildGameCard(game, i));
  });
}

function buildGameCard(game, index) {
  const card = document.createElement('div');
  card.className = 'game-card';
  card.style.animationDelay = (index * 0.06) + 's';

  const playtimeSec = getPlaytimeForGame(game);
  const playtimeLabel = formatPlaytime(playtimeSec);
  const accent = game.accent_color || 'linear-gradient(135deg, #4a9eff, #6c5ce7)';
  const iconClass = game.icon || 'fa-gamepad';

  // Thumbnail image if provided, else use icon
  const mediaHTML = game.thumbnail_url
    ? `<div class="game-card-thumb" style="background-image:url('${window.escapeHTML(game.thumbnail_url)}')"></div>`
    : `<div class="game-icon" style="background:${accent}"><i class="fas ${iconClass}"></i></div>`;

  // Play count badge
  const playsLabel = game.plays > 0
    ? `${game.plays} play${game.plays === 1 ? '' : 's'}`
    : null;

  card.innerHTML = `
    <div class="game-card-top">
      ${mediaHTML}
      <div class="game-card-badges">
        ${game.featured ? '<div class="game-card-badge featured"><i class="fas fa-star"></i> Featured</div>' : ''}
        ${playsLabel ? `<div class="game-card-badge plays"><i class="fas fa-play"></i> ${playsLabel}</div>` : ''}
      </div>
    </div>
    <div class="game-card-title">${window.escapeHTML(game.title)}</div>
    <div class="game-card-desc">${window.escapeHTML(game.description || '')}</div>
    <div class="game-card-category">
      <span class="game-category-pill">${window.escapeHTML(game.category)}</span>
    </div>
    ${playtimeLabel ? `
      <div class="game-card-playtime">
        <i class="fas fa-clock"></i>
        <span>${window.escapeHTML(playtimeLabel)}</span>
      </div>
    ` : ''}
    <a href="/games/play.html?slug=${encodeURIComponent(game.slug)}" class="game-play-btn">
  <i class="fas fa-play"></i> Play
</a>
  `;

  return card;
}

async function pageInit() {
  definePageSteps();
  nextLoadingStep(); // theme

  nextLoadingStep(); // games
  await Promise.all([
    loadGames(),
    loadMyPlaytime()
  ]);
  renderGames();

  // online + notifs handled by initPage

  nextLoadingStep();
  nextLoadingStep();
  nextLoadingStep(); // ready
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initPage(pageInit);
  });
} else {
  initPage(pageInit);
}
</script>
</body>
</html>
