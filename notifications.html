<script>
// ── NOTIFICATIONS PAGE ──

// Cache of who I already follow (username → status), loaded once per session
let myFollowingMap = {}; // { username: 'active' | 'pending' }

// ── LOADING STEPS ──
function definePageSteps() {
  defineLoadingSteps([
    { id: 'theme', label: 'Loading theme...', technical: 'Applying saved theme preferences' },
    { id: 'auth', label: 'Connecting to Supabase...', technical: 'Checking authentication' },
    { id: 'profile', label: 'Loading your profile...', technical: 'Fetching user data' },
    { id: 'pfp', label: 'Loading profile pictures...', technical: 'Caching avatars' },
    { id: 'notifications', label: 'Loading notifications...', technical: 'Fetching all notifications' },
    { id: 'online', label: 'Loading online users...', technical: 'Counting active users' },
    { id: 'ready', label: 'Done! ✨', technical: 'Notifications ready' }
  ]);
}

// ── NOTIF LABEL ──
function notifLabel(type) {
  if (type === 'post_comment') return 'commented on your post';
  if (type === 'chat_reply') return 'replied to your message';
  if (type === 'like') return 'liked your post';
  if (type === 'follow') return 'started following you';
  if (type === 'follow_request') return 'requested to follow you';
  if (type === 'follow_approved') return 'approved your follow request';
  if (type === 'chat_mention') return 'mentioned you in chat';
  return 'interacted with you';
}

// ── NOTIF ICON ──
function notifIcon(type) {
  if (type === 'post_comment') return '<i class="fas fa-comment" style="color:var(--neon);"></i>';
  if (type === 'chat_reply') return '<i class="fas fa-reply" style="color:var(--neon2);"></i>';
  if (type === 'like') return '<i class="fas fa-heart" style="color:#ff4d6d;"></i>';
  if (type === 'follow') return '<i class="fas fa-user-plus" style="color:var(--yellow);"></i>';
  if (type === 'follow_request') return '<i class="fas fa-user-clock" style="color:var(--yellow);"></i>';
  if (type === 'follow_approved') return '<i class="fas fa-user-check" style="color:#22c55e;"></i>';
  if (type === 'chat_mention') return '<i class="fas fa-at" style="color:var(--neon);"></i>';
  return '<i class="fas fa-bell" style="color:var(--muted);"></i>';
}

// Is this a follow-family type? (row click → profile, follow-back button shown)
function isFollowType(type) {
  return type === 'follow' || type === 'follow_request';
}

// ── LOAD MY FOLLOWING MAP ──
async function loadMyFollowingMap() {
  if (!window.session) return;
  try {
    // Step 1 — get the raw follow rows (no join, no FK inference)
    const { data: rows, error } = await window.supabaseClient
      .from('follows')
      .select('following_id, status')
      .eq('follower_id', window.session.user.id)
      .in('status', ['active', 'pending']);

    if (error) { console.error('loadMyFollowingMap:', error); return; }
    if (!rows || rows.length === 0) { myFollowingMap = {}; return; }

    // Step 2 — get usernames for those user_ids
    const ids = rows.map(r => r.following_id);
    const { data: profiles, error: pErr } = await window.supabaseClient
      .from('profiles')
      .select('id, username')
      .in('id', ids);

    if (pErr) { console.error('loadMyFollowingMap profiles:', pErr); return; }

    // Step 3 — merge into a username → status map
    const usernameById = {};
    (profiles || []).forEach(p => { usernameById[p.id] = p.username; });

    myFollowingMap = {};
    rows.forEach(r => {
      const uname = usernameById[r.following_id];
      if (uname) myFollowingMap[uname] = r.status;
    });
  } catch (e) {
    console.error('loadMyFollowingMap exception:', e);
  }
}

// ── LOAD NOTIFICATIONS ──
async function loadNotifs() {
  if (!window.session) return;
  
  try {
    const { data: notifs, error } = await window.supabaseClient
      .from('notifications')
      .select('*')
      .eq('recipient_id', window.session.user.id)
      .order('created_at', { ascending: false })
      .limit(50);

    const list = document.getElementById('notif-list');
    const subtitle = document.getElementById('notif-subtitle');

    if (error) {
      console.error('Error loading notifications:', error);
      list.innerHTML = '<div style="color:var(--muted);padding:20px;font-family:Space Mono">failed to load</div>';
      return;
    }

    const unread = (notifs || []).filter(n => !n.read).length;
    subtitle.textContent = `${(notifs || []).length} total · ${unread} unread`;

    // Update badge
    const badge = document.getElementById('notif-badge');
    const navBadge = document.getElementById('notif-nav-badge');
    const downbarMoreBadge = document.getElementById('downbar-more-notif-badge');
    
    if (unread > 0) {
      const label = unread > 99 ? '99+' : unread;
      if (badge) { badge.textContent = label; badge.classList.add('show'); }
      if (navBadge) { navBadge.textContent = label; navBadge.classList.add('show'); }
      if (downbarMoreBadge) { downbarMoreBadge.textContent = label; downbarMoreBadge.classList.add('show'); }
    } else {
      if (badge) badge.classList.remove('show');
      if (navBadge) navBadge.classList.remove('show');
      if (downbarMoreBadge) downbarMoreBadge.classList.remove('show');
    }

    if (!notifs || notifs.length === 0) {
      list.innerHTML = `
        <div class="empty-notifs">
          <div class="big"><i class="fas fa-bell" style="color:var(--muted);"></i></div>
          <div>No notifications yet.<br>They'll show up here when someone interacts with you.</div>
        </div>`;
      return;
    }

    list.innerHTML = '';
    notifs.forEach((n, i) => {
      list.appendChild(buildNotifRow(n, i));
    });
  } catch (e) {
    console.error('Error loading notifications:', e);
  }
}

function buildNotifRow(n, i) {
  const item = document.createElement('div');
  item.className = 'notif-item' + (n.read ? '' : ' unread');
  item.style.animationDelay = (i * 0.04) + 's';

  if (!n.read) {
    const dot = document.createElement('div');
    dot.className = 'unread-dot';
    item.appendChild(dot);
  }

  const displayName = n.actor_display_name || n.actor_username;
  const actorUsername = n.actor_username || '';

  // ── Avatar (clickable → profile) ──
  const av = document.createElement('div');
  av.className = 'notif-av notif-av-link';
  av.title = 'View @' + actorUsername;
  const initial = document.createElement('span');
  initial.textContent = (actorUsername[0] || '?').toUpperCase();
  av.appendChild(initial);

  if (n.actor_pfp_url || window.pfpCache?.[actorUsername]) {
    const img = document.createElement('img');
    img.src = n.actor_pfp_url || window.pfpCache?.[actorUsername];
    img.onload = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
    img.onerror = () => img.remove();
    av.appendChild(img);
  }
  av.onclick = (e) => {
    e.stopPropagation();
    if (actorUsername) {
      window.location.href = `/profiles?u=${encodeURIComponent(actorUsername)}`;
    }
  };
  item.appendChild(av);

  // ── Body ──
  const body = document.createElement('div');
  body.className = 'notif-body';

  const textEl = document.createElement('div');
  textEl.className = 'notif-text';
  textEl.innerHTML = `<strong class="notif-name-link" title="View @${window.escapeHTML(actorUsername)}">${window.escapeHTML(displayName)}</strong> ${notifLabel(n.type)}`;
  const nameLink = textEl.querySelector('.notif-name-link');
  if (nameLink && actorUsername) {
    nameLink.onclick = (e) => {
      e.stopPropagation();
      window.location.href = `/profiles?u=${encodeURIComponent(actorUsername)}`;
    };
  }
  body.appendChild(textEl);

  if (n.preview) {
    const prevEl = document.createElement('div');
    prevEl.className = 'notif-preview';
    prevEl.textContent = `"${n.preview}"`;
    body.appendChild(prevEl);
  }

  const timeEl = document.createElement('div');
  timeEl.className = 'notif-time';
  timeEl.textContent = window.timeAgo(n.created_at);
  body.appendChild(timeEl);

  // ── Follow-back button (only on follow-type notifications from real users) ──
  if (isFollowType(n.type) && actorUsername) {
    const followState = myFollowingMap[actorUsername];
    const btn = document.createElement('button');
    btn.className = 'notif-follow-back-btn';
    btn.type = 'button';

    if (followState === 'active') {
      btn.classList.add('following');
      btn.innerHTML = '<i class="fas fa-check"></i> Following';
      btn.disabled = true;
    } else if (followState === 'pending') {
      btn.classList.add('pending');
      btn.innerHTML = '<i class="fas fa-clock"></i> Requested';
      btn.disabled = true;
    } else {
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Follow back';
      btn.onclick = (e) => {
        e.stopPropagation();
        handleFollowBack(actorUsername, btn);
      };
    }

    body.appendChild(btn);
  }

  item.appendChild(body);

  // ── Icon ──
  const iconEl = document.createElement('div');
  iconEl.className = 'notif-type-icon';
  iconEl.innerHTML = notifIcon(n.type);
  item.appendChild(iconEl);

  // ── Row click ──
  item.onclick = async () => {
    // Mark read
    if (!n.read) {
      await window.supabaseClient.from('notifications').update({ read: true }).eq('id', n.id);
      item.classList.remove('unread');
      item.querySelector('.unread-dot')?.remove();
    }

    // Route based on type
    if (isFollowType(n.type)) {
      if (actorUsername) {
        window.location.href = `/profiles?u=${encodeURIComponent(actorUsername)}`;
      }
    } else if (n.type === 'follow_approved') {
      // Navigate to their profile too
      if (actorUsername) {
        window.location.href = `/profiles?u=${encodeURIComponent(actorUsername)}`;
      }
    } else if ((n.type === 'post_comment' || n.type === 'like') && n.ref_id) {
      window.location.href = `/?post=${n.ref_id}`;
    } else if (n.type === 'chat_reply' && n.ref_id) {
      window.location.href = `/chat?msg=${n.ref_id}`;
    } else if (n.type === 'chat_mention' && n.ref_id) {
      window.location.href = `/chat`;
    }
  };

  return item;
}

// ── HANDLE FOLLOW BACK ──
async function handleFollowBack(targetUsername, btn) {
  if (!window.session) return;
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

  try {
    // Need the target user_id — fetch from profiles by username
    const { data: targetProfile, error: pErr } = await window.supabaseClient
      .from('profiles')
      .select('id')
      .eq('username', targetUsername)
      .maybeSingle();

    if (pErr || !targetProfile?.id) {
      window.showToast('Could not find user', 'error');
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      return;
    }

    const { data, error } = await window.supabaseClient.rpc('request_follow', {
      p_target_user_id: targetProfile.id
    });

    if (error || !data || !data.ok) {
      window.showToast('Could not follow: ' + (data?.reason || error?.message || 'unknown'), 'error');
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      return;
    }

    // Update local cache + button
    myFollowingMap[targetUsername] = data.status;

    if (data.status === 'active') {
      btn.classList.add('following');
      btn.innerHTML = '<i class="fas fa-check"></i> Following';
      window.showToast('Followed back ✅', 'success');
    } else if (data.status === 'pending') {
      btn.classList.add('pending');
      btn.innerHTML = '<i class="fas fa-clock"></i> Requested';
      window.showToast('Follow request sent', 'success');
    }
  } catch (e) {
    console.error('handleFollowBack:', e);
    window.showToast('Something went wrong', 'error');
    btn.innerHTML = originalHTML;
    btn.disabled = false;
  }
}

// ── MARK ALL READ ──
window.markAllRead = async function() {
  if (!window.session) return;
  
  try {
    await window.supabaseClient
      .from('notifications')
      .update({ read: true })
      .eq('recipient_id', window.session.user.id)
      .eq('read', false);
    
    document.querySelectorAll('.notif-item.unread').forEach(el => {
      el.classList.remove('unread');
      el.querySelector('.unread-dot')?.remove();
    });
    
    const total = document.querySelectorAll('.notif-item').length;
    document.getElementById('notif-subtitle').textContent = total + ' total · 0 unread';
    
    const badge = document.getElementById('notif-badge');
    const navBadge = document.getElementById('notif-nav-badge');
    const downbarMoreBadge = document.getElementById('downbar-more-notif-badge');
    
    if (badge) badge.classList.remove('show');
    if (navBadge) navBadge.classList.remove('show');
    if (downbarMoreBadge) downbarMoreBadge.classList.remove('show');
    
    window.showToast('all caught up ✅', 'success');
  } catch (e) {
    console.error('Error marking all read:', e);
    window.showToast('Failed to mark all read', 'error');
  }
};

// ── PAGE INIT ──
async function pageInit() {
  definePageSteps();
  nextLoadingStep(); // theme
  
  nextLoadingStep(); // pfp

  // Load follow map BEFORE notifications so buttons render correctly
  await loadMyFollowingMap();

  nextLoadingStep(); // notifications
  await loadNotifs();

  // ── ADS: notifications banner ──
  try {
    if (window.Ads && typeof window.Ads.mountNotificationsBanner === 'function') {
      const slot = document.getElementById('notifications-ad-slot');
      if (slot) window.Ads.mountNotificationsBanner(slot);
    }
  } catch (e) {
    console.log('[Ads notifications]', e);
  }

  nextLoadingStep(); // online
  nextLoadingStep(); // ready
}

// ── START ──
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initPage(pageInit);
  });
} else {
  initPage(pageInit);
}
</script>
</body>
