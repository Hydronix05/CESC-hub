<script>
// ── NOTIFICATIONS PAGE ──
// Use window.session, window.currentUser, window.supabaseClient from shared.js

// ── LOADING STEPS ──
function definePageSteps() {
  defineLoadingSteps([
    { id: 'theme', label: 'Loading theme...', technical: 'Applying saved theme preferences' },
    { id: 'auth', label: 'Connecting to Supabase...', technical: 'Checking authentication' },
    { id: 'profile', label: 'Loading your profile...', technical: 'Fetching user data' },
    { id: 'pfp', label: 'Loading profile pictures...', technical: 'Caching avatars' },
    { id: 'notifications', label: 'Loading notifications...', technical: 'Fetching all notifications' },
    { id: 'online', label: 'Loading online users...', technical: 'Counting active users' },
    { id: 'ready', label: 'Done! ✨', technical: 'Notifications ready' }
  ]);
}

// ── NOTIF LINK HELPER ──
function notifLink(type, refId) {
  if (!refId) return '#';
  if (type === 'post_comment' || type === 'like') {
    return `/?post=${refId}`;
  }
  if (type === 'chat_reply') {
    return `/chat?msg=${refId}`;
  }
  return '#';
}

// ── NOTIF LABEL ──
function notifLabel(type) {
  if(type === 'post_comment') return 'commented on your post';
  if(type === 'chat_reply') return 'replied to your message';
  if(type === 'like') return 'liked your post';
  if(type === 'follow') return 'started following you';
  return 'interacted with you';
}

// ── NOTIF ICON ──
function notifIcon(type) {
  if(type === 'post_comment') return '<i class="fas fa-comment" style="color:var(--neon);"></i>';
  if(type === 'chat_reply') return '<i class="fas fa-reply" style="color:var(--neon2);"></i>';
  if(type === 'like') return '<i class="fas fa-heart" style="color:#ff4d6d;"></i>';
  if(type === 'follow') return '<i class="fas fa-user-plus" style="color:var(--yellow);"></i>';
  return '<i class="fas fa-bell" style="color:var(--muted);"></i>';
}

// ── LOAD NOTIFICATIONS ──
async function loadNotifs() {
  if (!window.session) return;
  
  try {
    const { data: notifs, error } = await window.supabaseClient
      .from('notifications')
      .select('*')
      .eq('recipient_id', window.session.user.id)
      .order('created_at', { ascending: false })
      .limit(50);

    const list = document.getElementById('notif-list');
    const subtitle = document.getElementById('notif-subtitle');

    if (error) {
      console.error('Error loading notifications:', error);
      list.innerHTML = '<div style="color:var(--muted);padding:20px;font-family:Space Mono">failed to load</div>';
      return;
    }

    const unread = (notifs || []).filter(n => !n.read).length;
    subtitle.textContent = `${(notifs || []).length} total · ${unread} unread`;

    // Update badge
    const badge = document.getElementById('notif-badge');
    const navBadge = document.getElementById('notif-nav-badge');
    const downbarMoreBadge = document.getElementById('downbar-more-notif-badge');
    
    if (unread > 0) {
      const label = unread > 99 ? '99+' : unread;
      if (badge) { badge.textContent = label; badge.classList.add('show'); }
      if (navBadge) { navBadge.textContent = label; navBadge.classList.add('show'); }
      if (downbarMoreBadge) { downbarMoreBadge.textContent = label; downbarMoreBadge.classList.add('show'); }
    } else {
      if (badge) badge.classList.remove('show');
      if (navBadge) navBadge.classList.remove('show');
      if (downbarMoreBadge) downbarMoreBadge.classList.remove('show');
    }

    if (!notifs || notifs.length === 0) {
      list.innerHTML = `
        <div class="empty-notifs">
          <div class="big"><i class="fas fa-bell" style="color:var(--muted);"></i></div>
          <div>No notifications yet.<br>They'll show up here when someone comments on your posts or replies to your messages.</div>
        </div>`;
      return;
    }

    list.innerHTML = '';
    notifs.forEach((n, i) => {
      const item = document.createElement('div');
      item.className = 'notif-item' + (n.read ? '' : ' unread');
      item.style.animationDelay = (i * 0.04) + 's';
      
      if (!n.read) {
        const dot = document.createElement('div');
        dot.className = 'unread-dot';
        item.appendChild(dot);
      }
      
      // Avatar
      const av = document.createElement('div');
      av.className = 'notif-av';
      const initial = document.createElement('span');
      initial.textContent = (n.actor_username?.[0] || '?').toUpperCase();
      av.appendChild(initial);
      
      const displayName = n.actor_display_name || n.actor_username;
      
      if (n.actor_pfp_url || window.pfpCache?.[n.actor_username]) {
        const img = document.createElement('img');
        img.src = n.actor_pfp_url || window.pfpCache?.[n.actor_username];
        img.onload = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
        img.onerror = () => img.remove();
        av.appendChild(img);
      }
      item.appendChild(av);
      
      // Body
      const body = document.createElement('div');
      body.className = 'notif-body';
      body.innerHTML = `
        <div class="notif-text"><strong>${window.escapeHTML(displayName)}</strong> ${notifLabel(n.type)}</div>
        ${n.preview ? `<div class="notif-preview">"${window.escapeHTML(n.preview)}"</div>` : ''}
        <div class="notif-time">${window.timeAgo(n.created_at)}</div>`;
      item.appendChild(body);
      
      // Icon - Font Awesome
      const iconEl = document.createElement('div');
      iconEl.className = 'notif-type-icon';
      iconEl.innerHTML = notifIcon(n.type);
      item.appendChild(iconEl);
      
      // Click — mark read + navigate
      item.onclick = async () => {
        if (!n.read) {
          await window.supabaseClient.from('notifications').update({ read: true }).eq('id', n.id);
          item.classList.remove('unread');
          item.querySelector('.unread-dot')?.remove();
        }
        window.location.href = notifLink(n.type, n.ref_id);
      };
      list.appendChild(item);
    });
  } catch (e) {
    console.error('Error loading notifications:', e);
  }
}

// ── MARK ALL READ ──
window.markAllRead = async function() {
  if (!window.session) return;
  
  try {
    await window.supabaseClient
      .from('notifications')
      .update({ read: true })
      .eq('recipient_id', window.session.user.id)
      .eq('read', false);
    
    document.querySelectorAll('.notif-item.unread').forEach(el => {
      el.classList.remove('unread');
      el.querySelector('.unread-dot')?.remove();
    });
    
    const total = document.querySelectorAll('.notif-item').length;
    document.getElementById('notif-subtitle').textContent = total + ' total · 0 unread';
    
    // Update badges
    const badge = document.getElementById('notif-badge');
    const navBadge = document.getElementById('notif-nav-badge');
    const downbarMoreBadge = document.getElementById('downbar-more-notif-badge');
    
    if (badge) badge.classList.remove('show');
    if (navBadge) navBadge.classList.remove('show');
    if (downbarMoreBadge) downbarMoreBadge.classList.remove('show');
    
    window.showToast('all caught up ✅', 'success');
  } catch (e) {
    console.error('Error marking all read:', e);
    window.showToast('Failed to mark all read', 'error');
  }
};

// ── PAGE INIT ──
async function pageInit() {
  definePageSteps();
  nextLoadingStep(); // theme
  
  // auth is handled by initPage
  // profile is handled by initPage
  
  nextLoadingStep(); // pfp (already loaded in initPage)
  
  nextLoadingStep(); // notifications
  await loadNotifs();
  
  nextLoadingStep(); // online (handled by initPage)
  
  nextLoadingStep(); // ready
}

// ── START ──
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initPage(pageInit);
  });
} else {
  initPage(pageInit);
}
</script>
