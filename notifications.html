<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CESC Hub — Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>

<style>
/* ── NOTIFICATIONS PAGE STYLES ── */

.notif-list {
  display:flex;
  flex-direction:column;
  gap:10px;
}
.notif-item {
  display:flex;
  align-items:flex-start;
  gap:14px;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  animation:card-enter 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes card-enter {
  from{opacity:0;transform:translateY(12px) scale(0.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.notif-item:hover {
  border-color:rgba(74,158,255,0.2);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}
.notif-item.unread {
  border-color:rgba(74,158,255,0.2);
  background:rgba(74,158,255,0.04);
}
.notif-item.unread::before {
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:linear-gradient(180deg,var(--neon),var(--neon2));
  border-radius:16px 0 0 16px;
}
.notif-av {
  width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--neon),var(--neon2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.1rem;
  font-weight:800;
  color:#000;
  flex-shrink:0;
  overflow:hidden;
  position:relative;
}
.notif-av img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  border-radius:50%;
}
.notif-av img.loaded { display:block; }
.notif-av span { position:relative; z-index:1; }
.notif-body { flex:1; min-width:0; }
.notif-text {
  font-size:0.9rem;
  line-height:1.5;
  color:var(--text-bright);
}
.notif-text strong { color:var(--neon); }
.notif-preview {
  font-size:0.8rem;
  color:var(--muted);
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.notif-time {
  font-size:0.68rem;
  font-family:'Space Mono',monospace;
  color:var(--muted);
  margin-top:5px;
}
.notif-type-icon {
  font-size:0.85rem;
  margin-left:auto;
  flex-shrink:0;
  padding-top:2px;
}
.unread-dot {
  position:absolute;
  top:14px;
  right:14px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--neon);
  box-shadow:0 0 6px var(--neon);
}
.empty-notifs {
  text-align:center;
  padding:80px 20px;
  color:var(--muted);
  font-family:'Space Mono',monospace;
  font-size:0.85rem;
}
.empty-notifs .big {
  font-size:3rem;
  margin-bottom:14px;
  animation:bounce 2s ease-in-out infinite;
}
@keyframes bounce {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.skel-notif {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  display:flex;
  gap:14px;
  align-items:center;
}
.skel-av {
  width:44px;
  height:44px;
  border-radius:50%;
  flex-shrink:0;
  background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,0.07) 50%,var(--surface) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}
.skel-line {
  height:12px;
  border-radius:6px;
  background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,0.07) 50%,var(--surface) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}
.skel-line.short { width:60%; }
.skel-line.long { width:80%; }
@keyframes shimmer {
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.mark-all-btn {
  padding:8px 16px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-family:'Syne',sans-serif;
  font-weight:700;
  font-size:0.82rem;
  cursor:pointer;
  transition:all 0.2s;
  flex-shrink:0;
}
.mark-all-btn:hover {
  border-color:rgba(74,158,255,0.4);
  color:var(--neon);
}

@media(max-width:768px) {
  .notif-item { padding:14px 14px; }
  .notif-av { width:36px; height:36px; font-size:0.9rem; }
}
@media(max-width:480px) {
  .notif-text { font-size:0.82rem; }
  .notif-preview { font-size:0.72rem; }
}
</style>
</head>
<body>
<div class="bg-canvas"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="toast" id="toast"></div>

<div class="mobile-menu" onclick="window.toggleSidebar()"><i class="fas fa-bars"></i></div>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img src="https://uploads.onecompiler.io/43m56waex/44huzak7q/232a0cec-1d90-4e0b-8377-41d13d78b763.png" alt="CESC Hub"/>
    <span class="logo-text">CESC <span class="logo-dot">Hub</span></span>
  </div>
  <div class="nav-label">Main</div>
  <a href="index.html" class="nav-item"><span class="nav-icon"><i class="fas fa-newspaper"></i></span> Feed</a>
  <a href="chat.html" class="nav-item"><span class="nav-icon"><i class="fas fa-comments"></i></span> Chat Room</a>
  <a href="profiles.html" class="nav-item"><span class="nav-icon"><i class="fas fa-users"></i></span> Profiles</a>
  <div class="nav-label">You</div>
  <a href="settings.html" class="nav-item"><span class="nav-icon"><i class="fas fa-cog"></i></span> Settings</a>
  <a href="notifications.html" class="nav-item active" id="notif-nav">
    <span class="nav-icon"><i class="fas fa-bell"></i></span> Notifications

<!-- ── HEADER ── -->
<header class="top-header">
  <div>
    <div class="header-title">Notifications</div>
    <div class="header-sub" id="header-sub">
      <span class="header-online-status">
        <span class="online-pulse-ring">
          <span class="online-pulse-dot"></span>
        </span>
        <span class="online-count-number" id="online-count">...</span>
        <span class="online-status-text">online now</span>
      </span>
    </div>
  </div>
  <div class="header-right">
    <button class="hdr-btn theme-toggle" id="theme-btn" onclick="window.toggleTheme()" title="Toggle theme"><i class="fas fa-moon"></i></button>
    <a href="notifications.html" class="hdr-btn" title="Notifications">
      <i class="fas fa-bell"></i>
      <span class="notif-badge" id="notif-badge">0</span>
    </a>
    <div class="profile-chip" id="profile-chip" onclick="window.toggleDropdown()">
      <div class="chip-av" id="chip-av"><span id="chip-initial">?</span></div>
      <span class="chip-name" id="chip-name">loading</span>
      <span class="chip-arrow"><i class="fas fa-chevron-down"></i></span>
      <div class="profile-dropdown" id="profile-dropdown">
        <div class="dd-header">
          <div class="dd-name" id="dd-name">—</div>
          <div class="dd-sub">CESC Hub member</div>
        </div>
        <a href="profiles.html" class="dd-item"><span class="di-icon"><i class="fas fa-user"></i></span> My Profile</a>
        <a href="settings.html" class="dd-item"><span class="di-icon"><i class="fas fa-cog"></i></span> Settings</a>
        <a href="notifications.html" class="dd-item"><span class="di-icon"><i class="fas fa-bell"></i></span> Notifications</a>
        <div class="dd-div"></div>
        <button class="dd-item logout" onclick="window.logout()"><span class="di-icon"><i class="fas fa-sign-out-alt"></i></span> Logout</button>
      </div>
    </div>

</header>

<!-- ── MAIN ── -->
<main class="main">
  <div class="page-header">
    <div>
      <h1>Notifications</h1>
      <p id="notif-subtitle">Loading...</p>
    </div>
    <button class="mark-all-btn" onclick="window.markAllRead()">Mark all read</button>
  </div>
  
  <div class="notif-list" id="notif-list">
    <div class="skel-notif">
      <div class="skel-av"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <div class="skel-line long"></div>
        <div class="skel-line short"></div>
      </div>
    </div>
    <div class="skel-notif">
      <div class="skel-av"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <div class="skel-line long"></div>
        <div class="skel-line short"></div>
      </div>
    </div>
  </div>
</main>

<script>
// ── NOTIFICATIONS PAGE ──
// Use window.session, window.currentUser, window.supabaseClient from shared.js

function notifLabel(type) {
  if(type === 'post_comment') return 'commented on your post';
  if(type === 'chat_reply') return 'replied to your message';
  if(type === 'like') return 'liked your post';
  return 'interacted with you';
}

function notifIcon(type) {
  if(type === 'post_comment') return '💬';
  if(type === 'chat_reply') return '↩';
  if(type === 'like') return '❤️';
  return '🔔';
}

function notifLink(type, refId) {
  if(type === 'post_comment') return 'index.html';
  if(type === 'like') return 'index.html';
  if(type === 'chat_reply') return 'chat.html';
  return 'index.html';
}

async function loadNotifs() {
  if (!window.session) return;
  
  try {
    const { data: notifs, error } = await window.supabaseClient
      .from('notifications')
      .select('*')
      .eq('recipient_id', window.session.user.id)
      .order('created_at', { ascending: false })
      .limit(50);

    const list = document.getElementById('notif-list');
    const subtitle = document.getElementById('notif-subtitle');

    if (error) {
      console.error('Error loading notifications:', error);
      list.innerHTML = '<div style="color:var(--muted);padding:20px;font-family:Space Mono">failed to load</div>';
      return;
    }

    const unread = (notifs || []).filter(n => !n.read).length;
    subtitle.textContent = `${(notifs || []).length} total · ${unread} unread`;

    // Update badge
    const badge = document.getElementById('notif-badge');
    const navBadge = document.getElementById('notif-nav-badge');
    if (unread > 0) {
      const label = unread > 99 ? '99+' : unread;
      if (badge) { badge.textContent = label; badge.classList.add('show'); }
      if (navBadge) { navBadge.textContent = label; navBadge.classList.add('show'); }
    } else {
      if (badge) badge.classList.remove('show');
      if (navBadge) navBadge.classList.remove('show');
    }

    if (!notifs || notifs.length === 0) {
      list.innerHTML = `
        <div class="empty-notifs">
          <div class="big">🔔</div>
          <div>No notifications yet.<br>They'll show up here when someone comments on your posts or replies to your messages.</div>
        </div>`;
      return;
    }

    list.innerHTML = '';
    notifs.forEach((n, i) => {
      const item = document.createElement('div');
      item.className = 'notif-item' + (n.read ? '' : ' unread');
      item.style.animationDelay = (i * 0.04) + 's';
      
      if (!n.read) {
        const dot = document.createElement('div');
        dot.className = 'unread-dot';
        item.appendChild(dot);
      }
      
      // Avatar
      const av = document.createElement('div');
      av.className = 'notif-av';
      const initial = document.createElement('span');
      initial.textContent = (n.actor_username?.[0] || '?').toUpperCase();
      av.appendChild(initial);
      
      // Use display name if available for avatar
      const displayName = n.actor_display_name || n.actor_username;
      
      if (n.actor_pfp_url || window.pfpCache?.[n.actor_username]) {
        const img = document.createElement('img');
        img.src = n.actor_pfp_url || window.pfpCache?.[n.actor_username];
        img.onload = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
        img.onerror = () => img.remove();
        av.appendChild(img);
      }
      item.appendChild(av);
      
      // Body
      const body = document.createElement('div');
      body.className = 'notif-body';
      body.innerHTML = `
        <div class="notif-text"><strong>${window.escapeHTML(displayName)}</strong> ${notifLabel(n.type)}</div>
        ${n.preview ? `<div class="notif-preview">"${window.escapeHTML(n.preview)}"</div>` : ''}
        <div class="notif-time">${window.timeAgo(n.created_at)}</div>`;
      item.appendChild(body);
      
      // Icon
      const iconEl = document.createElement('div');
      iconEl.className = 'notif-type-icon';
      iconEl.textContent = notifIcon(n.type);
      item.appendChild(iconEl);
      
      // Click — mark read + navigate
      item.onclick = async () => {
        if (!n.read) {
          await window.supabaseClient.from('notifications').update({ read: true }).eq('id', n.id);
          item.classList.remove('unread');
          item.querySelector('.unread-dot')?.remove();
        }
        window.location.href = notifLink(n.type, n.ref_id);
      };
      list.appendChild(item);
    });
  } catch (e) {
    console.error('Error loading notifications:', e);
  }
}

window.markAllRead = async function() {
  if (!window.session) return;
  
  try {
    await window.supabaseClient
      .from('notifications')
      .update({ read: true })
      .eq('recipient_id', window.session.user.id)
      .eq('read', false);
    
    document.querySelectorAll('.notif-item.unread').forEach(el => {
      el.classList.remove('unread');
      el.querySelector('.unread-dot')?.remove();
    });
    
    const total = document.querySelectorAll('.notif-item').length;
    document.getElementById('notif-subtitle').textContent = total + ' total · 0 unread';
    
    // Update badges
    const badge = document.getElementById('notif-badge');
    const navBadge = document.getElementById('notif-nav-badge');
    if (badge) badge.classList.remove('show');
    if (navBadge) navBadge.classList.remove('show');
    
    window.showToast('all caught up ✅', 'success');
  } catch (e) {
    console.error('Error marking all read:', e);
    window.showToast('Failed to mark all read', 'error');
  }
};

// ── INIT ──
async function init() {
  if (typeof window.initTheme !== 'function') {
    console.log('⏳ Waiting for shared.js...');
    setTimeout(init, 200);
    return;
  }
  
  console.log('✅ shared.js loaded');
  window.initTheme();
  
  const sidebarOpen = localStorage.getItem('cesc_sidebar_open') === 'true';
  if (sidebarOpen && window.innerWidth <= 768) {
    document.getElementById('sidebar')?.classList.add('open');
    document.getElementById('sidebar-overlay')?.classList.add('show');
  }
  
  const sess = await window.initAuth();
  if (!sess) return;
  
  console.log('✅ Session loaded:', sess.user.email);
  
  const profile = await window.loadUserProfile();
  if (profile) {
    window.updateUserUI(profile);
    await window.loadPfpCache();
  }
  
  await window.updateLastSeen();
  
  await Promise.all([
    loadNotifs(),
    window.loadOnlineCount(),
    window.loadNotifCount()
  ]);
  
  setInterval(async () => {
    if (!window.session) return;
    await window.updateLastSeen();
    await Promise.all([window.loadOnlineCount(), window.loadNotifCount()]);
  }, 15000);
}

// ── START ──
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
} else {
  setTimeout(init, 100);
}
</script>
</body>
</html>
