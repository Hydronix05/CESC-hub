<script>
// ═══════════════════════════════════════════════════════════
// ── PAGE STATE ──
// ═══════════════════════════════════════════════════════════
const MAX_IMAGE_SIZE = 500 * 1024;
const POSTS_PER_BATCH = 10;
const FEED_TAB_KEY = 'cesc_feed_tab';

let pendingImageFile = null;
let emojiPickerInitialized = false;
let allPosts = [];
let currentBatch = 0;
let isLoadingMore = false;
let hasMorePosts = true;
let sentinelObserver = null;
let postModalOpen = false;

// V3.8 feed state
let currentFeedTab = 'following';
let followingIds = new Set();   // user_ids I follow
let followingUsernames = new Set(); // usernames I follow
let likeCountsByPost = {};
let commentCountsByPost = {};
let viewTrackedThisSession = new Set(); // session-scoped, prevents re-tracking views

// ═══════════════════════════════════════════════════════════
// ── RICH TEXT PARSER ──
// ═══════════════════════════════════════════════════════════
function escapeHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function sanitizeUrl(url) {
  if (!url) return null;
  let u = String(url).trim();
  if (/^(javascript|data|vbscript):/i.test(u)) return null;
  if (!/^https?:\/\//i.test(u)) {
    u = 'https://' + u;
  }
  try {
    const parsed = new URL(u);
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
    return parsed.href;
  } catch {
    return null;
  }
}

function extractDomain(url) {
  try {
    const u = new URL(url);
    return u.hostname.replace(/^www\./, '');
  } catch {
    return '';
  }
}

function findFirstLink(text) {
  if (!text) return null;
  const re = /\[([^\]]+)\]\(([^)]+)\)/;
  const m = text.match(re);
  if (!m) return null;
  const safeUrl = sanitizeUrl(m[2]);
  if (!safeUrl) return null;
  return { label: m[1], url: safeUrl, domain: extractDomain(safeUrl) };
}

function parseContent(text) {
  if (!text) return '';
  let s = escapeHtml(text);

  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, url) => {
    const safe = sanitizeUrl(url);
    if (!safe) return match;
    return `<a href="${escapeHtml(safe)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });

  s = s.replace(/~~([^~]+)~~/g, '<s>$1</s>');
  s = s.replace(/__([^_]+)__/g, '<u>$1</u>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/###([^#\n]+)###/g, '<span class="sz-huge">$1</span>');
  s = s.replace(/##([^#\n]+)##/g, '<span class="sz-large">$1</span>');
  s = s.replace(/#([^#\n]+)#/g, '<span class="sz-small">$1</span>');
  s = s.replace(/\n/g, '<br>');

  return s;
}

// ═══════════════════════════════════════════════════════════
// ── CREATE POST MODAL ──
// ═══════════════════════════════════════════════════════════

function openPostModal() {
  if (!window.session || !window.currentUser) {
    window.showToast('You must be logged in', 'error');
    return;
  }

  postModalOpen = true;
  document.getElementById('post-modal').classList.add('show');
  document.body.style.overflow = 'hidden';

  const displayName = window.currentUser.display_name || window.currentUser.username;
  document.getElementById('post-modal-name').textContent = displayName;
  document.getElementById('post-modal-av-initial').textContent = (window.currentUser.username?.[0] || '?').toUpperCase();

  const av = document.getElementById('post-modal-av');
  const oldImg = av.querySelector('img');
  if (oldImg) oldImg.remove();
  if (window.currentUser.pfp_url) {
    const img = document.createElement('img');
    img.src = window.currentUser.pfp_url;
    img.onload = () => { img.classList.add('loaded'); document.getElementById('post-modal-av-initial').style.display = 'none'; };
    img.onerror = () => img.remove();
    av.appendChild(img);
  }

  document.getElementById('post-ta').value = '';
  document.getElementById('post-preview').innerHTML = '';
  document.getElementById('post-preview-wrap').classList.remove('show');
  document.getElementById('post-img-preview').classList.remove('show');
  document.getElementById('post-link-preview-modal').classList.remove('show');
  document.getElementById('pt-link-panel').classList.remove('open');
  document.getElementById('pt-size-menu').classList.remove('open');
  pendingImageFile = null;

  setTimeout(() => document.getElementById('post-ta').focus(), 100);
}

function closePostModal() {
  const text = document.getElementById('post-ta').value.trim();
  if (text || pendingImageFile) {
    if (!confirm('Discard this post?')) return;
  }
  postModalOpen = false;
  document.getElementById('post-modal').classList.remove('show');
  document.body.style.overflow = '';
  document.getElementById('pt-size-menu').classList.remove('open');
  document.getElementById('pt-link-panel').classList.remove('open');
  document.getElementById('emoji-picker').classList.remove('open');
}

function postModalBgClick(e) {
  if (e.target.id === 'post-modal') closePostModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && postModalOpen) {
    const sizeMenu = document.getElementById('pt-size-menu');
    const linkPanel = document.getElementById('pt-link-panel');
    if (sizeMenu?.classList.contains('open')) {
      sizeMenu.classList.remove('open');
      return;
    }
    if (linkPanel?.classList.contains('open')) {
      linkPanel.classList.remove('open');
      return;
    }
    closePostModal();
  }
});

function onPostInput() {
  const text = document.getElementById('post-ta').value;

  const wrap = document.getElementById('post-preview-wrap');
  const preview = document.getElementById('post-preview');
  if (text.trim()) {
    wrap.classList.add('show');
    preview.innerHTML = parseContent(text);
  } else {
    wrap.classList.remove('show');
    preview.innerHTML = '';
  }

  const linkPreview = document.getElementById('post-link-preview-modal');
  if (!pendingImageFile && text.trim()) {
    const link = findFirstLink(text);
    if (link) {
      document.getElementById('link-preview-label').textContent = link.label;
      document.getElementById('link-preview-domain').textContent = link.domain;
      linkPreview.classList.add('show');
    } else {
      linkPreview.classList.remove('show');
    }
  } else {
    linkPreview.classList.remove('show');
  }
}

function wrapSelection(open, close) {
  const ta = document.getElementById('post-ta');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const value = ta.value;

  if (start === end) {
    ta.value = value.slice(0, start) + open + close + value.slice(end);
    ta.selectionStart = ta.selectionEnd = start + open.length;
  } else {
    const selected = value.slice(start, end);
    ta.value = value.slice(0, start) + open + selected + close + value.slice(end);
    ta.selectionStart = start + open.length;
    ta.selectionEnd = end + open.length;
  }

  ta.focus();
  onPostInput();
}

function applyFormat(type) {
  const markers = {
    bold: ['**', '**'],
    italic: ['*', '*'],
    underline: ['__', '__'],
    strike: ['~~', '~~']
  };
  const m = markers[type];
  if (!m) return;
  wrapSelection(m[0], m[1]);
}

function toggleSizeMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('pt-size-menu');
  menu.classList.toggle('open');
}

document.addEventListener('click', e => {
  const menu = document.getElementById('pt-size-menu');
  const btn = document.getElementById('pt-size-btn');
  if (menu && menu.classList.contains('open')) {
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.remove('open');
    }
  }
});

function applySize(size) {
  const ta = document.getElementById('post-ta');
  document.getElementById('pt-size-menu').classList.remove('open');

  let start = ta.selectionStart;
  let end = ta.selectionEnd;
  let value = ta.value;

  const before = value.slice(0, start);
  const after = value.slice(end);
  const stripRe = /(###|##|#)$/;
  const stripBefore = before.replace(stripRe, '');
  const stripAfter = after.replace(/^(###|##|#)/, '');

  start = stripBefore.length;
  end = stripBefore.length + (end - start);
  value = stripBefore + value.slice(ta.selectionStart, end) + stripAfter;

  const selected = value.slice(start, end);

  if (size === 'normal') {
    ta.value = value.slice(0, start) + selected + value.slice(end);
    ta.selectionStart = start;
    ta.selectionEnd = end;
  } else {
    const markers = {
      small: ['#', '#'],
      large: ['##', '##'],
      huge: ['###', '###']
    };
    const [open, close] = markers[size];
    ta.value = value.slice(0, start) + open + selected + close + value.slice(end);
    ta.selectionStart = start + open.length;
    ta.selectionEnd = end + open.length;
  }

  ta.focus();
  onPostInput();
}

function openLinkPanel() {
  const panel = document.getElementById('pt-link-panel');
  panel.classList.add('open');
  const input = document.getElementById('pt-link-input');
  input.value = '';
  setTimeout(() => input.focus(), 80);
}

function closeLinkPanel() {
  document.getElementById('pt-link-panel').classList.remove('open');
}

function confirmLink() {
  const input = document.getElementById('pt-link-input');
  const url = input.value.trim();
  if (!url) { closeLinkPanel(); return; }

  const safe = sanitizeUrl(url);
  if (!safe) {
    window.showToast('Invalid URL', 'error');
    return;
  }

  const ta = document.getElementById('post-ta');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const value = ta.value;

  let label;
  if (start === end) {
    label = extractDomain(safe) || safe;
    const insertion = `[${label}](${safe})`;
    ta.value = value.slice(0, start) + insertion + value.slice(end);
    ta.selectionStart = ta.selectionEnd = start + insertion.length;
  } else {
    label = value.slice(start, end);
    const insertion = `[${label}](${safe})`;
    ta.value = value.slice(0, start) + insertion + value.slice(end);
    ta.selectionStart = start + insertion.length;
    ta.selectionEnd = start + insertion.length;
  }

  ta.focus();
  closeLinkPanel();
  onPostInput();
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > MAX_IMAGE_SIZE) {
    window.showToast(`Image too large (${(file.size/1024).toFixed(0)}KB). Max 500KB`, 'error');
    e.target.value = '';
    return;
  }
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('post-img-el').src = ev.target.result;
    document.getElementById('post-img-size').textContent = (file.size / 1024).toFixed(1) + ' KB';
    document.getElementById('post-img-preview').classList.add('show');
    document.getElementById('post-link-preview-modal').classList.remove('show');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function removeImage() {
  pendingImageFile = null;
  document.getElementById('post-img-preview').classList.remove('show');
  document.getElementById('post-img-el').src = '';
  onPostInput();
}

async function uploadImage(file) {
  if (!file) return null;
  const ext = file.name.split('.').pop();
  const path = `${window.session.user.id}/${Date.now()}.${ext}`;
  const { error } = await window.supabaseClient.storage.from('post-images').upload(path, file, {
    contentType: file.type
  });
  if (error) {
    window.showToast('Image upload failed: ' + error.message, 'error');
    return null;
  }
  const { data: urlData } = window.supabaseClient.storage.from('post-images').getPublicUrl(path);
  return urlData.publicUrl;
}

async function submitPost() {
  const text = document.getElementById('post-ta').value.trim();
  if (!text && !pendingImageFile) {
    window.showToast('write something or add an image', 'error');
    return;
  }
  if (!window.session || !window.session.user) {
    window.showToast('You must be logged in', 'error');
    return;
  }

  const btn = document.getElementById('post-submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

  let image_url = null;
  if (pendingImageFile) {
    image_url = await uploadImage(pendingImageFile);
    if (!image_url) {
      btn.disabled = false;
      btn.innerHTML = '<span>Post</span> <i class="fas fa-paper-plane"></i>';
      return;
    }
  }

  const displayName = window.currentUser.display_name || window.currentUser.username;

  const { data: insertedPost, error } = await window.supabaseClient.from('posts').insert({
    user_id: window.session.user.id,
    username: window.currentUser.username,
    display_name: displayName,
    content: text || '📷',
    image_url: image_url
  }).select('id').single();

  if (error) {
    window.showToast('post failed: ' + error.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<span>Post</span> <i class="fas fa-paper-plane"></i>';
    return;
  }

  // CEIN award for post — server-side, idempotent, capped at 3/day
  if (insertedPost?.id) {
    try {
      const { data: cein } = await window.supabaseClient.rpc('award_post_cein', {
        p_post_id: insertedPost.id
      });
      if (cein && cein.ok) {
        window.showToast(`📝 posted · +${cein.amount} CEIN`, 'success');
        await refreshCEINDisplays();
      }
    } catch (e) {
      console.error('award_post_cein failed:', e);
    }
  }

  document.getElementById('post-ta').value = '';
  document.getElementById('post-preview').innerHTML = '';
  document.getElementById('post-preview-wrap').classList.remove('show');
  document.getElementById('post-img-preview').classList.remove('show');
  document.getElementById('post-link-preview-modal').classList.remove('show');
  pendingImageFile = null;
  btn.disabled = false;
  btn.innerHTML = '<span>Post</span> <i class="fas fa-paper-plane"></i>';

  closePostModal();
  await refreshFeed();
}

function initEmojiPicker() {

  EMOJIS.forEach(emoji => {

    span.textContent = emoji;
    span.onclick = () => insertEmoji(emoji);
    frag.appendChild(span);

function positionEmojiPicker() {
  const picker = document.getElementById('emoji-picker');

  if (!picker || !toolbar) return;

  const rect = toolbar.getBoundingClientRect();
  picker.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
  picker.style.top = 'auto';
  picker.style.left = rect.left + 'px';
  picker.style.width = Math.min(rect.width, 400) + 'px';

  const availableAbove = rect.top - 16;
  const clampedHeight = Math.max(60, Math.min(240, availableAbove));
  picker.style.maxHeight = clampedHeight + 'px';
}

function toggleEmojiPicker(e) {
  if (e) e.stopPropagation();
  const picker = document.getElementById('emoji-picker');
  if (!picker) return;

  if (picker.parentElement !== document.body) {
    document.body.appendChild(picker);
  }

  if (!emojiPickerInitialized) initEmojiPicker();
  const isOpen = picker.classList.contains('open');
  if (isOpen) {
    picker.classList.remove('open');
  } else {
    positionEmojiPicker();
    picker.classList.add('open');
    document.getElementById('pt-size-menu').classList.remove('open');
  }
}

function insertEmoji(emoji) {
  const input = document.getElementById('post-ta');
  const pos = input.selectionStart ?? input.value.length;
  input.value = input.value.slice(0, pos) + emoji + input.value.slice(pos);
  input.selectionStart = input.selectionEnd = pos + emoji.length;
  input.focus();
  onPostInput();
}

async function attachCommentCounts(posts) {
  if (!posts || posts.length === 0) return;
  const ids = posts.map(p => p.id);
  const { data: comments } = await window.supabaseClient
    .from('comments')
    .select('post_id')
    .in('post_id', ids);
  if (!comments) return;
  const counts = {};
  comments.forEach(c => { counts[c.post_id] = (counts[c.post_id] || 0) + 1; });
  posts.forEach(post => {
    commentCountsByPost[post.id] = counts[post.id] || 0;
    const card = document.querySelector(`.post-card[data-id="${post.id}"]`);
    if (!card) return;
    const span = card.querySelector('.comment-count');
    if (span) span.textContent = counts[post.id] || 0;
  });
}

async function attachLikeData(posts) {
  if (!posts || posts.length === 0) return;
  const ids = posts.map(p => p.id);
  
  const { data: likes, error } = await window.supabaseClient
    .from('likes')
    .select('post_id, user_id')
    .in('post_id', ids);
  
  if (error) return;
  
  const counts = {};
  const likedByMe = new Set();
  const myId = window.session?.user?.id;
  
  (likes || []).forEach(l => {
    counts[l.post_id] = (counts[l.post_id] || 0) + 1;
    if (myId && l.user_id === myId) likedByMe.add(l.post_id);
  });
  
  posts.forEach(post => {
    likeCountsByPost[post.id] = counts[post.id] || 0;
    const card = document.querySelector(`.post-card[data-id="${post.id}"]`);
    if (!card) return;
    const likeBtn = card.querySelector('.action-pill');
    if (!likeBtn) return;
    const countEl = likeBtn.querySelector('.like-count');
    if (countEl) countEl.textContent = counts[post.id] || 0;
    if (likedByMe.has(post.id)) {
      likeBtn.classList.add('liked');
    } else {
      likeBtn.classList.remove('liked');
    }
  });
}

async function loadMorePosts() {
  if (isLoadingMore || !hasMorePosts) return;
  isLoadingMore = true;
  
  const loadingEl = document.getElementById('feed-loading');
  loadingEl.style.display = 'block';
  
  currentBatch++;
  const start = currentBatch * POSTS_PER_BATCH;
  const end = start + POSTS_PER_BATCH;
  const batchPosts = allPosts.slice(start, end);
  
  if (batchPosts.length === 0) {
    hasMorePosts = false;
    loadingEl.textContent = '🎉 You\'ve seen all posts!';
    isLoadingMore = false;
    return;
  }
  
  const feedEl = document.getElementById('feed');
  const frag = document.createDocumentFragment();
  batchPosts.forEach(post => frag.appendChild(buildPostCard(post)));
  feedEl.appendChild(frag);
  
  await Promise.all([attachCommentCounts(batchPosts), attachLikeData(batchPosts)]);
  
  try {
    if (window.Ads && typeof window.Ads.mountFeedInjection === 'function') {
      window.Ads.mountFeedInjection(feedEl);
    }
  } catch (e) {}
  
  isLoadingMore = false;
  
  if (end >= allPosts.length) {
    hasMorePosts = false;
    loadingEl.textContent = '🎉 You\'ve seen all posts!';
  } else {
    loadingEl.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════
// ── V3.8 — EXPLORE ALGORITHM ──
// ═══════════════════════════════════════════════════════════
function scorePostForExplore(post) {
  const likes = likeCountsByPost[post.id] || 0;
  const comments = commentCountsByPost[post.id] || 0;

  const ageMs = Date.now() - new Date(post.created_at).getTime();
  const ageDays = ageMs / (1000 * 60 * 60 * 24);
  const recencyBoost = Math.max(0, 7 - ageDays) * 5;

  const followBoost = followingUsernames.has(post.username) ? 20 : 0;

  return (likes * 1) + (comments * 2) + recencyBoost + followBoost;
}

function sortExploreWithDiversity(posts) {
  const scored = posts.map(p => ({ post: p, score: scorePostForExplore(p) }));
  scored.sort((a, b) => b.score - a.score);

  // Diversity: no 2 consecutive from same author (best-effort)
  const result = [];
  let lastAuthor = null;
  const pending = [...scored];

  while (pending.length > 0) {
    let pickedIdx = 0;
    if (lastAuthor) {
      const altIdx = pending.findIndex(item => item.post.username !== lastAuthor);
      if (altIdx >= 0) pickedIdx = altIdx;
    }
    const [picked] = pending.splice(pickedIdx, 1);
    result.push(picked.post);
    lastAuthor = picked.post.username;
  }

  return result;
}

async function refreshFeed() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('loading');
  btn.disabled = true;
  allPosts = [];
  currentBatch = 0;
  hasMorePosts = true;
  document.getElementById('feed').innerHTML = '';
  document.getElementById('feed-loading').style.display = 'none';
  document.getElementById('feed-loading').textContent = 'Loading more posts...';
  await loadFeed();

  try {
    if (window.Ads && typeof window.Ads.mountFeedInjection === 'function') {
      setTimeout(() => {
        const feedEl = document.getElementById('feed');
        if (feedEl) window.Ads.mountFeedInjection(feedEl);
      }, 400);
    }
  } catch (e) {}

  btn.classList.remove('loading');
  btn.disabled = false;
}

async function loadFeed() {
  const feedEl = document.getElementById('feed');

  // Fetch posts + profiles in parallel
  const [postsRes, profilesRes] = await Promise.all([
    window.supabaseClient
      .from('posts')
      .select('*')
      .order('created_at', { ascending: false }),
    window.supabaseClient
      .from('profiles')
      .select('username, pfp_url')
  ]);

  if (postsRes.error) {
    window.showToast('could not load feed: ' + postsRes.error.message, 'error');
    return;
  }

  if (profilesRes.data) {
    profilesRes.data.forEach(p => {
      if (p.pfp_url) window.pfpCache[p.username] = p.pfp_url;
    });
  }

  const allFetchedPosts = postsRes.data || [];

  // Pre-fetch like/comment counts for ALL posts (needed for Explore scoring)
  if (allFetchedPosts.length > 0) {
    const ids = allFetchedPosts.map(p => p.id);

    // Likes
    const { data: likesData } = await window.supabaseClient
      .from('likes')
      .select('post_id, user_id')
      .in('post_id', ids);
    const myId = window.session?.user?.id;
    likeCountsByPost = {};
    (likesData || []).forEach(l => {
      likeCountsByPost[l.post_id] = (likeCountsByPost[l.post_id] || 0) + 1;
    });

    // Comments
    const { data: commentsData } = await window.supabaseClient
      .from('comments')
      .select('post_id')
      .in('post_id', ids);
    commentCountsByPost = {};
    (commentsData || []).forEach(c => {
      commentCountsByPost[c.post_id] = (commentCountsByPost[c.post_id] || 0) + 1;
    });
  }

  // Apply feed tab filter / sort
  let displayPosts = [];

  if (currentFeedTab === 'following') {
    if (followingIds.size === 0) {
      showFollowingEmptyStates();
      return;
    }
    displayPosts = allFetchedPosts.filter(p => followingIds.has(p.user_id));
    if (displayPosts.length === 0) {
      showFollowingEmptyStates();
      return;
    }
  } else {
    // Explore
    displayPosts = sortExploreWithDiversity(allFetchedPosts);
  }

  allPosts = displayPosts;
  feedEl.innerHTML = '';

  if (allPosts.length === 0) {
    feedEl.innerHTML = `<div class="empty-feed"><div class="big">📭</div><div>No posts yet. Be the first!</div></div>`;
    document.getElementById('feed-subtitle').textContent = '0 posts';
    hasMorePosts = false;
    document.getElementById('feed-loading').style.display = 'none';
    return;
  }

  const subtitle = document.getElementById('feed-subtitle');
  if (subtitle) {
    if (currentFeedTab === 'following') {
      subtitle.textContent = `${allPosts.length} post${allPosts.length === 1 ? '' : 's'} from people you follow`;
    } else {
      subtitle.textContent = `${allPosts.length} post${allPosts.length === 1 ? '' : 's'} in Explore`;
    }
  }

  currentBatch = 0;
  const firstBatch = allPosts.slice(0, POSTS_PER_BATCH);
  const frag = document.createDocumentFragment();
  firstBatch.forEach(post => frag.appendChild(buildPostCard(post)));
  feedEl.appendChild(frag);

  await Promise.all([attachCommentCounts(firstBatch), attachLikeData(firstBatch)]);

  if (allPosts.length <= POSTS_PER_BATCH) {
    hasMorePosts = false;
    document.getElementById('feed-loading').style.display = 'none';
  } else {
    hasMorePosts = true;
    document.getElementById('feed-loading').style.display = 'block';
    document.getElementById('feed-loading').textContent = 'Scroll for more posts...';
  }

  // Track views on visible posts (debounced, once per post per session)
  setTimeout(() => trackViewsForVisiblePosts(), 800);
}

// ═══════════════════════════════════════════════════════════
// ── V3.8 — POST VIEW TRACKING ──
// ═══════════════════════════════════════════════════════════
function trackViewsForVisiblePosts() {
  if (!window.session) return;
  const cards = document.querySelectorAll('.post-card[data-id]');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.dataset.id;
      if (!id) return;
      if (viewTrackedThisSession.has(id)) return;
      viewTrackedThisSession.add(id);
      window.supabaseClient
        .rpc('record_post_view', { p_post_id: id })
        .then(() => {}, () => {});
      observer.unobserve(entry.target);
    });
  }, { threshold: 0.5 });

  cards.forEach(card => {
    if (!viewTrackedThisSession.has(card.dataset.id)) observer.observe(card);
  });
}

// ── Build post card (uses parseContent) ──
function buildPostCard(post) {
  const card = document.createElement('div');
  card.className = 'post-card';
  card.dataset.id = post.id;
  
  const displayName = post.display_name || post.username;
  
  const top = document.createElement('div');
  top.className = 'post-top';
  
  const resolvedPfp = post.pfp_url || window.pfpCache[post.username] || null;
  top.appendChild(window.buildAvatar(post.username, resolvedPfp));
  
  if (!resolvedPfp && post.username && !window._pfpFetching?.[post.username]) {
    window._pfpFetching = window._pfpFetching || {};
    window._pfpFetching[post.username] = true;
    window.supabaseClient
      .from('profiles')
      .select('pfp_url')
      .eq('username', post.username)
      .maybeSingle()
      .then(({ data }) => {
        window._pfpFetching[post.username] = false;
        if (data?.pfp_url) {
          window.pfpCache[post.username] = data.pfp_url;
          const avatarEl = top.querySelector('.avatar');
          if (avatarEl && !avatarEl.querySelector('img')) {
            const span = avatarEl.querySelector('span');
            const img = document.createElement('img');
            img.src = data.pfp_url;
            img.alt = post.username;
            img.style.position = 'absolute';
            img.style.inset = '0';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            img.style.display = 'none';
            img.style.borderRadius = '50%';
            img.loading = 'eager';
            img.onload = () => {
              img.style.display = 'block';
              if (span) span.style.display = 'none';
              img.classList.add('loaded');
            };
            img.onerror = () => img.remove();
            avatarEl.appendChild(img);
          }
        }
      })
      .catch(() => {
        window._pfpFetching[post.username] = false;
      });
  }
  
  const meta = document.createElement('div');
  meta.className = 'post-meta';
  meta.innerHTML = `
    <div class="post-username">${window.escapeHTML(displayName)}</div>
    <div class="post-time">${window.timeAgo(post.created_at)}</div>
  `;
  top.appendChild(meta);
  
  const isOwnPost = window.currentUser && post.username === window.currentUser.username;
  const wrap = document.createElement('div');
  wrap.style.position = 'relative';
  const ob = document.createElement('button');
  ob.className = 'post-opts-btn';
  ob.innerHTML = '<i class="fas fa-ellipsis-h"></i>';
  ob.onclick = e => { e.stopPropagation(); toggleOpts(wrap); };
  const menu = document.createElement('div');
  menu.className = 'opts-menu';
  if (isOwnPost) {
    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
    delBtn.onclick = (e) => { e.stopPropagation(); deletePost(post.id); };
    menu.appendChild(delBtn);
  } else {
    const reportBtn = document.createElement('button');
    reportBtn.innerHTML = '<i class="fas fa-flag"></i> Report';
    reportBtn.onclick = (e) => {
      e.stopPropagation();
      const preview = (post.content || '').slice(0, 60);
      window.reportPost(post.id, preview);
    };
    menu.appendChild(reportBtn);
  }
  wrap.appendChild(ob);
  wrap.appendChild(menu);
  top.appendChild(wrap);
  card.appendChild(top);
  
  const body = document.createElement('div');
  body.className = 'post-body';

  const textHTML = post.content
    ? `<div class="post-text rich">${parseContent(post.content)}</div>`
    : '';

  let mediaHTML = '';
  if (post.image_url) {
    mediaHTML = `<div class="post-img-wrap"><img class="post-img" src="${window.escapeHTML(post.image_url)}" alt="Post image" loading="lazy" onclick="event.stopPropagation();openImageModal('${window.escapeHTML(post.image_url)}')" onerror="this.parentElement.remove()"/></div>`;
  } else {
    const link = findFirstLink(post.content);
    if (link) {
      mediaHTML = `
        <a class="post-link-card" href="${window.escapeHTML(link.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
          <div class="post-link-icon"><i class="fas fa-link"></i></div>
          <div class="post-link-body">
            <div class="post-link-label">${window.escapeHTML(link.label)}</div>
            <div class="post-link-domain">${window.escapeHTML(link.domain)}</div>
          </div>
          <div class="post-link-arrow"><i class="fas fa-arrow-right"></i></div>
        </a>
      `;
    }
  }

  body.innerHTML = textHTML + mediaHTML;
  card.appendChild(body);
  
  const actions = document.createElement('div');
  actions.className = 'post-actions';
  
  const likeBtn = document.createElement('button');
  likeBtn.className = 'action-pill';
  likeBtn.innerHTML = `<span class="icon"><i class="fas fa-heart"></i></span> <span class="like-count">0</span>`;
  likeBtn.onclick = () => toggleLike(post.id, likeBtn);
  
  const commentBtn = document.createElement('button');
  commentBtn.className = 'action-pill';
  commentBtn.innerHTML = `<span class="icon"><i class="fas fa-comment"></i></span> <span class="comment-count">0</span>`;
  commentBtn.onclick = () => toggleComments(post.id, card);
  
  actions.appendChild(likeBtn);
  actions.appendChild(commentBtn);
  card.appendChild(actions);
  
  const commentsSection = document.createElement('div');
  commentsSection.className = 'comments-section';
  commentsSection.id = 'comments-' + post.id;
  commentsSection.innerHTML = `
    <div class="comment-input-row">
      <div class="comment-av"><span>${(window.currentUser?.username?.[0] || '?').toUpperCase()}</span></div>
      <textarea class="comment-input" id="ci-${post.id}" placeholder="Add a comment..." rows="1"></textarea>
      <button class="comment-send" onclick="submitComment('${post.id}')"><i class="fas fa-arrow-up"></i></button>
    </div>
    <div class="comment-list" id="cl-${post.id}">
      <div style="color:var(--muted);font-size:0.75rem;font-family:Space Mono,monospace;padding:4px 0">no comments yet</div>
    </div>
  `;
  card.appendChild(commentsSection);
  
  if (window.currentUser?.pfp_url) {
    const av = commentsSection.querySelector('.comment-av');
    if (av) {
      const span = av.querySelector('span');
      const img = document.createElement('img');
      img.src = window.currentUser.pfp_url;
      img.onload = () => {
        img.classList.add('loaded');
        if (span) span.style.display = 'none';
      };
      img.onerror = () => img.remove();
      av.appendChild(img);
    }
  }
  
  return card;
}

function toggleOpts(wrap) {
  const m = wrap.querySelector('.opts-menu');
  const open = m.classList.contains('open');
  document.querySelectorAll('.opts-menu.open').forEach(x => x.classList.remove('open'));
  if (!open) m.classList.add('open');
}

async function deletePost(postId) {
  if (!confirm('delete this post?')) return;
  const { error } = await window.supabaseClient.from('posts').delete().eq('id', postId).eq('user_id', window.session.user.id);
  if (error) {
    window.showToast('delete failed: ' + error.message, 'error');
    return;
  }
  const card = document.querySelector(`.post-card[data-id="${postId}"]`);
  if (card) {
    card.style.transition = 'all 0.3s';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.95)';
    setTimeout(() => card.remove(), 300);
  }
  window.showToast('post deleted', 'success');
}

async function toggleLike(postId, btn) {
  if (!window.session || !window.session.user) {
    window.showToast('You must be logged in', 'error');
    return;
  }
  
  const liked = btn.classList.contains('liked');
  const countEl = btn.querySelector('.like-count');
  const currentCount = parseInt(countEl.textContent) || 0;
  
  if (liked) {
    btn.classList.remove('liked');
    countEl.textContent = Math.max(0, currentCount - 1);
  } else {
    btn.classList.add('liked');
    countEl.textContent = currentCount + 1;
  }
  
  let error;
  if (liked) {
    ({ error } = await window.supabaseClient
      .from('likes')
      .delete()
      .eq('post_id', postId)
      .eq('user_id', window.session.user.id));
  } else {
    ({ error } = await window.supabaseClient
      .from('likes')
      .insert({ post_id: postId, user_id: window.session.user.id }));
    if (error && error.code === '23505') return;
  }
  
  if (error) {
    if (liked) {
      btn.classList.add('liked');
      countEl.textContent = currentCount;
    } else {
      btn.classList.remove('liked');
      countEl.textContent = currentCount;
    }
    window.showToast('like failed: ' + error.message, 'error');
  }
}

async function toggleComments(postId, card) {
  const section = document.getElementById('comments-' + postId);
  const open = section.classList.contains('open');
  section.classList.toggle('open', !open);
  if (!open) await loadComments(postId);
}

async function loadComments(postId) {
  const list = document.getElementById('cl-' + postId);
  const { data: comments } = await window.supabaseClient
    .from('comments')
    .select('*')
    .eq('post_id', postId)
    .order('created_at', { ascending: true });
  
  list.innerHTML = '';
  if (!comments || comments.length === 0) {
    list.innerHTML = '<div style="color:var(--muted);font-size:0.75rem;font-family:Space Mono,monospace;padding:4px 0">no comments yet</div>';
    return;
  }
  
  const frag = document.createDocumentFragment();
  comments.forEach((c) => {
    const isOwnComment = window.currentUser && c.username === window.currentUser.username;
    const item = document.createElement('div');
    item.className = 'comment-item';
    item.appendChild(window.buildAvatar(c.username, window.pfpCache[c.username] || null, 28, 'comment-av'));
    const body = document.createElement('div');
    body.className = 'comment-body';
    const displayName = c.display_name || c.username;

    const head = document.createElement('div');
    head.className = 'comment-head';

    const whoEl = document.createElement('div');
    whoEl.className = 'comment-who';
    whoEl.textContent = displayName;
    head.appendChild(whoEl);

    if (!isOwnComment) {
      const reportBtn = document.createElement('button');
      reportBtn.className = 'comment-report-btn';
      reportBtn.title = 'Report comment';
      reportBtn.innerHTML = '<i class="fas fa-flag"></i>';
      reportBtn.onclick = (e) => {
        e.stopPropagation();
        const preview = (c.content || '').slice(0, 60);
        window.reportComment(c.id, preview);
      };
      head.appendChild(reportBtn);
    } else {
      const delBtn = document.createElement('button');
      delBtn.className = 'comment-delete-btn';
      delBtn.title = 'Delete comment';
      delBtn.innerHTML = '<i class="fas fa-trash"></i>';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteComment(c.id, postId);
      };
      head.appendChild(delBtn);
    }
    body.appendChild(head);

    const textEl = document.createElement('div');
    textEl.className = 'comment-text';
    textEl.textContent = c.content || '';
    body.appendChild(textEl);

    const timeEl = document.createElement('div');
    timeEl.className = 'comment-time';
    timeEl.textContent = window.timeAgo(c.created_at);
    body.appendChild(timeEl);

    item.appendChild(body);
    frag.appendChild(item);
  });
  list.appendChild(frag);
}

async function deleteComment(commentId, postId) {
  if (!confirm('Delete this comment?')) return;

  const { error } = await window.supabaseClient
    .from('comments')
    .delete()
    .eq('id', commentId)
    .eq('user_id', window.session.user.id);

  if (error) {
    window.showToast('Delete failed: ' + error.message, 'error');
    return;
  }

  const section = document.getElementById('cl-' + postId);
  if (section) {
    await loadComments(postId);
  }

  const postCard = document.querySelector(`.post-card[data-id="${postId}"]`);
  if (postCard) {
    const span = postCard.querySelector('.comment-count');
    if (span) {
      const current = parseInt(span.textContent || '0');
      span.textContent = Math.max(0, current - 1);
    }
  }

  window.showToast('Comment deleted', 'success');
}

async function submitComment(postId) {
  const input = document.getElementById('ci-' + postId);
  const text = input.value.trim();
  
  if (!text) {
    window.showToast('write a comment first', 'error');
    return;
  }
  if (!window.session || !window.session.user) {
    window.showToast('You must be logged in', 'error');
    return;
  }
  
  const displayName = window.currentUser.display_name || window.currentUser.username;
  
  const { data: insertedComment, error } = await window.supabaseClient.from('comments').insert({
    post_id: postId,
    user_id: window.session.user.id,
    username: window.currentUser.username,
    display_name: displayName,
    content: text
  }).select('id').single();
  
  if (error) {
    window.showToast('comment failed', 'error');
    return;
  }

  // CEIN award for comment — server-side, idempotent, capped at 10/day
  if (insertedComment?.id) {
    try {
      const { data: cein } = await window.supabaseClient.rpc('award_comment_cein', {
        p_comment_id: insertedComment.id
      });
      if (cein && cein.ok) {
        window.showToast(`💬 +${cein.amount} CEIN`, 'success');
        await refreshCEINDisplays();
      }
    } catch (e) {
      console.error('award_comment_cein failed:', e);
    }
  }
  
  input.value = '';
  
  const { data: postRow } = await window.supabaseClient.from('posts').select('user_id').eq('id', postId).single();
  if (postRow && postRow.user_id !== window.session.user.id) {
    await window.supabaseClient.from('notifications').insert({
      recipient_id: postRow.user_id,
      actor_username: window.currentUser.username,
      actor_display_name: displayName,
      actor_pfp_url: window.currentUser.pfp_url || null,
      type: 'post_comment',
      ref_id: postId,
      preview: text.slice(0, 80)
    });
  }
  
  await loadComments(postId);
  const section = document.getElementById('comments-' + postId);
  const card = section.closest('.post-card');
  if (card) {
    const span = card.querySelector('.comment-count');
    if (span) span.textContent = parseInt(span.textContent || '0') + 1;
  }
}

function openImageModal(url) {
  const modal = document.getElementById('img-modal');
  const img = document.getElementById('modal-img');
  img.src = url;
  modal.classList.add('show');
}
function closeImageModal() {
  document.getElementById('img-modal').classList.remove('show');
}

window.openPostModal = openPostModal;
window.closePostModal = closePostModal;
window.postModalBgClick = postModalBgClick;

window.closeLinkPanel = closeLinkPanel;

window.handleImageUpload = handleImageUpload;
window.removeImage = removeImage;

window.toggleComments = toggleComments;

window.closeImageModal = closeImageModal;
window.toggleEmojiPicker = toggleEmojiPicker;

  window.openQuickReport('post', postId, preview);
};

  window.openQuickReport('comment', commentId, preview);
};

// ── BANNER STREAK ──
function updateBannerStreak() {
  const el = document.getElementById('banner-streak-count');
  if (!el) return;
  const streak = window.currentUser?.streak || 0;
  el.textContent = streak;
  const wrap = document.getElementById('banner-streak');
  if (wrap) {
    if (streak >= 3) wrap.classList.add('hot');
    else wrap.classList.remove('hot');
  }
}

// ── BANNER CEIN ──
async function updateBannerCEIN() {
  const el = document.getElementById('banner-cein-count');
  if (!el) return;
  try {
    const { data, error } = await window.supabaseClient.rpc('get_my_credits');
    if (error || !data || !data.ok) return;
    el.textContent = data.balance;
  } catch (e) {
    console.error('updateBannerCEIN:', e);
  }
}

async function refreshCEINDisplays() {
  await updateBannerCEIN();
  if (typeof window.loadCEINBalance === 'function') {
    await window.loadCEINBalance();
  }
}

// ── PAGE INIT ──
async function pageInit() {
  definePageSteps();
  nextLoadingStep();  // theme
  nextLoadingStep();  // auth
  nextLoadingStep();  // profile

  // Load following graph so we know what to filter
  await loadFollowingGraph();

  nextLoadingStep();  // feed
  loadFeedTabPreference();
  await loadFeed();

  updateBannerStreak();
  updateBannerCEIN();

  try {
    const tryMountFeedAd = (attempt = 0) => {
      if (!window.Ads || typeof window.Ads.getCached !== 'function') {
        if (attempt < 20) return setTimeout(() => tryMountFeedAd(attempt + 1), 100);
        return;
      }
      const cached = window.Ads.getCached();
      if (!cached || cached.length === 0) {
        if (attempt < 20) return setTimeout(() => tryMountFeedAd(attempt + 1), 100);
        return;
      }
      const feedEl = document.getElementById('feed');
      if (feedEl && typeof window.Ads.mountFeedInjection === 'function') {
        window.Ads.mountFeedInjection(feedEl);
      }
    };
    tryMountFeedAd();
  } catch (e) {
    console.log('[Ads feed]', e);
  }

  nextLoadingStep();  // online
  nextLoadingStep();  // notifs

  setupInfiniteScroll();

  const params = new URLSearchParams(window.location.search);
  const postId = params.get('post');
  if (postId) {
    const postEl = document.querySelector(`[data-id="${postId}"]`);
    if (postEl) {
      postEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      postEl.style.borderColor = 'var(--neon)';
      setTimeout(() => postEl.style.borderColor = '', 3000);
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initPage(pageInit);
  });
} else {
  initPage(pageInit);
}
</script>
