<script>
// ── PAGE-SPECIFIC CODE ──
const MAX_IMAGE_SIZE = 500 * 1024;
const EDIT_WINDOW_MINUTES = 15;
const EMOJIS = [
  '😂','🔥','💀','⚡','🎮','😭','🤝','👀','✅','❌',
  '🚀','💯','😈','🤡','👾','🧠','🫡','💬','🎯','🌊',
  '❤️','💔','✨','🌟','⭐','🌈','☀️','🌙','🎉','🎊',
  '💪','🤙','👋','🙌','🤘','🖤','💛','💚','💙','💜',
  '🤖','👻','🎃','👽','💀','☠️','👹','👺','🐱','🐶'
];

let username = 'user';
let replyTo = null;
let editingId = null;
let editingOriginalContent = '';
let editingMsgCreatedAt = null;
let editingImageUrl = null;
let emojiPickerInitialized = false;
let pendingImageFile = null;
let isUploading = false;
let currentDisplayName = '';

// ── NOTIFICATION SETUP ──
let notificationPermission = false;
let lastNotificationTime = 0;
const NOTIFICATION_COOLDOWN = 3000;
let pendingNotificationCount = 0;
let pendingNotificationSender = null;
let notificationTimeout = null;
let unreadCount = 0;
let isPageVisible = true;

// ── NOTIFICATION SOUND ──
function playNotificationSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.frequency.value = 880;
    oscillator.type = 'sine';
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    oscillator.start(audioCtx.currentTime);
    oscillator.stop(audioCtx.currentTime + 0.2);
  } catch (e) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.15);
    } catch (err) {
      console.log('🔇 Sound not available');
    }
  }
}

// ── BROWSER TAB BADGE COUNTER ──
function updateBadgeCounter() {
  if (document.hidden) {
    if (unreadCount > 0) {
      const label = unreadCount > 99 ? '99+' : unreadCount;
      document.title = `(${label}) CESC Hub — Chat`;
      if ('setAppBadge' in navigator) {
        navigator.setAppBadge(unreadCount).catch(() => {});
      }
    } else {
      document.title = 'CESC Hub — Chat';
      if ('clearAppBadge' in navigator) {
        navigator.clearAppBadge().catch(() => {});
      }
    }
  }
}

// ── NOTIFICATION FUNCTIONS ──
function requestNotificationPermission() {
  if (!('Notification' in window)) {
    console.log('This browser does not support notifications');
    return;
  }
  
  if (Notification.permission === 'granted') {
    notificationPermission = true;
    console.log('🔔 Notification permission already granted');
  } else if (Notification.permission === 'denied') {
    console.log('🔔 Notification permission denied');
  } else {
    Notification.requestPermission().then(permission => {
      notificationPermission = permission === 'granted';
      if (notificationPermission) {
        console.log('🔔 Notification permission granted!');
        new Notification('🔔 CESC Hub', {
          body: 'Chat notifications are now enabled!',
          icon: 'https://uploads.onecompiler.io/43m56waex/44huzak7q/232a0cec-1d90-4e0b-8377-41d13d78b763.png'
        });
      } else {
        console.log('🔔 Notification permission denied');
      }
    });
  }
}

function sendGroupedNotification(sender, count) {
  if (!notificationPermission || Notification.permission !== 'granted') return;
  
  try {
    const message = count > 1 
      ? `${count} new messages from ${sender} and others`
      : `New message from ${sender}`;
    
    const notification = new Notification(`💬 ${count > 1 ? 'Multiple messages' : sender}`, {
      body: message,
      icon: 'https://uploads.onecompiler.io/43m56waex/44huzak7q/232a0cec-1d90-4e0b-8377-41d13d78b763.png',
      tag: 'chat-group',
      requireInteraction: false,
      silent: false
    });
    
    notification.onclick = function() {
      window.focus();
      notification.close();
    };
    
    setTimeout(() => {
      if (notification && !notification.closed) {
        notification.close();
      }
    }, 8000);
    
    console.log(`🔔 Group notification: ${count} messages from ${sender}`);
  } catch (e) {
    console.error('Failed to send grouped notification:', e);
  }
}

function checkForMentions(content, sender) {
  if (!content || !username) return false;
  const mentionPattern = new RegExp(`@${username}\\b`, 'i');
  const isMentioned = mentionPattern.test(content);
  
  if (isMentioned) {
    console.log(`🔔 You were mentioned by ${sender}!`);
    playNotificationSound();
    if (notificationPermission && Notification.permission === 'granted') {
      try {
        const notification = new Notification(`🔔 ${sender} mentioned you!`, {
          body: content.length > 50 ? content.slice(0, 50) + '...' : content,
          icon: 'https://uploads.onecompiler.io/43m56waex/44huzak7q/232a0cec-1d90-4e0b-8377-41d13d78b763.png',
          tag: 'mention-' + Date.now(),
          requireInteraction: true
        });
        notification.onclick = function() {
          window.focus();
          notification.close();
        };
      } catch (e) {
        console.error('Mention notification failed:', e);
      }
    }
  }
  return isMentioned;
}

function sendChatNotification(sender, content, imageUrl) {
  if (!document.hidden) {
    console.log('📱 Page visible, skipping notification');
    return;
  }
  
  if (sender === (window.currentUser?.username || username)) {
    return;
  }
  
  if (checkForMentions(content, sender)) {
    playNotificationSound();
    unreadCount++;
    updateBadgeCounter();
    return;
  }
  
  const now = Date.now();
  
  if (now - lastNotificationTime > 10000 || (pendingNotificationSender && pendingNotificationSender !== sender)) {
    if (pendingNotificationCount > 0 && pendingNotificationSender) {
      sendGroupedNotification(pendingNotificationSender, pendingNotificationCount);
      playNotificationSound();
    }
    pendingNotificationCount = 0;
    pendingNotificationSender = null;
  }
  
  if (now - lastNotificationTime < NOTIFICATION_COOLDOWN) {
    pendingNotificationCount++;
    if (!pendingNotificationSender) {
      pendingNotificationSender = sender;
    }
    if (notificationTimeout) {
      clearTimeout(notificationTimeout);
    }
    notificationTimeout = setTimeout(() => {
      if (pendingNotificationCount > 0 && pendingNotificationSender) {
        sendGroupedNotification(pendingNotificationSender, pendingNotificationCount);
        playNotificationSound();
        pendingNotificationCount = 0;
        pendingNotificationSender = null;
      }
    }, 3000);
    unreadCount++;
    updateBadgeCounter();
    return;
  }
  
  lastNotificationTime = now;
  
  if (!notificationPermission || Notification.permission !== 'granted') {
    if (Notification.permission === 'default') {
      Notification.requestPermission();
    }
    return;
  }
  
  let displayContent = content || '📷 Image';
  if (content && content.length > 60) {
    displayContent = content.slice(0, 60) + '...';
  }
  if (imageUrl && !content) {
    displayContent = '📷 Sent an image';
  }
  
  try {
    const notification = new Notification(`💬 ${sender}`, {
      body: displayContent,
      icon: 'https://uploads.onecompiler.io/43m56waex/44huzak7q/232a0cec-1d90-4e0b-8377-41d13d78b763.png',
      tag: 'chat-message-' + Date.now(),
      requireInteraction: false,
      silent: false
    });
    
    notification.onclick = function() {
      window.focus();
      notification.close();
    };
    
    setTimeout(() => {
      if (notification && !notification.closed) {
        notification.close();
      }
    }, 8000);
    
    console.log(`🔔 Notification sent for message from ${sender}`);
    unreadCount++;
    updateBadgeCounter();
  } catch (e) {
    console.error('Failed to send notification:', e);
  }
}

// ── EMOJI PICKER ──
function initEmojiPicker() {
  if (emojiPickerInitialized) return;
  const grid = document.getElementById('emoji-grid');
  if (!grid) return;
  EMOJIS.forEach(emoji => {
    const span = document.createElement('span');
    span.textContent = emoji;
    span.onclick = () => insertEmoji(emoji);
    grid.appendChild(span);
  });
  emojiPickerInitialized = true;
}

window.toggleEmojiPicker = function() {
  const picker = document.getElementById('emoji-picker');
  if (!picker) return;
  if (!picker.classList.contains('open')) {
    if (!emojiPickerInitialized) initEmojiPicker();
    picker.classList.add('open');
  } else {
    picker.classList.remove('open');
  }
};

function insertEmoji(emoji) {
  const input = document.getElementById('msg-input');
  const pos = input.selectionStart;
  input.value = input.value.slice(0, pos) + emoji + input.value.slice(pos);
  input.selectionStart = input.selectionEnd = pos + emoji.length;
  input.focus();
}

// ── IMAGE UPLOAD ──
window.handleImageUpload = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > MAX_IMAGE_SIZE) {
    window.showToast(`Image too large (${(file.size/1024).toFixed(0)}KB). Max 500KB 💀`, 'error');
    e.target.value = '';
    return;
  }
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const preview = document.getElementById('image-preview');
    const wrap = document.getElementById('image-preview-wrap');
    const size = document.getElementById('image-preview-size');
    preview.src = ev.target.result;
    size.textContent = (file.size / 1024).toFixed(1) + ' KB';
    wrap.classList.add('show');
    document.getElementById('edit-image-label').style.display = 'none';
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

window.removeImage = function() {
  pendingImageFile = null;
  editingImageUrl = null;
  document.getElementById('image-preview-wrap').classList.remove('show');
  document.getElementById('image-preview').src = '';
  document.getElementById('edit-image-label').style.display = 'none';
};

window.insertNewline = function() {
  const input = document.getElementById('msg-input');
  const pos = input.selectionStart;
  input.value = input.value.slice(0, pos) + '\n' + input.value.slice(pos);
  input.selectionStart = input.selectionEnd = pos + 1;
  input.focus();
};

window.openChatImageModal = function(url) {
  const modal = document.getElementById('chat-img-modal');
  const img = document.getElementById('chat-modal-img');
  img.src = url;
  modal.classList.add('show');
};

window.closeChatImageModal = function() {
  document.getElementById('chat-img-modal').classList.remove('show');
};

// ── AVATAR ──
function buildMsgAvatar(uname) {
  const div = document.createElement('div');
  div.className = 'msg-avatar';
  const initial = document.createElement('span');
  initial.textContent = (uname?.[0] || '?').toUpperCase();
  div.appendChild(initial);
  
  const pfpUrl = window.pfpCache?.[uname];
  if (pfpUrl) {
    const img = document.createElement('img');
    img.src = pfpUrl; img.alt = uname;
    img.onload  = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
    img.onerror = () => { img.remove(); initial.style.display = ''; };
    div.appendChild(img);
  }
  return div;
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function formatDate(ts) {
  const d = new Date(ts), today = new Date(), yesterday = new Date();
  yesterday.setDate(yesterday.getDate()-1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month:'long', day:'numeric', year:'numeric' });
}

function canEditMessage(msgCreatedAt) {
  const now = Date.now();
  const msgTime = new Date(msgCreatedAt).getTime();
  const diffMinutes = (now - msgTime) / (1000 * 60);
  return diffMinutes <= EDIT_WINDOW_MINUTES;
}

// ── INIT ──
async function init() {
  if (typeof window.initTheme !== 'function') {
    console.log('⏳ Waiting for shared.js...');
    setTimeout(init, 200);
    return;
  }
  
  console.log('✅ shared.js loaded');
  window.initTheme();
  
  requestNotificationPermission();
  
  document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
    if (isPageVisible) {
      unreadCount = 0;
      document.title = 'CESC Hub — Chat';
      if ('clearAppBadge' in navigator) {
        navigator.clearAppBadge().catch(() => {});
      }
    }
  });
  
  const sess = await window.initAuth();
  if (!sess) return;
  
  console.log('✅ Session loaded:', sess.user.email);
  
  const { data: profile } = await window.supabaseClient
    .from('profiles')
    .select('username, display_name, pfp_url')
    .eq('id', window.session.user.id)
    .single();
  
  // Update window.currentUser with the profile data
  window.currentUser = {
    ...window.currentUser,
    username: profile?.username,
    display_name: profile?.display_name || profile?.username,
    pfp_url: profile?.pfp_url
  };
  
  const displayName = window.currentUser.display_name;
  const rawUsername = window.currentUser.username;
  
  username = rawUsername;
  currentDisplayName = displayName;
  
  const chipName = document.getElementById('chip-name');
  const ddName = document.getElementById('dd-name');
  const chipInitial = document.getElementById('chip-initial');
  
  if (chipName) chipName.textContent = displayName;
  if (ddName) ddName.textContent = displayName;
  if (chipInitial) chipInitial.textContent = (displayName?.[0] || '?').toUpperCase();
  
  if (profile?.pfp_url) {
    const av = document.getElementById('chip-av');
    if (av) {
      const initial = av.querySelector('span');
      const img = document.createElement('img');
      img.src = profile.pfp_url;
      img.onload = () => { img.classList.add('loaded'); if (initial) initial.style.display = 'none'; };
      img.onerror = () => img.remove();
      av.appendChild(img);
    }
  }
  
  await window.loadPfpCache();
  await window.loadNotifCount();
  await window.loadOnlineCount();
  
  const onlineCount = document.getElementById('online-count');
  if (onlineCount) {
    const chatOnline = document.getElementById('chat-online-count');
    if (chatOnline) chatOnline.textContent = onlineCount.textContent + ' online';
  }
  
  await loadMessages();
  setupRealtime();
}

// ── BUILD MESSAGE GROUP ──
function buildMessageGroup(msg, isContinued) {
  const group = document.createElement('div');
  group.className = 'msg-group' + (isContinued ? '' : ' first-in-group');
  group.dataset.id = msg.id;
  group.dataset.username = msg.username;
  group.dataset.content = msg.content;
  group.dataset.created_at = msg.created_at;
  group.dataset.image_url = msg.image_url || '';

  const displayName = msg.display_name || msg.username;
  const isOwn = msg.username === (window.currentUser?.username || username);
  const canEdit = isOwn && canEditMessage(msg.created_at);

  const isMentioned = msg.content && username && 
    new RegExp(`@${username}\\b`, 'i').test(msg.content) && !isOwn;

  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.innerHTML = `
    <button class="action-btn" onclick="window.startReply('${msg.id}','${window.escapeHTML(displayName)}','${window.escapeHTML(msg.content.slice(0,80)).replace(/'/g,"\\'")}')"><i class="fas fa-reply"></i></button>
    ${isOwn ? `<button class="action-btn ${!canEdit ? 'disabled' : ''}" onclick="${canEdit ? `window.startEditMode('${msg.id}')` : ''}" title="${!canEdit ? 'Edit window expired (15 min)' : ''}"><i class="fas fa-edit"></i></button>` : ''}
    ${isOwn ? `<button class="action-btn del" onclick="window.deleteMsg('${msg.id}')"><i class="fas fa-trash"></i></button>` : ''}
  `;
  group.appendChild(actions);

  const row = document.createElement('div');
  row.className = 'msg-row';

  if (!isContinued) {
    row.appendChild(buildMsgAvatar(msg.username));
    const content = document.createElement('div');
    content.className = 'msg-content';

    let replyHTML = '';
    if (msg.reply_to && msg.reply_username) {
      replyHTML = `
        <div class="reply-quote" onclick="window.scrollToMsg('${msg.reply_to}')">
          <div class="reply-body">
            <div class="reply-who">${window.escapeHTML(msg.reply_username)}</div>
            <div class="reply-text">${window.escapeHTML(msg.reply_preview || '')}</div>
          </div>
        </div>`;
    }

    let imageHTML = '';
    if (msg.image_url) {
      imageHTML = `<img src="${msg.image_url}" alt="Image" onclick="event.stopPropagation(); window.openChatImageModal('${msg.image_url}')"/>`;
    }

    content.innerHTML = `
      ${replyHTML}
      <div class="msg-header">
        <span class="msg-username">${window.escapeHTML(displayName)}</span>
        ${isMentioned ? '<span class="mention-badge">@you</span>' : ''}
        <span class="msg-time">${formatTime(msg.created_at)}</span>
        ${msg.edited ? '<span class="msg-edited">(edited)</span>' : ''}
      </div>
      <div class="msg-text" id="text-${msg.id}">${window.escapeHTML(msg.content)} ${imageHTML}</div>
    `;
    row.appendChild(content);
  } else {
    const placeholder = document.createElement('div');
    placeholder.className = 'msg-avatar-placeholder';
    placeholder.innerHTML = `<span class="msg-timestamp-inline">${formatTime(msg.created_at)}</span>`;
    row.appendChild(placeholder);
    const content = document.createElement('div');
    content.className = 'msg-content';

    let replyHTML = '';
    if (msg.reply_to && msg.reply_username) {
      replyHTML = `
        <div class="reply-quote" onclick="window.scrollToMsg('${msg.reply_to}')">
          <div class="reply-body">
            <div class="reply-who">${window.escapeHTML(msg.reply_username)}</div>
            <div class="reply-text">${window.escapeHTML(msg.reply_preview || '')}</div>
          </div>
        </div>`;
    }

    let imageHTML = '';
    if (msg.image_url) {
      imageHTML = `<img src="${msg.image_url}" alt="Image" onclick="event.stopPropagation(); window.openChatImageModal('${msg.image_url}')"/>`;
    }

    content.innerHTML = `
      ${replyHTML}
      <div class="msg-text" id="text-${msg.id}">${window.escapeHTML(msg.content)} ${imageHTML}</div>
    `;
    row.appendChild(content);
  }

  group.appendChild(row);
  return group;
}

let lastDate = null, lastUser = null, lastTimestamp = null;

function appendMessage(msg, scroll = true) {
  const container = document.getElementById('messages');
  const loading = container.querySelector('.loading-msgs');
  if (loading) loading.remove();

  const msgDate = formatDate(msg.created_at);
  if (msgDate !== lastDate) {
    const div = document.createElement('div');
    div.className = 'date-divider';
    div.textContent = msgDate;
    container.appendChild(div);
    lastDate = msgDate;
    lastUser = null;
  }

  const timeDiff = lastTimestamp ? (new Date(msg.created_at) - new Date(lastTimestamp)) / 60000 : 999;
  const isContinued = msg.username === lastUser && timeDiff < 5 && !msg.reply_to;

  const group = buildMessageGroup(msg, isContinued);
  container.appendChild(group);
  lastUser = msg.username;
  lastTimestamp = msg.created_at;
  if (scroll) container.scrollTop = container.scrollHeight;
}

async function loadMessages() {
  try {
    const { data, error } = await window.supabaseClient
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true });
    
    if (error) {
      console.error('❌ LOAD ERROR:', error);
      window.showToast('Failed to load messages', 'error');
      return;
    }
    
    console.log('✅ Loaded', data?.length || 0, 'messages');
    
    const container = document.getElementById('messages');
    container.innerHTML = '';
    lastDate = null; lastUser = null; lastTimestamp = null;
    
    if (!data || data.length === 0) {
      container.innerHTML = '<div class="system-msg">chat is live ⚡ say something</div>';
      return;
    }
    
    data.forEach(m => appendMessage(m, false));
    container.scrollTop = container.scrollHeight;
  } catch (e) {
    console.error('❌ Load messages error:', e);
    window.showToast('Error loading messages', 'error');
  }
}

// ── REALTIME ──
function setupRealtime() {
  window.supabaseClient.channel('cesc-messages')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, payload => {
      const newMsg = payload.new;
      
      if (newMsg.username && newMsg.username !== username) {
        if (!document.hidden) {
          playNotificationSound();
        }
        sendChatNotification(
          newMsg.display_name || newMsg.username,
          newMsg.content || '',
          newMsg.image_url || null
        );
      }
      
      if (!window.pfpCache?.[newMsg.username]) {
        window.supabaseClient.from('profiles').select('pfp_url').eq('username', newMsg.username).single()
          .then(({ data }) => { if (data?.pfp_url) window.pfpCache[newMsg.username] = data.pfp_url; });
      }
      appendMessage(newMsg);
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'messages' }, payload => {
      const msg = payload.new;
      const textEl = document.getElementById(`text-${msg.id}`);
      if (textEl) {
        let imageHTML = '';
        if (msg.image_url) {
          imageHTML = `<img src="${msg.image_url}" alt="Image" onclick="event.stopPropagation(); window.openChatImageModal('${msg.image_url}')"/>`;
        }
        textEl.innerHTML = window.escapeHTML(msg.content) + ' ' + imageHTML;
        const header = textEl.closest('.msg-content')?.querySelector('.msg-header');
        if (header && msg.edited && !header.querySelector('.msg-edited')) {
          const badge = document.createElement('span');
          badge.className = 'msg-edited';
          badge.textContent = '(edited)';
          header.appendChild(badge);
        }
      }
    })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'messages' }, payload => {
      const group = document.querySelector(`.msg-group[data-id="${payload.old.id}"]`);
      if (group) group.remove();
    })
    .subscribe(status => console.log('REALTIME:', status));
}

// ── SEND ──
window.sendMsg = function() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  
  if (editingId) {
    saveEdit();
    return;
  }
  
  if (!text && !pendingImageFile) {
    window.showToast('write something or add an image 💀', 'error');
    return;
  }
  if (!window.session) {
    window.showToast('Not logged in', 'error');
    return;
  }
  if (isUploading) return;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  isUploading = true;

  sendMessage(text, btn);
};

async function sendMessage(text, btn) {
  let image_url = null;
  if (pendingImageFile) {
    const ext = pendingImageFile.name.split('.').pop();
    const path = `${window.session.user.id}/${Date.now()}_chat.${ext}`;
    const { error: uploadError } = await window.supabaseClient.storage.from('post-images').upload(path, pendingImageFile, {
      contentType: pendingImageFile.type
    });
    if (uploadError) {
      window.showToast('Image upload failed: ' + uploadError.message, 'error');
      btn.disabled = false;
      isUploading = false;
      return;
    }
    const { data: urlData } = window.supabaseClient.storage.from('post-images').getPublicUrl(path);
    image_url = urlData.publicUrl;
    pendingImageFile = null;
    document.getElementById('image-preview-wrap').classList.remove('show');
  }

  const displayName = window.currentUser?.display_name || window.currentUser?.username || username;

  const payload = {
    user_id: window.session.user.id,
    username: window.currentUser?.username || username,
    display_name: displayName,
    content: text || '📷',
    image_url: image_url || null,
    ...(replyTo ? {
      reply_to: replyTo.id,
      reply_username: replyTo.username,
      reply_preview: replyTo.content.slice(0, 100)
    } : {})
  };

  const { error } = await window.supabaseClient.from('messages').insert(payload);
  if (error) {
    window.showToast('Send failed: ' + error.message, 'error');
    btn.disabled = false;
    isUploading = false;
    return;
  }
  
  await window.updateLastSeen();
  document.getElementById('msg-input').value = '';
  document.getElementById('msg-input').style.height = 'auto';
  btn.disabled = false;
  isUploading = false;
  window.cancelReply();
}

// ── EDIT MODE ──
window.startEditMode = function(id) {
  const group = document.querySelector(`.msg-group[data-id="${id}"]`);
  if (!group) return;
  
  const createdAt = group.dataset.created_at;
  if (!canEditMessage(createdAt)) {
    window.showToast('Edit window expired (15 min)', 'error');
    return;
  }
  
  if (editingId) window.cancelEditMode();
  
  editingId = id;
  editingMsgCreatedAt = createdAt;
  const currentText = group?.dataset.content || '';
  editingOriginalContent = currentText;
  editingImageUrl = group.dataset.image_url || null;
  
  const banner = document.getElementById('edit-banner');
  const bannerText = document.getElementById('edit-banner-text');
  bannerText.textContent = currentText.slice(0, 60) + (currentText.length > 60 ? '...' : '');
  banner.classList.add('show');
  
  const input = document.getElementById('msg-input');
  input.value = currentText;
  input.focus();
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  
  const btn = document.getElementById('send-btn');
  btn.innerHTML = '<i class="fas fa-check"></i>';
  btn.classList.add('editing');
  
  document.getElementById('input-hint').textContent = 'edit message · esc to cancel';
  
  if (editingImageUrl) {
    const preview = document.getElementById('image-preview');
    const wrap = document.getElementById('image-preview-wrap');
    const size = document.getElementById('image-preview-size');
    const label = document.getElementById('edit-image-label');
    preview.src = editingImageUrl;
    size.textContent = 'existing';
    label.style.display = 'block';
    wrap.classList.add('show');
  } else {
    window.removeImage();
  }
  
  window.cancelReply();
};

window.cancelEditMode = function() {
  if (!editingId) return;
  
  editingId = null;
  editingMsgCreatedAt = null;
  editingOriginalContent = '';
  editingImageUrl = null;
  
  document.getElementById('edit-banner').classList.remove('show');
  
  const input = document.getElementById('msg-input');
  input.value = '';
  input.style.height = 'auto';
  
  const btn = document.getElementById('send-btn');
  btn.innerHTML = '<i class="fas fa-arrow-up"></i>';
  btn.classList.remove('editing');
  
  document.getElementById('input-hint').textContent = 'enter to send · shift+enter for new line';
  
  window.removeImage();
};

async function saveEdit() {
  if (!editingId) return;
  
  const input = document.getElementById('msg-input');
  const newText = input.value.trim();
  
  if (!newText && !pendingImageFile && !editingImageUrl) {
    window.showToast('Message cannot be empty', 'error');
    return;
  }
  
  if (!canEditMessage(editingMsgCreatedAt)) {
    window.showToast('Edit window expired (15 min)', 'error');
    window.cancelEditMode();
    return;
  }
  
  let image_url = editingImageUrl;
  
  if (pendingImageFile) {
    const ext = pendingImageFile.name.split('.').pop();
    const path = `${window.session.user.id}/${Date.now()}_chat.${ext}`;
    const { error: uploadError } = await window.supabaseClient.storage.from('post-images').upload(path, pendingImageFile, {
      contentType: pendingImageFile.type
    });
    if (uploadError) {
      window.showToast('Image upload failed: ' + uploadError.message, 'error');
      return;
    }
    const { data: urlData } = window.supabaseClient.storage.from('post-images').getPublicUrl(path);
    image_url = urlData.publicUrl;
    pendingImageFile = null;
    document.getElementById('image-preview-wrap').classList.remove('show');
  }
  
  const updateData = {
    content: newText || '📷',
    edited: true
  };
  
  if (image_url !== editingImageUrl || pendingImageFile) {
    updateData.image_url = image_url;
  }
  
  if (!document.getElementById('image-preview-wrap').classList.contains('show') && !editingImageUrl) {
    updateData.image_url = null;
  }
  
  const { error } = await window.supabaseClient.from('messages')
    .update(updateData)
    .eq('id', editingId)
    .eq('user_id', window.session.user.id);
  
  if (error) {
    window.showToast('Edit failed: ' + error.message, 'error');
    return;
  }
  
  const group = document.querySelector(`.msg-group[data-id="${editingId}"]`);
  if (group) {
    group.dataset.content = newText;
    group.dataset.image_url = image_url || '';
  }
  
  window.cancelEditMode();
  window.showToast('Message edited ✅', 'success');
}

// ── REPLY ──
window.startReply = function(id, uname, content) {
  if (editingId) window.cancelEditMode();
  
  replyTo = { id, username: uname, content };
  document.getElementById('reply-banner').classList.add('show');
  document.getElementById('reply-banner-who').textContent = 'replying to ' + uname;
  document.getElementById('reply-banner-text').textContent = content;
  document.getElementById('msg-input').focus();
};

window.cancelReply = function() {
  replyTo = null;
  document.getElementById('reply-banner').classList.remove('show');
};

window.scrollToMsg = function(id) {
  const el = document.querySelector(`.msg-group[data-id="${id}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.style.background = 'rgba(74,158,255,0.06)';
  setTimeout(() => { el.style.background = ''; }, 1200);
};

// ── DELETE ──
window.deleteMsg = function(id) {
  if (!confirm('Delete this message? No undo.')) return;
  window.supabaseClient.from('messages')
    .delete()
    .eq('id', id)
    .eq('user_id', window.session.user.id)
    .then(({ error }) => {
      if (error) {
        window.showToast('Delete failed: ' + error.message, 'error');
        return;
      }
      document.querySelector(`.msg-group[data-id="${id}"]`)?.remove();
      window.showToast('Message deleted', 'success');
    });
};

// ── INPUT ──
const ta = document.getElementById('msg-input');
if (ta) {
  ta.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      window.sendMsg();
    }
    if (e.key === 'Escape' && editingId) {
      window.cancelEditMode();
    }
  });
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('emoji-picker')?.classList.remove('open');
    if (editingId) window.cancelEditMode();
    window.closeChatImageModal();
  }
});

// ── START ──
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
} else {
  setTimeout(init, 100);
}
</script>
