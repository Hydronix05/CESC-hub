<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />

<style>
/* ── PROFILES PAGE STYLES ── */

.profile-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:16px;
}
@media(max-width:768px){
  .profile-grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); }
}
@media(max-width:480px){
  .profile-grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
}

.profile-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 16px;
  cursor:pointer;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  animation:card-enter 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.profile-card::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,var(--neon),var(--neon2));
  opacity:0;
  transition:opacity 0.3s;
}
.profile-card:hover::before { opacity:1; }
.profile-card:hover {
  transform:translateY(-4px);
  border-color:rgba(74,158,255,0.25);
  box-shadow:0 12px 40px rgba(0,0,0,0.3);
}
@keyframes card-enter {
  from{opacity:0;transform:translateY(16px) scale(0.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.profile-avatar {
  width:72px;
  height:72px;
  border-radius:50%;
  margin:0 auto 10px;
  background:linear-gradient(135deg,var(--neon),var(--neon2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.6rem;
  font-weight:800;
  color:#000;
  overflow:hidden;
  position:relative;
  flex-shrink:0;
  transition:transform 0.3s;
}
.profile-card:hover .profile-avatar { transform:scale(1.06); }
.profile-avatar img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  border-radius:50%;
}
.profile-avatar img.loaded { display:block; }
.profile-avatar span { position:relative; z-index:1; }

.profile-name {
  font-weight:800;
  font-size:0.95rem;
  color:var(--text-bright);
  margin-bottom:2px;
}
.profile-username {
  font-size:0.72rem;
  font-family:'Space Mono',monospace;
  color:var(--muted);
}
.profile-bio {
  font-size:0.78rem;
  color:var(--text);
  margin-top:6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  line-height:1.4;
  min-height:36px;
}
.profile-role {
  font-size:0.58rem;
  font-family:'Space Mono',monospace;
  text-transform:uppercase;
  color:var(--neon);
  background:rgba(74,158,255,0.08);
  padding:2px 10px;
  border-radius:4px;
  display:inline-block;
  margin-top:6px;
  border:1px solid rgba(74,158,255,0.1);
}
.profile-online-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  margin-left:6px;
  animation:pulse-dot 2s infinite;
}
.profile-online-dot.online { background:var(--neon); box-shadow:0 0 8px rgba(74,158,255,0.4); }
.profile-online-dot.offline { background:var(--muted); animation:none; }
.profile-last-seen {
  font-size:0.6rem;
  font-family:'Space Mono',monospace;
  color:var(--muted);
  margin-top:4px;
}

.search-bar {
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.search-bar input {
  flex:1;
  padding:10px 16px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  outline:none;
  font-family:'Syne',sans-serif;
  font-size:0.9rem;
  transition:all 0.25s;
}
.search-bar input:focus {
  border-color:rgba(74,158,255,0.4);
  background:rgba(255,255,255,0.06);
}
.search-bar input::placeholder { color:var(--muted); }

.pagination {
  margin-top:24px;
  display:flex;
  justify-content:center;
  gap:12px;
  align-items:center;
}
.pagination button {
  padding:8px 20px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  font-family:'Syne',sans-serif;
  font-weight:600;
  font-size:0.85rem;
  transition:all 0.2s;
}
.pagination button:hover:not(:disabled) {
  border-color:rgba(74,158,255,0.4);
  color:var(--neon);
  background:rgba(74,158,255,0.05);
}
.pagination button:disabled {
  opacity:0.3;
  cursor:not-allowed;
}
.pagination span {
  font-size:0.85rem;
  color:var(--muted);
  font-family:'Space Mono',monospace;
  min-width:80px;
  text-align:center;
}

/* ── MODAL ── */
.modal-overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  backdrop-filter:blur(12px);
  animation:fade-in 0.3s ease;
}
.modal-overlay.show { display:flex; }
@keyframes fade-in {
  from{opacity:0}
  to{opacity:1}
}
.modal-card {
  width:360px;
  max-width:92vw;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px 28px 28px;
  animation:zoom-in 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  position:relative;
  text-align:center;
}
@keyframes zoom-in {
  from{transform:scale(0.85);opacity:0}
  to{transform:scale(1);opacity:1}
}
.modal-close {
  position:absolute;
  top:12px;
  right:16px;
  cursor:pointer;
  font-size:1.2rem;
  color:var(--muted);
  transition:color 0.2s;
  background:none;
  border:none;
}
.modal-close:hover { color:var(--text-bright); }
.modal-avatar {
  width:100px;
  height:100px;
  border-radius:50%;
  margin:0 auto 14px;
  background:linear-gradient(135deg,var(--neon),var(--neon2));
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.4rem;
  font-weight:800;
  color:#000;
  position:relative;
}
.modal-avatar img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  border-radius:50%;
}
.modal-avatar img.loaded { display:block; }
.modal-avatar span { position:relative; z-index:1; }
.modal-name {
  font-size:1.4rem;
  font-weight:800;
  color:var(--text-bright);
}
.modal-username {
  font-size:0.85rem;
  color:var(--muted);
  font-family:'Space Mono',monospace;
  margin:2px 0 8px;
}
.modal-bio {
  font-size:0.9rem;
  color:var(--text);
  line-height:1.6;
  margin-top:6px;
  padding:12px 16px;
  background:var(--surface);
  border-radius:10px;
  border:1px solid var(--border);
}
.modal-role {
  font-size:0.65rem;
  font-family:'Space Mono',monospace;
  text-transform:uppercase;
  color:var(--neon);
  background:rgba(74,158,255,0.08);
  padding:3px 14px;
  border-radius:4px;
  display:inline-block;
  margin-top:8px;
  border:1px solid rgba(74,158,255,0.1);
}
.modal-joined {
  font-size:0.7rem;
  color:var(--muted);
  font-family:'Space Mono',monospace;
  margin-top:10px;
}
.modal-last-seen {
  font-size:0.7rem;
  color:var(--muted);
  font-family:'Space Mono',monospace;
  margin-top:4px;
}

.empty-state {
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-family:'Space Mono',monospace;
  font-size:0.85rem;
}
.empty-state .big {
  font-size:3rem;
  margin-bottom:14px;
  animation:bounce 2s ease-in-out infinite;
  display:block;
}
.empty-state .big i { color:var(--muted); }
@keyframes bounce {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* ── SKELETON ── */
.skel-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 16px;
  text-align:center;
}
.skel-avatar {
  width:72px;
  height:72px;
  border-radius:50%;
  margin:0 auto 10px;
  background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,0.07) 50%,var(--surface) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}
.skel-line {
  height:12px;
  border-radius:6px;
  margin:6px auto;
  background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,0.07) 50%,var(--surface) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}
.skel-line.short { width:60%; }
.skel-line.medium { width:80%; }
.skel-line.long { width:90%; }
@keyframes shimmer {
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}
</style>
</head>

<script>
// ── PROFILES PAGE ──
// Use window.session, window.currentUser, window.supabaseClient from shared.js

let profilesCache = [];
let page = 0;
let search = '';
const limit = 20;
let searchTimeout = null;

// ── LAST SEEN FORMATTER ──
function formatLastSeen(lastSeen) {
  if (!lastSeen) return 'Never';
  
  const now = Date.now();
  const then = new Date(lastSeen).getTime();
  const diffMs = now - then;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHour = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHour / 24);
  const diffWeek = Math.floor(diffDay / 7);
  
  // Online (within 2 minutes)
  if (diffSec < 120) return 'Active now';
  
  // Within 5 minutes
  if (diffSec < 300) return 'Active a while ago';
  
  // Minutes
  if (diffMin < 60) return `Active ${diffMin}m ago`;
  
  // Hours (1-23)
  if (diffHour < 24) {
    if (diffHour === 1) return 'Active 1h ago';
    return `Active ${diffHour}h ago`;
  }
  
  // Days (1-6)
  if (diffDay < 7) {
    if (diffDay === 1) return 'Active 1 day ago';
    return `Active ${diffDay} days ago`;
  }
  
  // Weeks
  if (diffWeek < 4) {
    if (diffWeek === 1) return 'Active 1 week ago';
    return `Active ${diffWeek} weeks ago`;
  }
  
  // Months - just show the date
  const date = new Date(lastSeen);
  return `Last seen ${date.toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' })}`;
}

// ── DEBOUNCE SEARCH ──
window.debounceSearch = function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    search = document.getElementById('search-input').value.trim();
    page = 0;
    loadProfiles();
  }, 300);
};

// ── PAGINATION ──
window.nextPage = function() {
  const total = profilesCache.length;
  if ((page + 1) * limit < total) {
    page++;
    loadProfiles();
  }
};

window.prevPage = function() {
  if (page > 0) {
    page--;
    loadProfiles();
  }
};

// ── LOAD PROFILES ──
async function loadProfiles() {
  const grid = document.getElementById('profile-grid');
  const countEl = document.getElementById('profile-count');

  // Show skeletons
  grid.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const skel = document.createElement('div');
    skel.className = 'skel-card';
    skel.innerHTML = `
      <div class="skel-avatar"></div>
      <div class="skel-line medium"></div>
      <div class="skel-line short"></div>
      <div class="skel-line long" style="height:8px;margin-top:6px;"></div>
    `;
    grid.appendChild(skel);
  }

  try {
    let query = window.supabaseClient
      .from('profiles')
      .select('username, display_name, bio, pfp_url, role, created_at, last_seen')
      .order('created_at', { ascending: false });

    if (search) {
      query = query.ilike('username', `%${search}%`);
    }

    const { data, error } = await query;

    if (error) {
      console.error('Error loading profiles:', error);
      grid.innerHTML = '<div class="empty-state"><span class="big"><i class="fas fa-exclamation-triangle"></i></span><div>Failed to load profiles</div></div>';
      return;
    }

    profilesCache = data || [];
    countEl.textContent = `${profilesCache.length} members`;

    const start = page * limit;
    const end = start + limit;
    const pageData = profilesCache.slice(start, end);

    grid.innerHTML = '';

    if (pageData.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <span class="big"><i class="fas fa-users-slash"></i></span>
          <div>No profiles found${search ? ` for "${search}"` : ''}</div>
        </div>
      `;
      document.getElementById('page-info').textContent = `Page ${page + 1}`;
      document.getElementById('prev-btn').disabled = page === 0;
      document.getElementById('next-btn').disabled = true;
      return;
    }

    // Check online status for each profile
    const cutoff = new Date(Date.now() - 2 * 60 * 1000).toISOString();

    pageData.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'profile-card';
      card.style.animationDelay = (i * 0.04) + 's';
      card.onclick = () => openModal(p);

      const displayName = p.display_name || p.username;
      const isOnline = p.last_seen && p.last_seen > cutoff;

      // Avatar
      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'profile-avatar';
      const initial = document.createElement('span');
      initial.textContent = (p.username?.[0] || '?').toUpperCase();
      avatarDiv.appendChild(initial);

      if (p.pfp_url || window.pfpCache?.[p.username]) {
        const img = document.createElement('img');
        img.src = p.pfp_url || window.pfpCache?.[p.username];
        img.onload = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
        img.onerror = () => img.remove();
        avatarDiv.appendChild(img);
      }
      card.appendChild(avatarDiv);

      const nameDiv = document.createElement('div');
      nameDiv.className = 'profile-name';
      nameDiv.textContent = displayName;
      card.appendChild(nameDiv);

      const usernameDiv = document.createElement('div');
      usernameDiv.className = 'profile-username';
      usernameDiv.innerHTML = `@${p.username} <span class="profile-online-dot ${isOnline ? 'online' : 'offline'}"></span>`;
      card.appendChild(usernameDiv);

      // Last seen
      const lastSeenDiv = document.createElement('div');
      lastSeenDiv.className = 'profile-last-seen';
      if (isOnline) {
        lastSeenDiv.textContent = '● Online';
        lastSeenDiv.style.color = 'var(--neon)';
      } else {
        lastSeenDiv.textContent = formatLastSeen(p.last_seen);
        lastSeenDiv.style.color = 'var(--muted)';
      }
      card.appendChild(lastSeenDiv);

      if (p.bio) {
        const bioDiv = document.createElement('div');
        bioDiv.className = 'profile-bio';
        bioDiv.textContent = p.bio.length > 90 ? p.bio.slice(0, 90) + '...' : p.bio;
        card.appendChild(bioDiv);
      }

      if (p.role && p.role !== 'user') {
        const roleDiv = document.createElement('div');
        roleDiv.className = 'profile-role';
        roleDiv.textContent = p.role;
        card.appendChild(roleDiv);
      }

      grid.appendChild(card);
    });

    document.getElementById('page-info').textContent = `Page ${page + 1}`;
    document.getElementById('prev-btn').disabled = page === 0;
    document.getElementById('next-btn').disabled = (page + 1) * limit >= profilesCache.length;
  } catch (e) {
    console.error('Error loading profiles:', e);
    grid.innerHTML = '<div class="empty-state"><span class="big"><i class="fas fa-exclamation-triangle"></i></span><div>Error loading profiles</div></div>';
  }
}

// ── MODAL ──
window.openModal = function(p) {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('show');

  const avatar = document.getElementById('modal-avatar');
  const initial = avatar.querySelector('span') || document.createElement('span');
  if (!avatar.querySelector('span')) {
    initial.textContent = (p.username?.[0] || '?').toUpperCase();
    avatar.appendChild(initial);
  } else {
    initial.textContent = (p.username?.[0] || '?').toUpperCase();
  }

  // Remove old image
  const oldImg = avatar.querySelector('img');
  if (oldImg) oldImg.remove();

  if (p.pfp_url || window.pfpCache?.[p.username]) {
    const img = document.createElement('img');
    img.src = p.pfp_url || window.pfpCache?.[p.username];
    img.onload = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
    img.onerror = () => img.remove();
    avatar.appendChild(img);
  }

  const displayName = p.display_name || p.username;
  document.getElementById('modal-name').textContent = displayName;
  document.getElementById('modal-username').textContent = '@' + p.username;
  document.getElementById('modal-bio').textContent = p.bio || 'No bio yet';

  const roleEl = document.getElementById('modal-role');
  if (p.role && p.role !== 'user') {
    roleEl.textContent = p.role;
    roleEl.style.display = 'inline-block';
  } else {
    roleEl.style.display = 'none';
  }

  const joinedEl = document.getElementById('modal-joined');
  if (p.created_at) {
    const date = new Date(p.created_at);
    joinedEl.textContent = `Joined ${date.toLocaleDateString([], { month:'long', day:'numeric', year:'numeric' })}`;
  } else {
    joinedEl.textContent = '';
  }

  // Last seen in modal
  const lastSeenEl = document.getElementById('modal-last-seen');
  const cutoff = new Date(Date.now() - 2 * 60 * 1000).toISOString();
  const isOnline = p.last_seen && p.last_seen > cutoff;
  if (isOnline) {
    lastSeenEl.textContent = '🟢 Online now';
    lastSeenEl.style.color = 'var(--neon)';
  } else {
    lastSeenEl.textContent = formatLastSeen(p.last_seen);
    lastSeenEl.style.color = 'var(--muted)';
  }
};

window.closeModal = function(e) {
  if (!e || e.target.id === 'modal-overlay' || e.target.className === 'modal-close' || e.target.closest('.modal-close')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('show');
});

// ── INIT ──
async function init() {
  if (typeof window.initTheme !== 'function') {
    console.log('⏳ Waiting for shared.js...');
    setTimeout(init, 200);
    return;
  }

  console.log('✅ shared.js loaded');
  window.initTheme();

  const sidebarOpen = localStorage.getItem('cesc_sidebar_open') === 'true';
  if (sidebarOpen && window.innerWidth <= 768) {
    document.getElementById('sidebar')?.classList.add('open');
    document.getElementById('sidebar-overlay')?.classList.add('show');
  }

  const sess = await window.initAuth();
  if (!sess) return;

  console.log('✅ Session loaded:', sess.user.email);

  const profile = await window.loadUserProfile();
  if (profile) {
    window.updateUserUI(profile);
    await window.loadPfpCache();
  }

  await window.updateLastSeen();

  await Promise.all([
    loadProfiles(),
    window.loadOnlineCount(),
    window.loadNotifCount()
  ]);

  setInterval(async () => {
    if (!window.session) return;
    await window.updateLastSeen();
    await Promise.all([window.loadOnlineCount(), window.loadNotifCount()]);
  }, 15000);
}

// ── START ──
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
} else {
  setTimeout(init, 100);
}
</script>
