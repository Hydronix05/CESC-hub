    </a>
    <a href="chat.html" class="downbar-more-item">
      <span class="downbar-more-icon"><i class="fas fa-comments"></i></span>
      <span class="downbar-more-label">Chat</span>
    </a>

      <span class="downbar-more-icon"><i class="fas fa-users"></i></span>
      <span class="downbar-more-label">Profiles</span>

    <button class="downbar-more-item logout" onclick="window.logout()">
      <span class="downbar-more-icon"><i class="fas fa-sign-out-alt"></i></span>

    </button>
  </div>

<script>
// ── PROFILES PAGE ──
// Use window.session, window.currentUser, window.supabaseClient from shared.js

let profilesCache = [];
let page = 0;
let search = '';
const limit = 20;
let searchTimeout = null;

// ── LAST SEEN FORMATTER ──
function formatLastSeen(lastSeen) {
  if (!lastSeen) return 'Never';
  
  const now = Date.now();
  const then = new Date(lastSeen).getTime();
  const diffMs = now - then;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHour = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHour / 24);
  const diffWeek = Math.floor(diffDay / 7);
  
  // Online (within 2 minutes)
  if (diffSec < 120) return 'Active now';
  
  // Within 5 minutes
  if (diffSec < 300) return 'Active a while ago';
  
  // Minutes
  if (diffMin < 60) return `Active ${diffMin}m ago`;
  
  // Hours (1-23)
  if (diffHour < 24) {
    if (diffHour === 1) return 'Active 1h ago';
    return `Active ${diffHour}h ago`;
  }
  
  // Days (1-6)
  if (diffDay < 7) {
    if (diffDay === 1) return 'Active 1 day ago';
    return `Active ${diffDay} days ago`;
  }
  
  // Weeks
  if (diffWeek < 4) {
    if (diffWeek === 1) return 'Active 1 week ago';
    return `Active ${diffWeek} weeks ago`;
  }
  
  // Months - just show the date
  const date = new Date(lastSeen);
  return `Last seen ${date.toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' })}`;
}

// ── DEBOUNCE SEARCH ──
window.debounceSearch = function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    search = document.getElementById('search-input').value.trim();
    page = 0;
    loadProfiles();
  }, 300);
};

// ── PAGINATION ──
window.nextPage = function() {
  const total = profilesCache.length;
  if ((page + 1) * limit < total) {
    page++;
    loadProfiles();
  }
};

window.prevPage = function() {
  if (page > 0) {
    page--;
    loadProfiles();
  }
};

// ── LOAD PROFILES ──
async function loadProfiles() {
  const grid = document.getElementById('profile-grid');
  const countEl = document.getElementById('profile-count');

  // Show skeletons
  grid.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const skel = document.createElement('div');
    skel.className = 'skel-card';
    skel.innerHTML = `
      <div class="skel-avatar"></div>
      <div class="skel-line medium"></div>
      <div class="skel-line short"></div>
      <div class="skel-line long" style="height:8px;margin-top:6px;"></div>
    `;
    grid.appendChild(skel);
  }

  try {
    let query = window.supabaseClient
      .from('profiles')
      .select('username, display_name, bio, pfp_url, role, created_at, last_seen')
      .order('created_at', { ascending: false });

    if (search) {
      query = query.ilike('username', `%${search}%`);
    }

    const { data, error } = await query;

    if (error) {
      console.error('Error loading profiles:', error);
      grid.innerHTML = '<div class="empty-state"><span class="big"><i class="fas fa-exclamation-triangle"></i></span><div>Failed to load profiles</div></div>';
      return;
    }

    profilesCache = data || [];
    countEl.textContent = `${profilesCache.length} members`;

    const start = page * limit;
    const end = start + limit;
    const pageData = profilesCache.slice(start, end);

    grid.innerHTML = '';

    if (pageData.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <span class="big"><i class="fas fa-users-slash"></i></span>
          <div>No profiles found${search ? ` for "${search}"` : ''}</div>
        </div>
      `;
      document.getElementById('page-info').textContent = `Page ${page + 1}`;
      document.getElementById('prev-btn').disabled = page === 0;
      document.getElementById('next-btn').disabled = true;
      return;
    }

    // Check online status for each profile
    const cutoff = new Date(Date.now() - 2 * 60 * 1000).toISOString();

    pageData.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'profile-card';
      card.style.animationDelay = (i * 0.04) + 's';
      card.onclick = () => openModal(p);

      const displayName = p.display_name || p.username;
      const isOnline = p.last_seen && p.last_seen > cutoff;

      // Avatar
      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'profile-avatar';
      const initial = document.createElement('span');
      initial.textContent = (p.username?.[0] || '?').toUpperCase();
      avatarDiv.appendChild(initial);

      if (p.pfp_url || window.pfpCache?.[p.username]) {
        const img = document.createElement('img');
        img.src = p.pfp_url || window.pfpCache?.[p.username];
        img.onload = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
        img.onerror = () => img.remove();
        avatarDiv.appendChild(img);
      }
      card.appendChild(avatarDiv);

      const nameDiv = document.createElement('div');
      nameDiv.className = 'profile-name';
      nameDiv.textContent = displayName;
      card.appendChild(nameDiv);

      const usernameDiv = document.createElement('div');
      usernameDiv.className = 'profile-username';
      usernameDiv.innerHTML = `@${p.username} <span class="profile-online-dot ${isOnline ? 'online' : 'offline'}"></span>`;
      card.appendChild(usernameDiv);

      // Last seen
      const lastSeenDiv = document.createElement('div');
      lastSeenDiv.className = 'profile-last-seen';
      if (isOnline) {
        lastSeenDiv.textContent = '● Online';
        lastSeenDiv.style.color = 'var(--neon)';
      } else {
        lastSeenDiv.textContent = formatLastSeen(p.last_seen);
        lastSeenDiv.style.color = 'var(--muted)';
      }
      card.appendChild(lastSeenDiv);

      if (p.bio) {
        const bioDiv = document.createElement('div');
        bioDiv.className = 'profile-bio';
        bioDiv.textContent = p.bio.length > 90 ? p.bio.slice(0, 90) + '...' : p.bio;
        card.appendChild(bioDiv);
      }

      if (p.role && p.role !== 'user') {
        const roleDiv = document.createElement('div');
        roleDiv.className = 'profile-role';
        roleDiv.textContent = p.role;
        card.appendChild(roleDiv);
      }

      grid.appendChild(card);
    });

    document.getElementById('page-info').textContent = `Page ${page + 1}`;
    document.getElementById('prev-btn').disabled = page === 0;
    document.getElementById('next-btn').disabled = (page + 1) * limit >= profilesCache.length;
  } catch (e) {
    console.error('Error loading profiles:', e);
    grid.innerHTML = '<div class="empty-state"><span class="big"><i class="fas fa-exclamation-triangle"></i></span><div>Error loading profiles</div></div>';
  }
}

// ── MODAL ──
window.openModal = function(p) {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('show');

  const avatar = document.getElementById('modal-avatar');
  const initial = avatar.querySelector('span') || document.createElement('span');
  if (!avatar.querySelector('span')) {
    initial.textContent = (p.username?.[0] || '?').toUpperCase();
    avatar.appendChild(initial);
  } else {
    initial.textContent = (p.username?.[0] || '?').toUpperCase();
  }

  // Remove old image
  const oldImg = avatar.querySelector('img');
  if (oldImg) oldImg.remove();

  if (p.pfp_url || window.pfpCache?.[p.username]) {
    const img = document.createElement('img');
    img.src = p.pfp_url || window.pfpCache?.[p.username];
    img.onload = () => { img.classList.add('loaded'); initial.style.display = 'none'; };
    img.onerror = () => img.remove();
    avatar.appendChild(img);
  }

  const displayName = p.display_name || p.username;
  document.getElementById('modal-name').textContent = displayName;
  document.getElementById('modal-username').textContent = '@' + p.username;
  document.getElementById('modal-bio').textContent = p.bio || 'No bio yet';

  const roleEl = document.getElementById('modal-role');
  if (p.role && p.role !== 'user') {
    roleEl.textContent = p.role;
    roleEl.style.display = 'inline-block';
  } else {
    roleEl.style.display = 'none';
  }

  const joinedEl = document.getElementById('modal-joined');
  if (p.created_at) {
    const date = new Date(p.created_at);
    joinedEl.textContent = `Joined ${date.toLocaleDateString([], { month:'long', day:'numeric', year:'numeric' })}`;
  } else {
    joinedEl.textContent = '';
  }

  // Last seen in modal
  const lastSeenEl = document.getElementById('modal-last-seen');
  const cutoff = new Date(Date.now() - 2 * 60 * 1000).toISOString();
  const isOnline = p.last_seen && p.last_seen > cutoff;
  if (isOnline) {
    lastSeenEl.textContent = '🟢 Online now';
    lastSeenEl.style.color = 'var(--neon)';
  } else {
    lastSeenEl.textContent = formatLastSeen(p.last_seen);
    lastSeenEl.style.color = 'var(--muted)';
  }
};

window.closeModal = function(e) {
  if (!e || e.target.id === 'modal-overlay' || e.target.className === 'modal-close' || e.target.closest('.modal-close')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('show');
});

// ── INIT ──
async function init() {
  if (typeof window.initTheme !== 'function') {
    console.log('⏳ Waiting for shared.js...');
    setTimeout(init, 200);
    return;
  }

  console.log('✅ shared.js loaded');
  window.initTheme();

  const sess = await window.initAuth();
  if (!sess) return;

  console.log('✅ Session loaded:', sess.user.email);

  const profile = await window.loadUserProfile();
  if (profile) {
    window.updateUserUI(profile);
    await window.loadPfpCache();
  }

  await window.updateLastSeen();

  await Promise.all([
    loadProfiles(),
    window.loadOnlineCount(),
    window.loadNotifCount()
  ]);

  setInterval(async () => {
    if (!window.session) return;
    await window.updateLastSeen();
    await Promise.all([window.loadOnlineCount(), window.loadNotifCount()]);
  }, 15000);
}

// ── START ──
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
} else {
  setTimeout(init, 100);
}
</script>
