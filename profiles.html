<script>
// ═══════════════════════════════════════════════════════════
// ── PROFILES PAGE LOGIC ──
// Two views in one page:
//   - Browse view (/profiles) — grid of all members
//   - Profile view (/profiles?u=username) — Instagram-style
// ═══════════════════════════════════════════════════════════

const VIEW_KEY = 'cesc_profiles_view';
const DISPLAYABLE_ROLES = ['teacher', 'og', 'vip'];
const ELEVATED_ROLES = ['owner', 'admin', 'moderator', 'teacher', 'vip', 'advertiser'];
const ROLE_COLORS = {
  advertiser: 'var(--purple)',
  teacher: '#7dd3fc',
  og: '#fbbf24',
  vip: '#f472b6'
};

// ═══════════════════════════════════════════════════════════
// ── RICH TEXT PARSER (mirrors index.html) ──
// ═══════════════════════════════════════════════════════════
function sanitizeUrl(url) {
  if (!url) return null;
  let u = String(url).trim();
  if (/^(javascript|data|vbscript):/i.test(u)) return null;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try {
    const parsed = new URL(u);
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
    return parsed.href;
  } catch { return null; }
}

function parseContent(text) {
  if (!text) return '';
  let s = window.escapeHTML(text);

  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, url) => {
    const safe = sanitizeUrl(url);
    if (!safe) return match;
    return `<a href="${window.escapeHTML(safe)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });

  s = s.replace(/~~([^~]+)~~/g, '<s>$1</s>');
  s = s.replace(/__([^_]+)__/g, '<u>$1</u>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/###([^#\n]+)###/g, '<span class="sz-huge">$1</span>');
  s = s.replace(/##([^#\n]+)##/g, '<span class="sz-large">$1</span>');
  s = s.replace(/#([^#\n]+)#/g, '<span class="sz-small">$1</span>');
  s = s.replace(/\n/g, '<br>');

  return s;
}

let allProfiles = [];
let viewMode = 'cards';
let searchTimeout = null;
let searchQuery = '';
let currentAd = null;

// Profile view state
let profileUserId = null;
let profileData = null;
let profileIsFollowing = false;
let profileIsPending = false;
let profileIsFriends = false;
let profileIsPrivate = false;
let profileCanViewPrivate = false;

// ── LOADING STEPS ──
function definePageSteps() {
  defineLoadingSteps([
    { id: 'theme', label: 'Loading theme...', technical: 'Applying saved theme preferences' },
    { id: 'auth', label: 'Connecting to Supabase...', technical: 'Checking authentication' },
    { id: 'profile', label: 'Loading your profile...', technical: 'Fetching user data' },
    { id: 'pfp', label: 'Loading profile pictures...', technical: 'Caching avatars' },
    { id: 'members', label: 'Loading members...', technical: 'Fetching all profiles' },
    { id: 'online', label: 'Loading online users...', technical: 'Counting active users' },
    { id: 'notifs', label: 'Loading notifications...', technical: 'Checking unread count' },
    { id: 'ready', label: 'Done! ✨', technical: 'Profiles ready' }
  ]);
}

// ── HELPERS ──
function formatLastSeen(lastSeen) {
  if (!lastSeen) return 'Never';
  const diffSec = Math.floor((Date.now() - new Date(lastSeen).getTime()) / 1000);
  if (diffSec < 120) return 'Active now';
  if (diffSec < 300) return 'Active a while ago';
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `Active ${diffMin}m ago`;
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return diffHour === 1 ? 'Active 1h ago' : `Active ${diffHour}h ago`;
  const diffDay = Math.floor(diffHour / 24);
  if (diffDay < 7) return diffDay === 1 ? 'Active 1 day ago' : `Active ${diffDay} days ago`;
  const diffWeek = Math.floor(diffDay / 7);
  if (diffWeek < 4) return diffWeek === 1 ? 'Active 1 week ago' : `Active ${diffWeek} weeks ago`;
  return `Last seen ${new Date(lastSeen).toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' })}`;
}

function isOnline(lastSeen) {
  if (!lastSeen) return false;
  return new Date(lastSeen).getTime() > Date.now() - 2 * 60 * 1000;
}

function getDisplayableRoles(profile) {
  const raw = Array.isArray(profile.roles) && profile.roles.length
    ? profile.roles
    : (profile.role ? [profile.role] : []);
  return raw.filter(r => DISPLAYABLE_ROLES.includes(r));
}

function roleBadgeHTML(role) {
  const color = ROLE_COLORS[role] || 'var(--neon)';
  return `<span class="role-badge" style="color:${color};border-color:${color}40;background:${color}14;">
    <span class="role-dot" style="background:${color};"></span>${role}
  </span>`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════════════════════════════════════════════════════════
// ── ROUTING: ?u=username in URL ──
// ═══════════════════════════════════════════════════════════
function getProfileFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('u');
}

function pushProfileUrl(username) {
  const newPath = username ? `/profiles?u=${encodeURIComponent(username)}` : '/profiles';
  const current = window.location.pathname + window.location.search;
  if (current !== newPath) {
    history.pushState({ u: username }, '', newPath);
  }
}

window.addEventListener('popstate', () => {
  const u = getProfileFromUrl();
  if (u) {
    showProfileView(u);
  } else {
    showBrowseView();
  }
});

// ═══════════════════════════════════════════════════════════
// ── VIEW SWITCHING ──
// ═══════════════════════════════════════════════════════════
function showBrowseView() {
  document.getElementById('view-browse').style.display = '';
  document.getElementById('view-profile').style.display = 'none';
  document.body.dataset.pageTitle = 'Profiles';
  document.title = 'CESC Hub — Profiles';
}

function showProfileView(username) {
  document.getElementById('view-browse').style.display = 'none';
  document.getElementById('view-profile').style.display = '';
  loadProfilePage(username);
}

window.backToBrowse = function() {
  pushProfileUrl(null);
  showBrowseView();
  renderProfiles();
};

// ═══════════════════════════════════════════════════════════
// ── BROWSE VIEW ──
// ═══════════════════════════════════════════════════════════
function loadViewMode() {
  const saved = localStorage.getItem(VIEW_KEY);
  viewMode = saved === 'rows' ? 'rows' : 'cards';
  applyViewMode();
}

function applyViewMode() {
  const grid = document.getElementById('profile-grid');
  const rows = document.getElementById('profile-rows');
  const label = document.getElementById('view-toggle-label');
  const icon = document.getElementById('view-toggle-icon');
  if (!grid || !rows) return;
  if (viewMode === 'cards') {
    grid.style.display = '';
    rows.style.display = 'none';
    if (label) label.textContent = 'Rows';
    if (icon) icon.className = 'fas fa-list';
  } else {
    grid.style.display = 'none';
    rows.style.display = 'block';
    if (label) label.textContent = 'Cards';
    if (icon) icon.className = 'fas fa-table-cells-large';
  }
}

window.toggleViewMode = function() {
  viewMode = viewMode === 'cards' ? 'rows' : 'cards';
  localStorage.setItem(VIEW_KEY, viewMode);
  applyViewMode();
  renderProfiles();
};

window.debounceSearch = function() {
  const input = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = input.value ? 'flex' : 'none';

  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = input.value.trim().toLowerCase();
    renderProfiles();
  }, 300);
};

window.clearSearch = function() {
  document.getElementById('search-input').value = '';
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = 'none';
  searchQuery = '';
  renderProfiles();
};

function getFilteredList() {
  if (!searchQuery) return allProfiles;
  return allProfiles.filter(p => {
    const u = (p.username || '').toLowerCase();
    const d = (p.display_name || '').toLowerCase();
    return u.includes(searchQuery) || d.includes(searchQuery);
  });
}

function getColumnCount() {
  const grid = document.getElementById('profile-grid');
  if (!grid) return 4;
  const style = window.getComputedStyle(grid);
  const cols = style.gridTemplateColumns.split(' ').filter(Boolean).length;
  return Math.max(1, cols);
}

function renderProfiles() {
  const list = getFilteredList();
  if (viewMode === 'cards') {
    renderCards(list);
  } else {
    renderRows(list);
  }
}

function renderCards(list) {
  const grid = document.getElementById('profile-grid');
  if (!grid) return;
  grid.innerHTML = '';

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <span class="big"><i class="fas fa-users-slash"></i></span>
        <div>No profiles found${searchQuery ? ` for "${searchQuery}"` : ''}</div>
      </div>
    `;
    return;
  }

  const cols = getColumnCount();
  const TARGET_CARDS = 20;
  const targetRows = cols === 3 ? 7 : Math.round(TARGET_CARDS / cols);
  const targetSlots = cols * targetRows;

  const hasAd = !!currentAd;
  const profileLimit = targetSlots - (hasAd ? 1 : 0);

  const visible = list.slice(0, profileLimit);
  const children = [];

  const adSlot = hasAd ? Math.floor(Math.random() * targetSlots) : -1;

  for (let i = 0; i < visible.length; i++) {
    const insertBefore = hasAd && i === adSlot;
    if (insertBefore) children.push({ type: 'ad' });
    children.push({ type: 'profile', data: visible[i] });
  }
  if (hasAd && !children.some(c => c.type === 'ad')) {
    children.push({ type: 'ad' });
  }

  children.forEach(child => {
    if (child.type === 'ad') {
      grid.appendChild(buildAdCard(currentAd));
    } else {
      grid.appendChild(buildProfileCard(child.data));
    }
  });

  const spacersNeeded = targetSlots - children.length;
  for (let i = 0; i < spacersNeeded; i++) {
    const spacer = document.createElement('div');
    spacer.className = 'profile-card profile-card-spacer';
    spacer.setAttribute('aria-hidden', 'true');
    grid.appendChild(spacer);
  }

  const countEl = document.getElementById('profile-count');
  const shown = visible.length;
  const total = list.length;
  if (countEl) {
    if (searchQuery) {
      countEl.textContent = `${shown} of ${total} match "${searchQuery}"`;
    } else {
      countEl.textContent = `${shown} member${shown === 1 ? '' : 's'} shown`;
    }
  }
}

function buildProfileCard(p) {
  const card = document.createElement('div');
  card.className = 'profile-card';
  card.onclick = () => {
    pushProfileUrl(p.username);
    showProfileView(p.username);
  };

  const displayName = p.display_name || p.username;
  const initial = (p.username?.[0] || '?').toUpperCase();
  const online = isOnline(p.last_seen);
  const roles = getDisplayableRoles(p);
  const pfpUrl = p.pfp_url || (window.pfpCache && window.pfpCache[p.username]) || null;
  const verifiedHTML = p.verified
    ? '<i class="fas fa-circle-check profile-card-verified" title="Verified"></i>'
    : '';
  const privateHTML = p.is_private
    ? '<i class="fas fa-lock profile-card-lock" title="Private account"></i>'
    : '';

  card.innerHTML = `
    <div class="profile-avatar-wrap">
      <div class="profile-avatar">
        <span>${initial}</span>
        ${pfpUrl ? `<img src="${window.escapeHTML(pfpUrl)}" alt="${window.escapeHTML(p.username)}" onload="this.classList.add('loaded');this.previousElementSibling.style.display='none'" onerror="this.remove()"/>` : ''}
      </div>
      <span class="profile-status-dot ${online ? 'online' : 'offline'}"></span>
    </div>
    <div class="profile-name">${window.escapeHTML(displayName)} ${verifiedHTML}${privateHTML}</div>
    <div class="profile-username">@${window.escapeHTML(p.username)}</div>
    ${roles.length ? `<div class="profile-roles">${roles.map(roleBadgeHTML).join('')}</div>` : ''}
    <div class="profile-last-seen ${online ? 'is-online' : ''}">
      ${online ? '● Online now' : formatLastSeen(p.last_seen)}
    </div>
    ${p.bio ? `<div class="profile-bio">${window.escapeHTML(p.bio.length > 90 ? p.bio.slice(0, 90) + '…' : p.bio)}</div>` : ''}
  `;

  return card;
}

function buildAdCard(ad) {
  const card = document.createElement('div');
  card.className = 'profile-card profile-ad-card';
  card.style.cursor = 'pointer';

  const displayName = ad.advertiser_display_name || ad.advertiser_username || 'Sponsored';
  const wide = ad.image_wide_url || ad.image_square_url || '';

  card.innerHTML = `
    <div class="ad-card-badge">Ad</div>

function renderRows(list) {
  const container = document.getElementById('profile-rows-list');
  if (!container) return;
  container.innerHTML = '';

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding:60px 20px;">
        <span class="big"><i class="fas fa-users-slash"></i></span>
        <div>No profiles found${searchQuery ? ` for "${searchQuery}"` : ''}</div>
      </div>
    `;
    return;
  }

  const hasAd = !!currentAd;
  const limit = hasAd ? 19 : 20;
  const visible = list.slice(0, limit);
  const adSlot = hasAd ? Math.floor(Math.random() * (visible.length + 1)) : -1;

  const frag = document.createDocumentFragment();

  visible.forEach((p, i) => {
    if (hasAd && i === adSlot) {
      frag.appendChild(buildAdRow(currentAd));
    }
    frag.appendChild(buildProfileRow(p));
  });
  if (hasAd && adSlot >= visible.length) {
    frag.appendChild(buildAdRow(currentAd));
  }

  container.appendChild(frag);

  const countEl = document.getElementById('profile-count');
  const shown = visible.length;
  const total = list.length;
  if (countEl) {
    if (searchQuery) {
      countEl.textContent = `${shown} of ${total} match "${searchQuery}"`;
    } else {
      countEl.textContent = `${shown} member${shown === 1 ? '' : 's'} shown`;
    }
  }
}

function isAliveProfile(p) {
  if (p.pfp_url && String(p.pfp_url).trim() !== '') return true;
  if (p.last_seen) return true;
  const raw = Array.isArray(p.roles) && p.roles.length
    ? p.roles
    : (p.role ? [p.role] : []);
  if (raw.some(r => ELEVATED_ROLES.includes(r))) return true;
  return false;
}

async function loadProfiles() {
  try {
    const { data, error } = await window.supabaseClient
      .from('profiles')
      .select('id, username, display_name, bio, pfp_url, role, roles, created_at, last_seen, is_private, verified, follower_count, following_count')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Error loading profiles:', error);
      const countEl = document.getElementById('profile-count');
      if (countEl) countEl.textContent = 'Failed to load';
      const grid = document.getElementById('profile-grid');
      if (grid) grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <span class="big"><i class="fas fa-exclamation-triangle"></i></span>
          <div>Failed to load profiles</div>
        </div>
      `;
      return;
    }

    const alive = (data || []).filter(isAliveProfile);
    allProfiles = shuffle(alive);

    pickAd();
    renderProfiles();
  } catch (e) {
    console.error('loadProfiles exception:', e);
  }
}

function pickAd() {
  currentAd = null;
  if (!window.Ads || typeof window.Ads.getCached !== 'function') return;
  const cached = window.Ads.getCached() || [];
  if (cached.length === 0) return;

  const pool = cached.filter(a => {
    const p = a.placements || [];
    return Array.isArray(p) && p.includes('profiles');
  });
  if (pool.length === 0) return;

  const total = pool.reduce((s, a) => s + (a.weight || 1), 0);
  let r = Math.random() * total;
  for (const ad of pool) {
    r -= (ad.weight || 1);
    if (r <= 0) { currentAd = ad; return; }
  }
  currentAd = pool[pool.length - 1];
}

async function loadProfilePage(username) {
  document.getElementById('profile-loading').style.display = 'flex';
  document.getElementById('profile-content').style.display = 'none';

  try {
    // 1. Fetch profile row
    const { data: p, error } = await window.supabaseClient
      .from('profiles')
      .select('id, username, display_name, bio, pfp_url, roles, is_private, verified, banner_url, links, pinned_post_id, location, follower_count, following_count, created_at, last_seen, streak')
      .eq('username', username)
      .maybeSingle();

    if (error || !p) {
      console.error('loadProfilePage:', error);
      document.getElementById('profile-loading').innerHTML = `
        <i class="fas fa-user-slash" style="font-size:2rem;color:var(--muted);margin-bottom:12px;"></i>
        <div>Profile not found</div>
      `;
      return;
    }

    profileData = p;
    profileUserId = p.id;
    profileIsPrivate = !!p.is_private;

    const isSelf = window.session && window.session.user.id === p.id;

    // 2. Fetch follow relationship (if not self)
    profileIsFollowing = false;
    profileIsPending = false;
    profileIsFriends = false;

    if (!isSelf && window.session) {
      const { data: myFollow } = await window.supabaseClient
        .from('follows')
        .select('status')
        .eq('follower_id', window.session.user.id)
        .eq('following_id', p.id)
        .maybeSingle();

      if (myFollow) {
        if (myFollow.status === 'active') profileIsFollowing = true;
        if (myFollow.status === 'pending') profileIsPending = true;
      }

      // Check mutual (friends)
      if (profileIsFollowing) {
        const { data: theirFollow } = await window.supabaseClient
          .from('follows')
          .select('status')
          .eq('follower_id', p.id)
          .eq('following_id', window.session.user.id)
          .eq('status', 'active')
          .maybeSingle();
        if (theirFollow) profileIsFriends = true;
      }
    }

    // 3. Can we view posts?
    profileCanViewPrivate = !profileIsPrivate || isSelf || profileIsFollowing;

    // 4. Fetch posts (only if we can view)
    let posts = [];
    let pinnedPost = null;

    if (profileCanViewPrivate) {
      const { data: postsData } = await window.supabaseClient
        .from('posts')
        .select('id, content, image_url, created_at, likes')
        .eq('user_id', p.id)
        .order('created_at', { ascending: false })
        .limit(60);
      posts = postsData || [];

      if (p.pinned_post_id) {
        pinnedPost = posts.find(post => post.id === p.pinned_post_id) || null;
      }
    }

    // 5. Fetch CEIN balance (only for self or public — the RPC only returns own)
    let ceinBalance = null;
    if (isSelf) {
      const { data: credits } = await window.supabaseClient.rpc('get_my_credits');
      if (credits && credits.ok) ceinBalance = credits.balance;
    }

    // 6. Render everything
    renderProfilePage(p, { isSelf, posts, pinnedPost, ceinBalance });

    document.getElementById('profile-loading').style.display = 'none';
    document.getElementById('profile-content').style.display = 'block';

    // 7. Update tab title + page title
    document.title = (p.display_name || p.username) + ' · CESC Hub';
    document.body.dataset.pageTitle = p.display_name || p.username;
  } catch (e) {
    console.error('loadProfilePage exception:', e);
    document.getElementById('profile-loading').innerHTML = `
      <i class="fas fa-triangle-exclamation" style="font-size:2rem;color:var(--danger);margin-bottom:12px;"></i>
      <div>Something went wrong</div>
    `;
  }
}

function renderProfilePage(p, ctx) {
  const { isSelf, posts, pinnedPost, ceinBalance } = ctx;

  // ── Banner ──
  const bannerEl = document.getElementById('profile-banner');
  bannerEl.innerHTML = '';
  if (p.banner_url) {
    const img = document.createElement('img');
    img.src = p.banner_url;
    img.alt = '';
    img.onerror = () => img.remove();
    bannerEl.appendChild(img);
  }

  // ── Avatar ──

  const initial = (p.username?.[0] || '?').toUpperCase();
  av.innerHTML = `<span id="profile-header-initial">${initial}</span>`;
  if (p.pfp_url) {
    const img = document.createElement('img');
    img.src = p.pfp_url;
    img.onload = () => {
      img.classList.add('loaded');
      const span = av.querySelector('span');
      if (span) span.style.display = 'none';
    };

    av.appendChild(img);
  }

  // ── Name + username + verified ──
  document.getElementById('profile-header-name').textContent = p.display_name || p.username;
  document.getElementById('profile-header-username').textContent = '@' + p.username;
  document.getElementById('profile-verified-icon').style.display = p.verified ? 'inline-block' : 'none';

  // ── Stats ──
  document.getElementById('profile-stat-posts').textContent = posts.length;
  document.getElementById('profile-stat-followers').textContent = p.follower_count || 0;
  document.getElementById('profile-stat-following').textContent = p.following_count || 0;

  // ── Actions ──
  renderProfileActions(p, isSelf);

  // ── Bio block ──
  const bioEl = document.getElementById('profile-bio');
  if (p.bio && p.bio.trim()) {
    bioEl.textContent = p.bio;
    bioEl.style.display = '';
  } else {
    bioEl.style.display = 'none';
  }

  // Location
  const locEl = document.getElementById('profile-location');
  if (p.location && p.location.trim()) {
    locEl.querySelector('span').textContent = p.location;
    locEl.style.display = '';
  } else {
    locEl.style.display = 'none';
  }

  // Joined
  const joinEl = document.getElementById('profile-joined');
  if (p.created_at) {
    const d = new Date(p.created_at);
    joinEl.querySelector('span').textContent = 'Joined ' + d.toLocaleDateString([], { month: 'long', year: 'numeric' });
    joinEl.style.display = '';
  } else {
    joinEl.style.display = 'none';
  }

  // CEIN (only if viewing self)
  const ceinEl = document.getElementById('profile-cein');
  if (isSelf && ceinBalance !== null) {
    ceinEl.querySelector('span').textContent = ceinBalance.toLocaleString() + ' CEIN';
    ceinEl.style.display = '';
  } else {
    ceinEl.style.display = 'none';
  }

  // Streak
  const streakEl = document.getElementById('profile-streak');
  if (p.streak && p.streak > 0) {
    streakEl.querySelector('span').textContent = p.streak + ' day streak';
    streakEl.style.display = '';
  } else {
    streakEl.style.display = 'none';
  }

  // ── Links row ──
  const linksRow = document.getElementById('profile-links-row');
  linksRow.innerHTML = '';
  const links = Array.isArray(p.links) ? p.links.filter(l => l && l.label && l.url) : [];
  if (links.length > 0) {
    links.slice(0, 3).forEach(l => {
      const a = document.createElement('a');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'profile-link-pill';
      a.innerHTML = `<i class="fas fa-link"></i> ${window.escapeHTML(l.label)}`;
      linksRow.appendChild(a);
    });
    linksRow.style.display = 'flex';
  } else {
    linksRow.style.display = 'none';
  }

  // ── Pinned post ──
  const pinnedWrap = document.getElementById('profile-pinned-wrap');
  const pinnedContent = document.getElementById('profile-pinned-content');
  if (pinnedPost && profileCanViewPrivate) {
    pinnedWrap.style.display = '';
    pinnedContent.innerHTML = '';
    pinnedContent.appendChild(buildPinnedPostPreview(pinnedPost));
  } else {
    pinnedWrap.style.display = 'none';
  }

  // ── Posts grid / private notice ──
  const postsGrid = document.getElementById('profile-posts-grid');
  const postsEmpty = document.getElementById('profile-posts-empty');
  const privateNotice = document.getElementById('profile-private-notice');
  postsGrid.innerHTML = '';

  if (!profileCanViewPrivate) {
    postsGrid.style.display = 'none';
    postsEmpty.style.display = 'none';
    privateNotice.style.display = 'flex';
  } else if (posts.length === 0) {
    postsGrid.style.display = 'none';
    postsEmpty.style.display = 'flex';
    privateNotice.style.display = 'none';
  } else {
    postsGrid.style.display = 'grid';
    postsEmpty.style.display = 'none';
    privateNotice.style.display = 'none';

    posts.forEach(post => {
      postsGrid.appendChild(buildPostThumb(post));
    });

  // ── About list ──
  renderAboutList(p);
}

function renderProfileActions(p, isSelf) {
  const container = document.getElementById('profile-header-actions');
  container.innerHTML = '';

  if (isSelf) {
    const editBtn = document.createElement('a');
    editBtn.href = '/settings';
    editBtn.className = 'profile-action-btn primary';
    editBtn.innerHTML = '<i class="fas fa-pen"></i> Edit Profile';
    container.appendChild(editBtn);
    return;
  }

  // Follow / Following / Requested / Friends
  let followBtnClass = 'profile-action-btn primary';
  let followBtnHTML = '';
  let followBtnAction = null;

  if (profileIsFollowing && profileIsFriends) {
    followBtnClass = 'profile-action-btn secondary';
    followBtnHTML = '<i class="fas fa-user-check"></i> Friends';
    followBtnAction = 'unfollow';
  } else if (profileIsFollowing) {
    followBtnClass = 'profile-action-btn secondary';
    followBtnHTML = '<i class="fas fa-check"></i> Following';
    followBtnAction = 'unfollow';
  } else if (profileIsPending) {
    followBtnClass = 'profile-action-btn secondary';
    followBtnHTML = '<i class="fas fa-clock"></i> Requested';
    followBtnAction = 'unfollow';
  } else {
    followBtnClass = 'profile-action-btn primary';
    followBtnHTML = profileIsPrivate
      ? '<i class="fas fa-user-plus"></i> Request to Follow'
      : '<i class="fas fa-user-plus"></i> Follow';
    followBtnAction = 'follow';
  }

  const followBtn = document.createElement('button');
  followBtn.className = followBtnClass;
  followBtn.innerHTML = followBtnHTML;
  followBtn.onclick = () => handleFollowClick(followBtnAction);
  container.appendChild(followBtn);

  // Message button
  const msgBtn = document.createElement('a');
  msgBtn.href = '/chat?c=' + encodeURIComponent(dmSlug(window.currentUser?.username, p.username));
  msgBtn.className = 'profile-action-btn secondary';
  msgBtn.innerHTML = '<i class="fas fa-comment"></i> Message';
  container.appendChild(msgBtn);

  // Report button
  const reportBtn = document.createElement('button');
  reportBtn.className = 'profile-action-btn danger';
  reportBtn.title = 'Report profile';
  reportBtn.innerHTML = '<i class="fas fa-flag"></i>';
  reportBtn.onclick = () => {
    window.openQuickReport('user', p.id, p.username);
  };
  container.appendChild(reportBtn);
}

function dmSlug(a, b) {
  if (!a || !b) return '';
  const x = String(a).toLowerCase();
  const y = String(b).toLowerCase();
  return x < y ? `${x}_${y}` : `${y}_${x}`;
}

async function handleFollowClick(action) {
  if (!profileData) return;
  const target = profileData.id;

  try {
    if (action === 'follow') {
      const { data, error } = await window.supabaseClient.rpc('request_follow', {
        p_target_user_id: target
      });
      if (error || !data || !data.ok) {
        window.showToast('Could not follow: ' + (error?.message || data?.reason || 'unknown'), 'error');
        return;
      }

      if (data.status === 'active') {
        profileIsFollowing = true;
        profileIsPending = false;
        window.showToast('Followed ✅', 'success');
      } else if (data.status === 'pending') {
        profileIsPending = true;
        window.showToast('Follow request sent 📨', 'success');
      }

      // Update count locally
      if (profileData) profileData.follower_count = (profileData.follower_count || 0) + 1;
    } else if (action === 'unfollow') {
      const { data, error } = await window.supabaseClient.rpc('unfollow', {
        p_target_user_id: target
      });
      if (error || !data || !data.ok) {
        window.showToast('Could not unfollow', 'error');
        return;
      }

      const wasFollowing = profileIsFollowing;
      profileIsFollowing = false;
      profileIsPending = false;
      profileIsFriends = false;
      window.showToast('Unfollowed', 'info');

      if (wasFollowing && profileData) {
        profileData.follower_count = Math.max(0, (profileData.follower_count || 1) - 1);
      }
    }

    // Re-render actions + stats
    const isSelf = window.session && window.session.user.id === profileData.id;
    renderProfileActions(profileData, isSelf);
    document.getElementById('profile-stat-followers').textContent = profileData.follower_count || 0;
  } catch (e) {
    console.error('handleFollowClick:', e);
    window.showToast('Something went wrong', 'error');
  }
}

function buildPinnedPostPreview(post) {
  const card = document.createElement('div');
  card.className = 'pinned-post-preview';
  card.onclick = () => openPostDetail(post.id);

  const text = (post.content || '').slice(0, 220);

  card.innerHTML = `
    <div class="pinned-post-content">
      ${hasImage ? `<div class="pinned-post-thumb"><img src="${window.escapeHTML(post.image_url)}" loading="lazy" onerror="this.parentElement.remove()"/></div>` : ''}
      <div class="pinned-post-body">
        <div class="pinned-post-text">${window.escapeHTML(text)}${(post.content || '').length > 220 ? '…' : ''}</div>
        <div class="pinned-post-time">${window.timeAgo(post.created_at)}</div>
      </div>
    </div>

function buildPostThumb(post) {
  const thumb = document.createElement('div');
  thumb.className = 'profile-post-thumb';
  thumb.onclick = () => openPostDetail(post.id);

  const content = post.content || '';
  const textOnly = !post.image_url;

  if (post.image_url) {
    thumb.classList.add('has-image');
    const img = document.createElement('img');
    img.src = post.image_url;
    img.loading = 'lazy';
    img.alt = '';
    img.onerror = () => {
      img.remove();
      thumb.classList.remove('has-image');
      thumb.classList.add('text-thumb');
      thumb.innerHTML = buildTextTileContent(content);
    };
    thumb.appendChild(img);
  } else {
    thumb.classList.add('text-thumb');
    thumb.innerHTML = buildTextTileContent(content);
  }

  // Engagement overlay — show likes + comment count if available
  const overlay = document.createElement('div');
  overlay.className = 'profile-post-overlay';
  overlay.innerHTML = `
    <i class="fas fa-heart"></i> ${post.likes || 0}
  `;
  thumb.appendChild(overlay);

  return thumb;
}

function buildTextTileContent(content) {
  if (!content || !content.trim()) {
    return `<div class="text-tile-empty"><i class="fas fa-image"></i></div>`;
  }

  const trimmed = content.trim();
  const plainLen = trimmed.length;

  // Pick a size tier based on length
  let sizeClass = 'text-tile-md';
  if (plainLen < 40) sizeClass = 'text-tile-lg';
  else if (plainLen < 100) sizeClass = 'text-tile-md';
  else if (plainLen < 200) sizeClass = 'text-tile-sm';
  else sizeClass = 'text-tile-xs';

  // For very long text, truncate the raw source before parsing (parseContent
  // adds HTML so trimming after would break tags)
  const maxLen = 320;
  const truncated = plainLen > maxLen ? trimmed.slice(0, maxLen) : trimmed;
  const parsed = parseContent(truncated);
  const ellipsis = plainLen > maxLen ? '<span class="text-tile-ellipsis">…</span>' : '';

  return `
    <div class="text-tile-inner ${sizeClass}">
      <div class="text-tile-body rich">${parsed}${ellipsis}</div>
    </div>
  `;
}

function renderAboutList(p) {
  const container = document.getElementById('profile-about-list');
  container.innerHTML = '';

  const items = [];
  if (p.bio) items.push({ icon: 'fa-quote-left', label: 'Bio', value: p.bio });
  if (p.location) items.push({ icon: 'fa-location-dot', label: 'Location', value: p.location });
  if (p.created_at) items.push({ icon: 'fa-calendar', label: 'Joined', value: new Date(p.created_at).toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' }) });
  const rawRoles = Array.isArray(p.roles) ? p.roles : [];
  if (rawRoles.length > 0) items.push({ icon: 'fa-shield-halved', label: 'Roles', value: rawRoles.join(', ') });
  if (p.last_seen) items.push({ icon: 'fa-clock', label: 'Last seen', value: formatLastSeen(p.last_seen) });

  if (items.length === 0) {
    container.innerHTML = '<div class="profile-about-empty">No info to show</div>';
    return;
  }

  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'profile-about-item';
    el.innerHTML = `
      <div class="profile-about-icon"><i class="fas ${item.icon}"></i></div>
      <div class="profile-about-info">
        <div class="profile-about-label">${window.escapeHTML(item.label)}</div>
        <div class="profile-about-value">${window.escapeHTML(item.value)}</div>
      </div>
    `;
    container.appendChild(el);
  });
}

window.switchProfileTab = function(tab) {
  document.querySelectorAll('.profile-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('profile-posts-view').style.display = tab === 'posts' ? '' : 'none';
  document.getElementById('profile-about-view').style.display = tab === 'about' ? '' : 'none';
};

// ═══════════════════════════════════════════════════════════
// ── POST DETAIL MODAL ──
// ═══════════════════════════════════════════════════════════
async function openPostDetail(postId) {
  const overlay = document.getElementById('post-detail-overlay');
  const body = document.getElementById('post-detail-body');
  body.innerHTML = '<div class="loading-spin-ring" style="margin:60px auto;"></div>';
  overlay.classList.add('show');

  try {
    const { data: post, error } = await window.supabaseClient
      .from('posts')
      .select('*')
      .eq('id', postId)
      .maybeSingle();

    if (error || !post) {
      body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">Post not found</div>';
      return;
    }

    const myId = window.session?.user?.id;
    const isOwn = myId === post.user_id;

    const [likesRes, myLikeRes, commentsRes] = await Promise.all([
      window.supabaseClient.from('likes').select('post_id', { count: 'exact', head: true }).eq('post_id', postId),
      myId ? window.supabaseClient.from('likes').select('post_id').eq('post_id', postId).eq('user_id', myId).maybeSingle() : Promise.resolve({ data: null }),
      window.supabaseClient.from('comments').select('post_id', { count: 'exact', head: true }).eq('post_id', postId),
    ]);

    const likeCount = likesRes.count || 0;
    const commentCount = commentsRes.count || 0;
    const isLiked = !!myLikeRes.data;

    body.innerHTML = '';

    // ── Author row ──
    const author = document.createElement('div');
    author.className = 'post-detail-author';
    const displayName = post.display_name || post.username;
    const pfp = post.pfp_url || window.pfpCache?.[post.username];
    author.innerHTML = `
      <div class="post-detail-avatar" style="${pfp ? `background-image:url('${window.escapeHTML(pfp)}');background-size:cover;background-position:center;` : ''}">${pfp ? '' : window.escapeHTML((post.username?.[0] || '?').toUpperCase())}</div>
      <div>
        <div class="post-detail-name">${window.escapeHTML(displayName)}</div>
        <div class="post-detail-time">${window.timeAgo(post.created_at)}</div>
      </div>
    `;
    body.appendChild(author);

    // ── Content (rich) ──
    if (post.content) {
      const textEl = document.createElement('div');
      textEl.className = 'post-detail-text rich';
      textEl.innerHTML = parseContent(post.content);
      body.appendChild(textEl);
    }

    // ── Image ──
    if (post.image_url) {
      const imgEl = document.createElement('img');
      imgEl.className = 'post-detail-image';
      imgEl.src = post.image_url;
      imgEl.loading = 'lazy';
      imgEl.onerror = () => imgEl.remove();
      body.appendChild(imgEl);
    }

    // ── Actions row ──
    const actions = document.createElement('div');
    actions.className = 'post-detail-actions';

    const likeBtn = document.createElement('button');
    likeBtn.className = 'post-detail-action' + (isLiked ? ' liked' : '');
    likeBtn.innerHTML = `<i class="fas fa-heart"></i> <span class="pd-like-count">${likeCount}</span>`;
    likeBtn.onclick = async () => {
      if (!myId) { window.showToast('Log in first', 'error'); return; }
      const liked = likeBtn.classList.contains('liked');
      const countEl = likeBtn.querySelector('.pd-like-count');
      const current = parseInt(countEl.textContent) || 0;

      likeBtn.classList.toggle('liked', !liked);
      countEl.textContent = liked ? Math.max(0, current - 1) : current + 1;

      if (liked) {
        const { error } = await window.supabaseClient
          .from('likes').delete().eq('post_id', postId).eq('user_id', myId);
        if (error) {
          likeBtn.classList.add('liked');
          countEl.textContent = current;
        }
      } else {
        const { error } = await window.supabaseClient
          .from('likes').insert({ post_id: postId, user_id: myId });
        if (error && error.code !== '23505') {
          likeBtn.classList.remove('liked');
          countEl.textContent = current;
        }
      }
    };
    actions.appendChild(likeBtn);

    const commentBtn = document.createElement('button');
    commentBtn.className = 'post-detail-action';
    commentBtn.innerHTML = `<i class="fas fa-comment"></i> <span class="pd-comment-count">${commentCount}</span>`;
    commentBtn.onclick = () => {
      const section = document.getElementById('pd-comments-section');
      if (section) {
        const isOpen = section.classList.contains('open');
        section.classList.toggle('open', !isOpen);
        if (!isOpen) loadPostDetailComments(postId);
      }
    };
    actions.appendChild(commentBtn);

    if (isOwn) {
      const delBtn = document.createElement('button');
      delBtn.className = 'post-detail-action danger';
      delBtn.innerHTML = '<i class="fas fa-trash"></i>';
      delBtn.title = 'Delete post';
      delBtn.onclick = async () => {
        if (!confirm('Delete this post? No undo.')) return;
        const { error } = await window.supabaseClient
          .from('posts').delete().eq('id', postId).eq('user_id', myId);
        if (error) {
          window.showToast('Delete failed: ' + error.message, 'error');
          return;
        }
        window.showToast('Post deleted', 'success');
        closePostDetail();
        const u = getProfileFromUrl();
        if (u) loadProfilePage(u);
      };
      actions.appendChild(delBtn);
    } else {
      const reportBtn = document.createElement('button');
      reportBtn.className = 'post-detail-action danger';
      reportBtn.innerHTML = '<i class="fas fa-flag"></i>';
      reportBtn.title = 'Report post';
      reportBtn.onclick = () => {
        window.openQuickReport('post', postId, (post.content || '').slice(0, 60));
      };
      actions.appendChild(reportBtn);
    }

    body.appendChild(actions);

    // ── Comments section ──
    const commentsSection = document.createElement('div');
    commentsSection.className = 'pd-comments-section';
    commentsSection.id = 'pd-comments-section';
    commentsSection.innerHTML = `
      <div class="pd-comment-input-row">
        <div class="pd-comment-av" id="pd-comment-av"><span>${(window.currentUser?.username?.[0] || '?').toUpperCase()}</span></div>
        <textarea class="pd-comment-input" id="pd-comment-input-${postId}" placeholder="Add a comment..." rows="1"></textarea>
        <button class="pd-comment-send" onclick="window.submitPostDetailComment('${postId}')">
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
      <div class="pd-comment-list" id="pd-comment-list-${postId}">
        <div class="pd-comment-loading">Tap the comment icon above to load comments</div>
      </div>
    `;
    body.appendChild(commentsSection);

    if (window.currentUser?.pfp_url) {
      const av = commentsSection.querySelector('#pd-comment-av');
      if (av) {
        const span = av.querySelector('span');
        const img = document.createElement('img');
        img.src = window.currentUser.pfp_url;
        img.onload = () => { img.classList.add('loaded'); if (span) span.style.display = 'none'; };
        img.onerror = () => img.remove();
        av.appendChild(img);
      }
    }
  } catch (e) {
    console.error('openPostDetail:', e);
    body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger)">Something went wrong</div>';
  }
}

async function loadPostDetailComments(postId) {
  const list = document.getElementById(`pd-comment-list-${postId}`);
  if (!list) return;
  list.innerHTML = '<div class="pd-comment-loading"><div class="loading-spin-ring" style="width:20px;height:20px;border-width:2px;margin:10px auto;"></div></div>';

  const { data: comments, error } = await window.supabaseClient
    .from('comments')
    .select('*')
    .eq('post_id', postId)
    .order('created_at', { ascending: true });

  if (error) {
    list.innerHTML = '<div class="pd-comment-loading">Failed to load</div>';
    return;
  }

  list.innerHTML = '';
  if (!comments || comments.length === 0) {
    list.innerHTML = '<div class="pd-comment-loading">No comments yet — be the first</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  comments.forEach(c => {
    frag.appendChild(buildPostDetailCommentItem(c, postId));
  });
  list.appendChild(frag);
}

function buildPostDetailCommentItem(c, postId) {
  const isOwn = window.currentUser && c.username === window.currentUser.username;
  const item = document.createElement('div');
  item.className = 'pd-comment-item';

  const initial = (c.username?.[0] || '?').toUpperCase();
  const pfp = window.pfpCache?.[c.username];

  item.innerHTML = `
    <div class="pd-comment-avatar" style="${pfp ? `background-image:url('${window.escapeHTML(pfp)}');background-size:cover;background-position:center;` : ''}">${pfp ? '' : window.escapeHTML(initial)}</div>
    <div class="pd-comment-body">
      <div class="pd-comment-head">
        <span class="pd-comment-who">${window.escapeHTML(c.display_name || c.username)}</span>
        <button class="pd-comment-report ${isOwn ? 'delete' : ''}">
          <i class="fas ${isOwn ? 'fa-trash' : 'fa-flag'}"></i>
        </button>
      </div>
      <div class="pd-comment-text">${window.escapeHTML(c.content || '')}</div>
      <div class="pd-comment-time">${window.timeAgo(c.created_at)}</div>
    </div>
  `;

  const btn = item.querySelector('.pd-comment-report');
  btn.onclick = async (e) => {
    e.stopPropagation();
    if (isOwn) {
      if (!confirm('Delete this comment?')) return;
      const { error } = await window.supabaseClient
        .from('comments').delete().eq('id', c.id).eq('user_id', window.session.user.id);
      if (error) { window.showToast('Delete failed', 'error'); return; }
      window.showToast('Comment deleted', 'success');
      await loadPostDetailComments(postId);
      const countEl = document.querySelector('.pd-comment-count');
      if (countEl) {
        const cur = parseInt(countEl.textContent) || 1;
        countEl.textContent = Math.max(0, cur - 1);
      }
    } else {
      window.openQuickReport('comment', c.id, (c.content || '').slice(0, 60));
    }
  };

  return item;
}

window.submitPostDetailComment = async function(postId) {
  const input = document.getElementById(`pd-comment-input-${postId}`);
  if (!input) return;
  const text = input.value.trim();
  if (!text) { window.showToast('Write a comment first', 'error'); return; }
  if (!window.session) { window.showToast('Log in first', 'error'); return; }

  const btn = input.parentElement.querySelector('.pd-comment-send');
  btn.disabled = true;

  const displayName = window.currentUser.display_name || window.currentUser.username;

  const { data: inserted, error } = await window.supabaseClient
    .from('comments')
    .insert({
      post_id: postId,
      user_id: window.session.user.id,
      username: window.currentUser.username,
      display_name: displayName,
      content: text
    })
    .select('id')
    .single();

  btn.disabled = false;

  if (error) {
    window.showToast('Comment failed: ' + error.message, 'error');
    return;
  }

  if (inserted?.id) {
    try {
      const { data: cein } = await window.supabaseClient.rpc('award_comment_cein', {
        p_comment_id: inserted.id
      });
      if (cein && cein.ok) {
        window.showToast(`💬 +${cein.amount} CEIN`, 'success');
        if (typeof window.loadCEINBalance === 'function') window.loadCEINBalance();
      }
    } catch (e) { console.error('award_comment_cein failed:', e); }
  }

  input.value = '';

  const { data: postRow } = await window.supabaseClient
    .from('posts').select('user_id').eq('id', postId).single();
  if (postRow && postRow.user_id !== window.session.user.id) {
    await window.supabaseClient.from('notifications').insert({
      recipient_id: postRow.user_id,
      actor_username: window.currentUser.username,
      actor_display_name: displayName,
      actor_pfp_url: window.currentUser.pfp_url || null,
      type: 'post_comment',
      ref_id: postId,
      preview: text.slice(0, 80)
    });
  }

  await loadPostDetailComments(postId);
  const countEl = document.querySelector('.pd-comment-count');
  if (countEl) {
    const cur = parseInt(countEl.textContent) || 0;
    countEl.textContent = cur + 1;
  }
};

window.closePostDetail = function(e) {
  if (e && e.target && e.target.id !== 'post-detail-overlay') return;
  document.getElementById('post-detail-overlay').classList.remove('show');
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('post-detail-overlay')?.classList.remove('show');
  }
});

// ═══════════════════════════════════════════════════════════
// ── RESIZE HANDLER ──
// ═══════════════════════════════════════════════════════════
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    if (viewMode === 'cards' && document.getElementById('view-browse').style.display !== 'none') {
      renderCards(getFilteredList());
    }
  }, 200);
});

// ═══════════════════════════════════════════════════════════
// ── PAGE INIT ──
// ═══════════════════════════════════════════════════════════
async function pageInit() {
  definePageSteps();
  nextLoadingStep();  // theme

  loadViewMode();

  nextLoadingStep();  // members
  await loadProfiles();

  nextLoadingStep();  // online
  nextLoadingStep();  // notifs
  nextLoadingStep();  // ready

  // Route check — are we on /profiles?u=username?
  const u = getProfileFromUrl();
  if (u) {
    showProfileView(u);
  } else {
    showBrowseView();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initPage(pageInit);
  });
} else {
  initPage(pageInit);
}
</script>
