<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CESC Hub — Login</title>
<link rel="icon" type="image/x-icon" href="https://uploads.onecompiler.io/43m56waex/44huzak7q/232a0cec-1d90-4e0b-8377-41d13d78b763.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="shared.css"/>

<!-- Load Supabase CDN first -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- Load shared.js -->
<script src="shared.js"></script>

<style>
/* ── LOGIN PAGE SPECIFIC STYLES ── */
body {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-y:auto;
  background:var(--bg);
}

.login-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:44px 40px;
  width:100%;
  max-width:420px;
  max-height:95vh;
  overflow-y:auto;
  position:relative;
  z-index:1;
  backdrop-filter:blur(30px);
  box-shadow:0 40px 90px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.04);
  animation:card-in 0.65s cubic-bezier(0.34,1.56,0.64,1) both;
}
.login-card::-webkit-scrollbar { width:3px; }
.login-card::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
@keyframes card-in {
  from{opacity:0;transform:translateY(36px) scale(0.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.login-card::before {
  content:'';
  position:absolute;
  top:0;
  left:18%;
  right:18%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(74,158,255,0.55),transparent);
}

/* ── LOGO ── */
.logo-wrap { margin-bottom:28px; }
.logo-row {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:5px;
}
.logo-img {
  width:36px;
  height:36px;
  border-radius:10px;
  flex-shrink:0;
  object-fit:contain;
  animation:glow-pulse 3s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%,100%{box-shadow:0 0 8px rgba(74,158,255,0.4)}
  50%{box-shadow:0 0 22px rgba(74,158,255,0.75),0 0 45px rgba(108,92,231,0.35)}
}
.logo-name {
  font-size:1.4rem;
  font-weight:800;
  color:var(--text-bright);
  letter-spacing:-0.01em;
}
.logo-name em { color:var(--neon); font-style:normal; }
.logo-sub {
  font-size:0.76rem;
  font-family:'Space Mono',monospace;
  color:var(--muted);
}

/* ── PRIVACY NOTICE ── */
.privacy-notice {
  margin-top:14px;
  padding:10px 14px;
  background:rgba(74,158,255,0.05);
  border-radius:8px;
  border-left:3px solid var(--neon);
}
.privacy-notice p {
  font-size:0.7rem;
  color:var(--muted);
  font-family:'Space Mono',monospace;
  line-height:1.6;
}
.privacy-notice strong { color:var(--text-bright); }

/* ── FORM FIELDS ── */
.field { margin-bottom:16px; }
.field label {
  display:block;
  font-size:0.72rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.09em;
  color:var(--muted);
  margin-bottom:7px;
  transition:color 0.2s;
}
.field:focus-within label { color:var(--neon); }
.input-wrap { position:relative; }
.field input {
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px 16px;
  color:var(--text-bright);
  font-family:'Syne',sans-serif;
  font-size:0.92rem;
  outline:none;
  transition:all 0.25s;
}
[data-theme="light"] .field input { background:rgba(0,0,0,0.03); }
.field input:focus {
  border-color:rgba(74,158,255,0.5);
  background:rgba(255,255,255,0.06);
  box-shadow:0 0 0 3px rgba(74,158,255,0.09);
}
.field input::placeholder { color:var(--muted); }
.field input.padded { padding-right:46px; }
.eye-btn {
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:44px;
  background:none;
  border:none;
  cursor:pointer;
  color:var(--muted);
  font-size:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:color 0.2s;
  border-radius:0 11px 11px 0;
}
.eye-btn:hover { color:var(--text-bright); }
.hint {
  text-align:right;
  font-size:0.67rem;
  font-family:'Space Mono',monospace;
  color:var(--muted);
  margin-top:5px;
}

/* ── BUTTON ── */
.btn {
  width:100%;
  padding:13px;
  border-radius:11px;
  border:none;
  cursor:pointer;
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:0.95rem;
  background:linear-gradient(135deg,var(--neon),var(--neon2));
  background-size:200% 100%;
  background-position:0% 50%;
  color:#000;
  transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);
  margin-top:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  position:relative;
  overflow:hidden;
}
.btn::after {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.28),transparent);
  transform:translateX(-100%);
  transition:transform 0.5s;
}
.btn:hover {
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 0 28px rgba(74,158,255,0.5),0 8px 24px rgba(0,0,0,0.4);
  background-position:100% 50%;
}
.btn:hover::after { transform:translateX(100%); }
.btn:active { transform:scale(0.97); }
.btn:disabled {
  opacity:0.45;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}
.spinner {
  width:17px;
  height:17px;
  border:2px solid rgba(0,0,0,0.2);
  border-top-color:#000;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
  display:none;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ── ERROR MESSAGE ── */
.msg {
  border-radius:10px;
  padding:11px 14px;
  font-size:0.83rem;
  margin-top:14px;
  display:none;
  align-items:center;
  gap:8px;
  animation:msg-pop 0.3s ease both;
}
@keyframes msg-pop {
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:translateY(0)}
}
.msg.show { display:flex; }
.msg.error {
  background:rgba(255,77,109,0.1);
  border:1px solid rgba(255,77,109,0.3);
  color:var(--danger);
}
@keyframes shake {
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-9px)}
  30%{transform:translateX(9px)}
  45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
  90%{transform:translateX(3px)}
}

/* ── DIVIDER ── */
.divider {
  height:1px;
  background:var(--border);
  margin:26px 0;
}

/* ── FOOTER ── */
.footer-link {
  text-align:center;
  font-size:0.83rem;
  color:var(--muted);
}
.footer-link a {
  color:var(--neon);
  text-decoration:none;
  font-weight:700;
}
.footer-link a:hover { text-decoration:underline; }

/* ── RESPONSIVE ── */
@media(max-width:480px) {
  .login-card { padding:30px 20px; }
  .logo-name { font-size:1.2rem; }
  .privacy-notice p { font-size:0.65rem; }
}
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="toast" id="toast"></div>

<div class="login-card" id="card">
  <div class="logo-wrap">
    <div class="logo-row">
      <img class="logo-img" src="https://uploads.onecompiler.io/43m56waex/44huzak7q/232a0cec-1d90-4e0b-8377-41d13d78b763.png" alt="CESC Hub"/>
      <span class="logo-name">CESC <em>Hub</em></span>
    </div>
    <div class="logo-sub">// Community hub for CESC students</div>
    
    <div class="privacy-notice">
      <p>
        <i class="fas fa-lock" style="color:var(--neon);margin-right:6px;"></i>
        <strong>Only CESC students</strong> can access this app.<br>
        Your login is used <strong>only for this app</strong>.<br>
        No data is shared or stored anywhere else.
      </p>
    </div>
  </div>
  
  <div class="field">
    <label>Username or Email</label>
    <input type="text" id="login-input" placeholder="username or email" autocomplete="username" onkeydown="onEnter(event)"/>
  </div>
  
  <div class="field">
    <label>Password</label>
    <div class="input-wrap">
      <input type="password" id="password" class="padded" placeholder="••••••••" autocomplete="current-password" onkeydown="onEnter(event)"/>
      <button class="eye-btn" onclick="togglePw()" type="button" id="eye-btn"><i class="fas fa-eye"></i></button>
    </div>
  </div>
  
  <div class="hint">press enter ↵ to continue</div>
  
  <button class="btn" id="login-btn" onclick="login()">
    <span id="btn-text">Login</span>
    <div class="spinner" id="spinner"></div>
  </button>
  
  <div class="msg error" id="err"></div>
  
  <div class="divider"></div>
  
  <div class="footer-link">
    <span style="color:var(--muted); font-size:0.8rem;">
      No account? 
      <a href="mailto:irfanchowdhurycesc@gmail.com" 
         style="color:var(--neon); text-decoration:none; font-weight:700;">
        Hit me up
      </a>
      and I'll make one for you ✌️
    </span>
    <br>
    <span style="color:var(--muted); font-size:0.65rem; font-family:'Space Mono',monospace; display:block; margin-top:4px;">
      (just tell me your desired username)
    </span>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://wojbqixkarjlvbgublsg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvamJxaXhrYXJqbHZiZ3VibHNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjkxNDYsImV4cCI6MjEwMTY0NTE0Nn0.A2VpByFPSIi9bS8EkAh7VPsgjuiYFfgAyuwIz-sCcas';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Skip login if already logged in
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'index.html';
});

let pwVisible = false;

// ─── DOMAIN LIST ────────────────────────────────
const EMAIL_DOMAINS = [
  'gmail.com',
  'yahoo.com', 
  'outlook.com',
  'hotmail.com',
  'icloud.com'
];

// ─── FIND USER BY ANY DOMAIN ────────────────────
async function findUserByUsername(username) {
  // First try the stored email in profiles
  const { data: profile, error: lookupErr } = await supabase
    .from('profiles')
    .select('email, username')
    .eq('username', username)
    .maybeSingle();

  if (profile && profile.email) {
    return { email: profile.email, matched: true };
  }

  // If not found, try all possible email domains
  for (const domain of EMAIL_DOMAINS) {
    const emailToTry = `${username}@${domain}`;
    
    const { data: user, error } = await supabase
      .from('profiles')
      .select('email, username')
      .eq('email', emailToTry)
      .maybeSingle();

    if (user && user.email) {
      return { email: user.email, matched: true, domain };
    }
  }

  return { email: null, matched: false };
}

window.togglePw = function () {
  pwVisible = !pwVisible;
  document.getElementById('password').type = pwVisible ? 'text' : 'password';
  document.getElementById('eye-btn').innerHTML = pwVisible ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
};

window.onEnter = function (e) { 
  if (e.key === 'Enter') window.login(); 
};

function setLoading(on, label) {
  const btn = document.getElementById('login-btn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btn-text');
  btn.disabled = on;
  spinner.style.display = on ? 'block' : 'none';
  btnText.textContent = on ? (label || 'loading...') : 'Login';
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.className = 'msg error show';
  const card = document.getElementById('card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'shake 0.45s ease';
}

window.login = async function () {
  const raw = document.getElementById('login-input').value.trim();
  const password = document.getElementById('password').value;

  document.getElementById('err').className = 'msg error';

  if (!raw) { showErr('Username or email is required 💀'); return; }
  if (!password) { showErr('Password is required 💀'); return; }

  let emailToUse = raw;

  // ─── IF USERNAME (no @ symbol) ──────────────────
  if (!raw.includes('@')) {
    setLoading(true, 'searching across domains...');

    const result = await findUserByUsername(raw);

    if (!result.matched) {
      setLoading(false);
      showErr(`Username "${raw}" not found on any domain 💀`);
      return;
    }

    emailToUse = result.email;
    console.log(`✅ Found user: ${raw} → ${emailToUse}`);
  }

  setLoading(true, 'signing in...');

  const { error: signInErr } = await supabase.auth.signInWithPassword({
    email: emailToUse,
    password: password,
  });

  setLoading(false);

  if (signInErr) {
    showErr("Wrong password or account doesn't exist 💀");
    return;
  }

  window.location.href = 'index.html';
};
</script>

</body>
</html>
