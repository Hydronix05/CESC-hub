<script>
// ═══════════════════════════════════════════════════════════
// ── LEADERBOARD PAGE LOGIC ──
// ═══════════════════════════════════════════════════════════

let currentTab = 'overall';
let currentSubTab = 'allgames'; // when Games tab active: 'allgames' or a game slug
let myUserId = null;
let gamesCache = [];
let gamesLoaded = false;

function definePageSteps() {
  defineLoadingSteps([
    { id: 'theme', label: 'Loading theme...', technical: 'Applying saved theme preferences' },
    { id: 'auth', label: 'Connecting to Supabase...', technical: 'Checking authentication' },
    { id: 'profile', label: 'Loading your profile...', technical: 'Fetching user data' },
    { id: 'pfp', label: 'Loading profile pictures...', technical: 'Caching avatars' },
    { id: 'leaderboard', label: 'Loading leaderboard...', technical: 'Fetching rankings' },
    { id: 'online', label: 'Loading online users...', technical: 'Counting active users' },
    { id: 'notifs', label: 'Loading notifications...', technical: 'Checking unread count' },
    { id: 'ready', label: 'Done! ✨', technical: 'Leaderboard ready' }
  ]);
}

function formatPlaytimeShort(seconds) {
  if (!seconds || seconds < 1) return '0m';
  const s = Math.floor(seconds);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm';
  return s + 's';
}

function formatOverallValue(score) {
  return Math.round(score) + ' pts';
}

function formatLastSeen(lastSeen) {
  if (!lastSeen) return 'never';
  const diff = Date.now() - new Date(lastSeen).getTime();
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + 'm ago';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ago';
  const day = Math.floor(hr / 24);
  if (day < 7) return day + 'd ago';
  const week = Math.floor(day / 7);
  if (week < 4) return week + 'w ago';
  const date = new Date(lastSeen);
  return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function buildRowBase(rank, userRow, isMe) {
  const row = document.createElement('div');
  row.className = 'lb-row' + (isMe ? ' me' : '');
  row.style.animationDelay = Math.min(rank * 0.02, 0.6) + 's';

  const rankEl = document.createElement('div');
  rankEl.className = 'lb-rank';
  if (rank === 1) {
    rankEl.classList.add('gold');
    rankEl.innerHTML = '<i class="fas fa-crown"></i>';
  } else if (rank === 2) {
    rankEl.classList.add('silver');
    rankEl.textContent = '2';
  } else if (rank === 3) {
    rankEl.classList.add('bronze');
    rankEl.textContent = '3';
  } else {
    rankEl.textContent = rank;
  }
  row.appendChild(rankEl);

  const avatar = window.buildAvatar(userRow.username || '?', userRow.pfp_url || null, 44, 'lb-avatar');
  row.appendChild(avatar);

  const info = document.createElement('div');
  info.className = 'lb-info';
  const displayName = userRow.display_name || userRow.username || '—';
  info.innerHTML = `
    <div class="lb-name">${window.escapeHTML(displayName)}</div>
    <div class="lb-username">@${window.escapeHTML(userRow.username || '—')}</div>
  `;
  row.appendChild(info);

  return row;
}

function buildOverallRow(rank, data, isMe) {
  const row = buildRowBase(rank, data, isMe);

  const playMin = (data.playtime_seconds || 0) / 60;
  const streak = data.streak || 0;
  const playScore = playMin * 0.5;
  const streakScore = streak * 15;
  const totalScore = playScore + streakScore;

  const value = document.createElement('div');
  value.className = 'lb-value';
  value.innerHTML = `
    <div class="lb-value-main">${formatOverallValue(totalScore)}</div>
    <div class="lb-value-sub">${Math.round(playScore)} play + ${Math.round(streakScore)} streak</div>
  `;
  row.appendChild(value);

  return row;
}

function buildAllGamesRow(rank, data, isMe) {
  const row = buildRowBase(rank, data, isMe);

  const total = data.total_seconds || 0;
  const gameCount = data.game_count || 0;

  const value = document.createElement('div');
  value.className = 'lb-value';
  value.innerHTML = `
    <div class="lb-value-main">${formatPlaytimeShort(total)}</div>
    <div class="lb-value-sub">${gameCount} game${gameCount === 1 ? '' : 's'}</div>
  `;
  row.appendChild(value);

  return row;
}

function buildSingleGameRow(rank, data, isMe, gameTitle) {
  const row = buildRowBase(rank, data, isMe);

  const value = document.createElement('div');
  value.className = 'lb-value';
  value.innerHTML = `
    <div class="lb-value-main">${formatPlaytimeShort(data.total_seconds)}</div>
    <div class="lb-value-sub">${window.escapeHTML(gameTitle || 'playtime')}</div>
  `;
  row.appendChild(value);

  return row;
}

function buildStreakRow(rank, data, isMe) {
  const row = buildRowBase(rank, data, isMe);

  const streak = data.streak || 0;
  const value = document.createElement('div');
  value.className = 'lb-value';
  value.innerHTML = `
    <div class="lb-value-main"><i class="fas fa-fire" style="color:var(--yellow);font-size:0.75rem;margin-right:2px;"></i>${streak} day${streak === 1 ? '' : 's'}</div>
    <div class="lb-value-sub">current streak</div>
  `;
  row.appendChild(value);

  return row;
}

function buildLastSeenRow(rank, data, isMe) {
  const row = buildRowBase(rank, data, isMe);

  const isOnline = data.last_seen && (Date.now() - new Date(data.last_seen).getTime()) < 2 * 60 * 1000;

  const value = document.createElement('div');
  value.className = 'lb-value';
  value.innerHTML = `
    <div class="lb-value-main" style="${isOnline ? 'color: var(--neon);' : ''}">
      ${isOnline ? '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--neon);margin-right:6px;box-shadow:0 0 6px var(--neon-glow);"></span>Online' : formatLastSeen(data.last_seen)}
    </div>
    <div class="lb-value-sub">${isOnline ? 'right now' : 'last seen'}</div>
  `;
  row.appendChild(value);

  return row;
}

function renderEmpty(message, iconClass = 'fa-trophy') {
  const list = document.getElementById('lb-list');
  list.innerHTML = `
    <div class="lb-empty">
      <div class="lb-empty-icon"><i class="fas ${iconClass}"></i></div>
      <div>${window.escapeHTML(message)}</div>
    </div>
  `;
}

function renderSkeleton(count = 3) {
  const list = document.getElementById('lb-list');
  list.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const skel = document.createElement('div');
    skel.className = 'lb-skel-row';
    list.appendChild(skel);
  }
}

// ── LOAD GAMES LIST (only once) ──
async function loadGamesList() {
  if (gamesLoaded) return gamesCache;
  try {
    const { data, error } = await window.supabaseClient
      .from('games')
      .select('id, slug, title, icon')
      .eq('active', true)
      .order('featured', { ascending: false })
      .order('created_at', { ascending: false });
    if (error) {
      console.error('loadGamesList:', error);
      return [];
    }
    gamesCache = data || [];
    gamesLoaded = true;
    return gamesCache;
  } catch (e) {
    console.error('loadGamesList exception:', e);
    return [];
  }
}

// ── RENDER SUB-TABS ──
async function renderSubTabs() {
  const container = document.getElementById('lb-subtabs');
  if (!container) return;

  const games = await loadGamesList();

  container.innerHTML = '';

  // Always show "All Games" first
  const allBtn = document.createElement('button');
  allBtn.className = 'lb-subtab' + (currentSubTab === 'allgames' ? ' active' : '');
  allBtn.innerHTML = '<i class="fas fa-layer-group"></i> <span>All Games</span>';
  allBtn.onclick = () => switchSubTab('allgames');
  container.appendChild(allBtn);

  // One sub-tab per active game
  games.forEach(game => {
    const btn = document.createElement('button');
    btn.className = 'lb-subtab' + (currentSubTab === game.slug ? ' active' : '');
    const iconClass = game.icon || 'fa-gamepad';
    btn.innerHTML = `<i class="fas ${iconClass}"></i> <span>${window.escapeHTML(game.title)}</span>`;
    btn.onclick = () => switchSubTab(game.slug);
    container.appendChild(btn);
  });

  container.style.display = 'flex';
}

function hideSubTabs() {
  const container = document.getElementById('lb-subtabs');
  if (container) container.style.display = 'none';
}

// ── OVERALL ──
async function loadOverallTab() {
  renderSkeleton(5);

  try {
    const [profilesRes, playtimeRes] = await Promise.all([
      window.supabaseClient
        .from('profiles')
        .select('id, username, display_name, pfp_url, streak, created_at, last_seen'),
      window.supabaseClient
        .from('game_playtime')
        .select('user_id, total_seconds')
    ]);

    if (profilesRes.error) {
      console.error('profiles:', profilesRes.error);
      renderEmpty('Failed to load rankings', 'fa-triangle-exclamation');
      return;
    }

    const profiles = profilesRes.data || [];
    const playtimeRows = playtimeRes.data || [];

    const playtimeByUser = {};
    playtimeRows.forEach(p => {
      playtimeByUser[p.user_id] = (playtimeByUser[p.user_id] || 0) + Number(p.total_seconds || 0);
    });

    const rows = profiles.map(p => {
      const playSec = playtimeByUser[p.id] || 0;
      const playMin = playSec / 60;
      const streak = p.streak || 0;
      const score = (streak * 15) + (playMin * 0.5);

      return {
        user_id: p.id,
        username: p.username,
        display_name: p.display_name,
        pfp_url: p.pfp_url,
        streak,
        playtime_seconds: playSec,
        score,
        created_at: p.created_at || '1970-01-01T00:00:00Z',
        last_seen: p.last_seen || null
      };
    });

    rows.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      if (b.streak !== a.streak) return b.streak - a.streak;
      if (b.playtime_seconds !== a.playtime_seconds) return b.playtime_seconds - a.playtime_seconds;
      const aSeen = a.last_seen ? new Date(a.last_seen).getTime() : 0;
      const bSeen = b.last_seen ? new Date(b.last_seen).getTime() : 0;
      if (bSeen !== aSeen) return bSeen - aSeen;
      return new Date(a.created_at) - new Date(b.created_at);
    });

    const top = rows.slice(0, 50);
    const list = document.getElementById('lb-list');
    list.innerHTML = '';
    top.forEach((row, i) => {
      const isMe = row.user_id === myUserId;
      list.appendChild(buildOverallRow(i + 1, row, isMe));
    });

    if (top.length === 0) renderEmpty('No players yet', 'fa-users');
  } catch (e) {
    console.error('loadOverallTab:', e);
    renderEmpty('Failed to load rankings', 'fa-triangle-exclamation');
  }
}

// ── ALL GAMES ──
async function loadAllGamesTab() {
  renderSkeleton(3);

  try {
    const { data: playtimeRows, error: ptErr } = await window.supabaseClient
      .from('game_playtime')
      .select('user_id, username, display_name, pfp_url, total_seconds');

    if (ptErr) {
      console.error('allgames playtime:', ptErr);
      renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
      return;
    }

    if (!playtimeRows || playtimeRows.length === 0) {
      renderEmpty('Nobody has played any games yet. Be the first!', 'fa-gamepad');
      return;
    }

    const byUser = {};
    playtimeRows.forEach(row => {
      const uid = row.user_id;
      if (!byUser[uid]) {
        byUser[uid] = {
          user_id: uid,
          username: row.username,
          display_name: row.display_name,
          pfp_url: row.pfp_url,
          total_seconds: 0,
          games: new Set()
        };
      }
      byUser[uid].total_seconds += Number(row.total_seconds || 0);
      byUser[uid].games.add(row.game_id);
      if (!byUser[uid].display_name && row.display_name) byUser[uid].display_name = row.display_name;
      if (!byUser[uid].pfp_url && row.pfp_url) byUser[uid].pfp_url = row.pfp_url;
    });

    const rows = Object.values(byUser).map(u => ({
      user_id: u.user_id,
      username: u.username,
      display_name: u.display_name,
      pfp_url: u.pfp_url,
      total_seconds: u.total_seconds,
      game_count: u.games.size
    }));

    rows.sort((a, b) => {
      if (b.total_seconds !== a.total_seconds) return b.total_seconds - a.total_seconds;
      return (a.username || '').localeCompare(b.username || '');
    });

    const top = rows.slice(0, 50);
    const list = document.getElementById('lb-list');
    list.innerHTML = '';
    top.forEach((row, i) => {
      const isMe = row.user_id === myUserId;
      list.appendChild(buildAllGamesRow(i + 1, row, isMe));
    });
  } catch (e) {
    console.error('loadAllGamesTab:', e);
    renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
  }
}

// ── SINGLE GAME ──
async function loadSingleGameTab(gameSlug) {
  renderSkeleton(3);

  const game = gamesCache.find(g => g.slug === gameSlug);
  const gameTitle = game?.title || gameSlug;

  try {
    const { data, error } = await window.supabaseClient
      .from('game_playtime')
      .select('user_id, username, display_name, pfp_url, total_seconds')
      .eq('game_id', gameSlug)
      .order('total_seconds', { ascending: false })
      .limit(50);

    if (error) {
      console.error('single game:', error);
      renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
      return;
    }

    const rows = data || [];

    if (rows.length === 0) {
      renderEmpty(`Nobody has played ${gameTitle} yet. Be the first!`, 'fa-gamepad');
      return;
    }

    const list = document.getElementById('lb-list');
    list.innerHTML = '';
    rows.forEach((row, i) => {
      const isMe = row.user_id === myUserId;
      list.appendChild(buildSingleGameRow(i + 1, row, isMe, gameTitle));
    });
  } catch (e) {
    console.error('loadSingleGameTab:', e);
    renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
  }
}

// ── STREAK ──
async function loadStreakTab() {
  renderSkeleton(3);

  try {
    const { data, error } = await window.supabaseClient
      .from('profiles')
      .select('id, username, display_name, pfp_url, streak')
      .gt('streak', 0)
      .order('streak', { ascending: false })
      .limit(50);

    if (error) {
      console.error('streak:', error);
      renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
      return;
    }

    const rows = data || [];

    if (rows.length === 0) {
      renderEmpty('No active streaks yet. Log in daily to build one!', 'fa-fire');
      return;
    }

    const list = document.getElementById('lb-list');
    list.innerHTML = '';
    rows.forEach((row, i) => {
      const isMe = row.id === myUserId;
      list.appendChild(buildStreakRow(i + 1, row, isMe));
    });
  } catch (e) {
    console.error('loadStreakTab:', e);
    renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
  }
}

// ── LAST ONLINE ──
async function loadLastSeenTab() {
  renderSkeleton(3);

  try {
    const { data, error } = await window.supabaseClient
      .from('profiles')
      .select('id, username, display_name, pfp_url, last_seen')
      .not('last_seen', 'is', null)
      .order('last_seen', { ascending: false })
      .limit(50);

    if (error) {
      console.error('lastseen:', error);
      renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
      return;
    }

    const rows = data || [];

    if (rows.length === 0) {
      renderEmpty('No activity recorded yet', 'fa-clock');
      return;
    }

    const list = document.getElementById('lb-list');
    list.innerHTML = '';
    rows.forEach((row, i) => {
      const isMe = row.id === myUserId;
      list.appendChild(buildLastSeenRow(i + 1, row, isMe));
    });
  } catch (e) {
    console.error('loadLastSeenTab:', e);
    renderEmpty('Failed to load leaderboard', 'fa-triangle-exclamation');
  }
}

// ── TAB SWITCHING ──
window.switchTab = async function (tab) {
  if (tab === currentTab) return;
  currentTab = tab;

  document.querySelectorAll('.lb-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  const sub = document.getElementById('lb-subtitle');
  if (sub) {
    if (tab === 'overall') sub.textContent = 'ranked by (streak × 15) + (playtime × 0.5)';
    else if (tab === 'games') sub.textContent = 'ranked by game playtime';
    else if (tab === 'streak') sub.textContent = 'ranked by current daily streak';
    else if (tab === 'lastseen') sub.textContent = 'ranked by most recent activity';
  }

  if (tab === 'overall') {
    hideSubTabs();
    loadOverallTab();
  } else if (tab === 'games') {
    await renderSubTabs();
    if (currentSubTab === 'allgames') {
      loadAllGamesTab();
    } else {
      loadSingleGameTab(currentSubTab);
    }
  } else if (tab === 'streak') {
    hideSubTabs();
    loadStreakTab();
  } else if (tab === 'lastseen') {
    hideSubTabs();
    loadLastSeenTab();
  }
};

window.switchSubTab = function (subTab) {
  if (subTab === currentSubTab) return;
  currentSubTab = subTab;

  document.querySelectorAll('.lb-subtab').forEach(btn => {
    // match by index: first is 'allgames', rest are games by order
    if (subTab === 'allgames') {
      btn.classList.toggle('active', btn === document.querySelectorAll('.lb-subtab')[0]);
    } else {
      const allBtns = document.querySelectorAll('.lb-subtab');
      const games = gamesCache;
      const gameIndex = games.findIndex(g => g.slug === subTab);
      if (gameIndex >= 0) {
        btn.classList.toggle('active', btn === allBtns[gameIndex + 1]);
      }
    }
  });

  if (subTab === 'allgames') {
    loadAllGamesTab();
  } else {
    loadSingleGameTab(subTab);
  }
};

async function pageInit() {
  definePageSteps();
  nextLoadingStep();

  myUserId = window.session?.user?.id || null;

  nextLoadingStep();
  await loadOverallTab();

  nextLoadingStep();
  nextLoadingStep();
  nextLoadingStep();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initPage(pageInit);
  });
} else {
  initPage(pageInit);
}
</script>
